# Sliding-window attention with a TWO-PASS layer ("swa_2pass"): the short-term store is re-written with what it read (design experiment E2).
# The model runs one segment at a time on a key/value cache and every layer runs twice per segment:
#   pass 1 (read):   y1 = block(h), attention over the cached window plus the segment itself; nothing is written to the cache; y1 is the layer's output (what the next layer gets);
#   pass 2 (write):  the same block and weights on h + g * (y1 - h); queries / keys / values come from the new input; its keys and values are the ones stored, its output is not used.
# Only the update y1 - h is fed back, g is a learned per-channel gain per layer (gain_init 0 = plain SWA at the start). No loop vector, no adaptation matrix: nothing but the cache crosses a
# segment boundary.
# Output of pass 1 is the only mode since E7 (the output of pass 2, pass_output 2, trained far worse and was removed; `pass_output: 1` stays in the config, and building a config that says 2 or
# leaves the key out stops with a message). The FROZEN reference configs/ref/swa_2pass_v1.yaml (never edited) still has pass_output 2, so runs of this file carry `pass_output 2 -> 1` in their diff,
# which is accurate. Everything else is that reference: the H5 recipe of swa_fb (50k steps, curriculum, lr 1e-3, the new parameters at 10x lr).  Review notes, E2 / E3 / E7.
# Sweep (src/launch.py):  model.segment in {32, 64} x seed in {0, 1, 2, ...}
experiment: swa_2pass
project: passkey_swar
data_dir: data_cache/passkey_swar
seed: 0

model:
  kind: swa_2pass
  window: 64
  segment: 32              # tokens per segment; 0 = one segment per window
  gain_init: 0.0           # initial per-channel gain of the fed-back update; 0 = start as plain SWA
  pass_output: 1           # the layer's output is pass 1's (the only mode since E7; a config that says 2 or omits the key is refused)
  n_layers: 2
  d_model: 128
  num_heads: 4

train:
  steps: 50000
  batch_size: 32
  train_ns: [32, 64, 128, 256]
  lr: 1.0e-3
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps: 500
  min_lr_ratio: 0.1
  grad_clip: 1.0
  pad_multiple: 256
  precision: bf16
  loop_lr_mult: 10.0       # learning-rate multiplier for the gains
  cuda_graph: true         # one CUDA graph per batch shape (src/graphed.py): the same step, much faster (the per-segment loop is launch-bound)
  curriculum_stage_steps: 2000  # start on N = 32 only and add the next train config every this many steps
  log_every: 50
  eval_every: 2000
  eval_examples: 200
  eval_ns: [32, 64, 128, 256, 512, 1024, 4096, 16384]
  eval_examples_by_n: [[4096, 100], [16384, 32]]

eval:
  splits: [validation, test]
  ns: [32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384]
  tokens_per_batch: 524288  # = 8 streams at N = 16384
