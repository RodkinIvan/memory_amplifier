# FROZEN reference config 'swa_va_v1' (a copy of configs/swa_va.yaml as of 2026-10-08). Never edit this file: every run's stored config is
# compared against it (src/config.py reference_diff), so a changed reference would silently relabel finished runs. A new recipe gets a new file.
# Sliding-window attention with VALUE ADAPTATION ("swa_va"): the short-term store itself carries the long-term memory.
# The model runs one segment at a time on a key/value cache. Per layer and segment, the layer's outputs o_j on the previous segment give
# keys a_j = tanh(W_y norm(o_j)) and values b_j = tanh(W_x norm(o_j)); the values of every token of the next segment get the extra term
#     dv_t = (gain / C) * sum_j b_j <a_j, h_t>        (h_t = the normalised input of W_v; C = segment length)
# i.e. W_v is adapted at test time by a low-rank (<= C) associative matrix. Queries and keys are unchanged, there is no other loop (no m),
# and each value is computed once, with the adaptation of its own segment, and then stays in the cache. gain is one learned scalar per
# layer, initialised to 0 (the model starts as plain SWA). Reference recipe = the H5 recipe of swa_fb (50k steps, curriculum, gain 0).
# Review notes, design experiment E1 (2026-10-08).  Sweep (src/launch.py):  model.segment in {32, 8} x seed in {0, 1, 2}
experiment: swa_va
project: passkey_swar
data_dir: data_cache/passkey_swar
seed: 0

model:
  kind: swa_va
  window: 64
  segment: 32              # tokens per segment (= rank bound of the adaptation); 0 = one segment per window
  gain_init: 0.0           # initial scale of the adaptation; 0 = start as plain SWA
  proj_std: 0.1            # init std of W_x and W_y
  n_layers: 2
  d_model: 128
  num_heads: 4

train:
  steps: 50000
  batch_size: 32
  train_ns: [32, 64, 128, 256]
  lr: 1.0e-3
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps: 500
  min_lr_ratio: 0.1
  grad_clip: 1.0
  pad_multiple: 256
  precision: bf16
  loop_lr_mult: 10.0       # learning-rate multiplier for the adaptation parameters (W_x, W_y, gain, norm)
  cuda_graph: true         # one CUDA graph per batch shape (src/graphed.py): the same step, 3.6x faster at segment 8 (the per-segment loop is launch-bound)
  passkey_weight: 1.0
  curriculum_stage_steps: 2000  # start on N = 32 only and add the next train config every this many steps
  passkey_weight_anneal_steps: 0
  log_every: 50
  eval_every: 2000
  eval_examples: 200
  eval_ns: [32, 64, 128, 256, 512, 1024, 4096, 16384]
  eval_examples_by_n: [[4096, 100], [16384, 32]]

eval:
  splits: [validation, test]
  ns: [32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384]
  tokens_per_batch: 524288  # = 8 streams at N = 16384
