# Sliding-window attention + segment feedback loop ("memory amplification", first version).
# Once per segment every layer turns its output into one vector, m = mean over the segment of nonlin(proj(norm(y))),
# which is added (learned per-channel gain) to that layer's input at every token of the NEXT segment.
# Defaults = the recipe found in the 12k-step exploration (wandb group swa_fb_explore): a stream-length curriculum
# (n32 -> n64 -> n128 -> n256, one stage per 2000 steps), loop parameters at 10x learning rate, small non-zero gain init.
# Since E7 the model has only the key/value cache path (`kv_cache: true`, below); the noise option, the tail-recompute path and the passkey-loss weighting were removed (see config.REMOVED_IN).
# Sweep (src/launch.py):  model.nonlin in {tanh, none} x model.segment in {64, 32, 16} (window fixed at 64) x seed
experiment: swa_fb
project: passkey_swar
data_dir: data_cache/passkey_swar
seed: 0

model:
  kind: swa_fb
  window: 64
  segment: 0               # tokens per segment; 0 = one segment per window
  nonlin: tanh             # tanh (bounded, fixed points) | none (no tanh; the RMSNorm stays, so the loop is still not linear) | gelu
  gain_init: 0.1           # injection gain at init; 0 = start as plain SWA (gain 1 stalls early learning)
  proj_std: 0.1            # init std of the loop projection
  kv_cache: true           # the only path since E7 (the keys and values of the last W-1 tokens come from a cache); a config that says false or omits the key is refused
  n_layers: 2
  d_model: 128
  num_heads: 4

train:
  steps: 20000
  batch_size: 32
  train_ns: [32, 64, 128, 256]
  lr: 1.0e-3
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps: 500
  min_lr_ratio: 0.1
  grad_clip: 1.0
  pad_multiple: 256
  precision: bf16
  loop_lr_mult: 10.0       # learning-rate multiplier for the feedback-loop parameters
  curriculum_stage_steps: 2000  # >0: start on the first train config only and add the next one every this many steps
  log_every: 50
  eval_every: 2000
  eval_examples: 200
  eval_ns: [32, 64, 128, 256, 512, 1024]

eval:
  splits: [validation, test]
  ns: [32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384]
  tokens_per_batch: 524288  # = 8 streams at N = 16384. Measured on N = 16384 (peak GiB / s per 1000 streams): segment 16: 8.3 / 533 at 2097152, 2.3 / 833 at 524288, 1.3 / 1614 at 262144;
                            # segment 64: 5.1 / 46, 1.3 / 187, 0.7 / 371. The large batch caused out-of-memory losses on a shared GPU; this keeps the peak near 2 GiB at 1.6-4x the time.
