<style>

:root {

  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {

    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --seq0: #14294a; --seq1: #1c5cab; --seq2: #3987e5; --seq3: #86b6ef; --seq4: #cde2fb;
    --ord0: #cde2fb; --ord1: #6da7ec; --ord2: #2a78d6; --ord3: #1c5cab;
    --good: #5fd98a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --nodata: #262624;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;

body { background: var(--page); color: var(--ink); font: 15px/1.6 var(--sans); margin: 0; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }
h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 6px; font-weight: 600; text-wrap: balance; }
h2 { font-size: 1.2rem; margin: 40px 0 10px; font-weight: 600; text-wrap: balance; }
h3 { font-size: 1rem; margin: 0 0 4px; font-weight: 600; }
p { margin: 0 0 10px; max-width: 70ch; }
.meta { color: var(--ink-2); font-size: .9rem; margin: 0 0 22px; }
code, .mono { font-family: var(--mono); font-size: .88em; }
.summary { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; }
.summary ol { margin: 8px 0 0; padding-left: 1.2em; display: grid; gap: 8px; }
.summary li { max-width: 78ch; }
.status { display: inline-flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: .85rem; color: var(--ink-2); font-family: var(--mono); }
.status b { color: var(--ink); font-weight: 500; }
figure { margin: 18px 0 0; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 14px 10px; }
figcaption { color: var(--ink-2); font-size: .92rem; margin-top: 8px; }
figcaption p { max-width: 82ch; }
.fig-title { font-weight: 600; font-size: .98rem; }
.fig-sub { color: var(--ink-2); font-size: .86rem; margin: 0 0 8px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { font-family: var(--mono); fill: var(--ink-2); }
.chart text.endlabel { paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.hm-scroll { overflow-x: auto; }
.hm-scroll svg { min-width: 640px; }
.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .84rem; color: var(--ink-2); margin: 4px 0 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.legend i.line { width: 18px; height: 0; border-radius: 0; border-top: 2px solid; vertical-align: 3px; }
.legend i.dash { width: 18px; height: 0; border-radius: 0; border-top: 2px dashed; vertical-align: 3px; }
.pbar { display: grid; grid-template-columns: minmax(150px, 290px) minmax(0, 1fr); gap: 2px 12px; align-items: center; margin: 5px 0; font-size: .8rem; color: var(--ink-2); }
.pbar .stack { display: flex; height: 22px; border-radius: 3px; overflow: hidden; border: 1px solid var(--border); }
.pbar .stack i { display: block; min-width: 0; font: 10.5px/22px var(--mono); text-align: center; font-style: normal; overflow: hidden; }
details { margin-top: 8px; font-size: .86rem; }
summary { cursor: pointer; color: var(--ink-2); }
summary:focus-visible, a:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.tbl { overflow-x: auto; margin-top: 6px; }
table { border-collapse: collapse; font-family: var(--mono); font-size: .8rem; font-variant-numeric: tabular-nums; }
th, td { padding: 3px 9px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
.tbl.kv th, .tbl.kv td { text-align: left; white-space: normal; vertical-align: top; }
.tbl.wide td:first-child { white-space: normal; min-width: 240px; max-width: 420px; }
.hint { color: var(--muted); font-size: .72rem; }
th { color: var(--ink-2); font-weight: 500; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-top: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.card p { font-size: .9rem; }
ul.tight { margin: 4px 0 10px; padding-left: 1.2em; display: grid; gap: 4px; max-width: 82ch; }
.tag { font-family: var(--mono); font-size: .75rem; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--border); color: var(--ink-2); white-space: nowrap; }
.tag.ok { color: var(--good); border-color: var(--good); }
#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--page); font: 12px/1.45 var(--mono); padding: 6px 9px; border-radius: 5px; max-width: 300px; display: none; }
@media (max-width: 520px) { h1 { font-size: 1.5rem; } .wrap { padding-block: 20px 48px; } .pbar { grid-template-columns: 1fr; } }

3, "valid": 0.9999987001609201, "stale": 0.9999986176255508, "expired": 0.9999987042133798, "n_examples": 1000, "n_valid": 256442, "n_stale": 241131, "per": {"passkey": [0.0, 0.0, 1.0], "valid": [1.0, 0.9999961004827602, 1.0], "stale": [1.0, 0.9999958528766522, 1.0], "expired": [1.0, 0.9999961126401393, 1.0]}}, "4096": {"passkey": 0.3333333333333333, "valid": 0.9999915397465959, "stale": 1.0, "expired": 1.0, "n_examples": 1000, "n_valid": 512199, "n_stale": 495568, "per": {"passkey": [0.0, 0.0, 1.0], "valid": [1.0, 1.0, 0.9999746192397877], "stale": [1.0, 1.0, 1.0], "expired": [1.0, 1.0, 1.0]}}, "8192": {"passkey": 0.32266666666666666, "valid": 0.9998904954980938, "stale": 1.0, "expired": 1.0, "n_examples": 1000, "n_valid": 1022789, "n_stale": 1006975, "per": {"passkey": [0.0, 0.0, 0.968], "valid": [1.0, 0.9999990222812329, 0.9996724642130488], "stale": [1.0, 1.0, 1.0], "expired": [1.0, 1.0, 1.0]}}, "16384": {"passkey": 0.050666666666666665, "valid": 0.9992628183667541, "stale": 0.999999014776869, "expired": 0.9999990227236303, "n_examples": 1000, "n_valid": 2046081, "n_stale": 2029997, "per": {"passkey": [0.0, 0.0, 0.152], "valid": [1.0, 0.9999990225215912, 0.9977894325786711], "stale": [0.9999995073884346, 0.9999985221653037, 0.9999990147768691], "expired": [0.9999995113618151, 0.9999985340854453, 0.9999990227236302]}}}}, "scatter_ns": [], "hide_scatter": true, "label_w": 352, "row_name": "configuration", "row_prefix": "", "meta": "Design experiment E2, results of 14 Oct 2026, 05:37. Test split, N counts AR writes, one write is about 3.75 tokens. Every row is one configuration; seeds are averaged only within a configuration.", "tldr": ["<b>Idea.</b> No loop vector, no adaptation matrix: the only thing that crosses a segment boundary is the sliding-window key/value cache, and the cache is re-written with what the layer read. Per segment every layer runs twice: pass 1 reads the window (cached entries plus the segment, causal) and stores nothing; pass 2 re-runs the same block on h + g \u2299 (y1 \u2212 h), the input plus the gained update of pass 1, with queries, keys and values all from that new input, and only its keys and values are stored. Memory persists only by being re-read and re-written. g is one learned gain per channel and layer (0 at the start, so the model starts as plain SWA); the next layer gets the output of pass 1 (the default of the working config since E3) or of pass 2 (the frozen reference recipe uses pass 2; runs of the working config carry that difference in their diff). 530,304 parameters, window 64, 2 layers.", "<b>Two-pass, segment 32, output of pass 2.</b> Passkey exact match 0.19 / 0.00 / 0.00 / 0.00 (mean of 3 seeds, test) at N = 256 / 1,024 / 4,096 / 16,384; per seed at N = 1,024 0.01 / 0.00 / 0.00, at N = 16,384 0.00 / 0.00 / 0.00; the mean never reaches 0.9. The vector loop m at segment 32 scores 0.99 / 0.58 / 0.00 / 0.00 (per seed at 1,024: 0.67 / 0.37 / 0.70).", "<b>Two-pass, segment 32, output of pass 2, gain 0.1 at the start.</b> Passkey exact match 0.00 / 0.00 / 0.00 / 0.00 (mean of 1 seed, test) at N = 256 / 1,024 / 4,096 / 16,384; per seed at N = 1,024 0.00, at N = 16,384 0.00; the mean never reaches 0.9. The vector loop m at segment 32 scores 0.99 / 0.58 / 0.00 / 0.00 (per seed at 1,024: 0.67 / 0.37 / 0.70).", "<b>Two-pass, segment 32, output of pass 1.</b> Passkey exact match 0.92 / 0.45 / 0.28 / 0.24 (mean of 6 seeds, test) at N = 256 / 1,024 / 4,096 / 16,384; per seed at N = 1,024 0.87 / 0.00 / 0.20 / 0.15 / 0.50 / 0.99, at N = 16,384 0.58 / 0.00 / 0.00 / 0.00 / 0.00 / 0.87; the mean stays at 0.9 or above up to N = 256. The vector loop m at segment 32 scores 0.99 / 0.58 / 0.00 / 0.00 (per seed at 1,024: 0.67 / 0.37 / 0.70).", "<b>Two-pass, segment 64, output of pass 2.</b> Passkey exact match 0.33 / 0.00 / 0.00 / 0.00 (mean of 3 seeds, test) at N = 256 / 1,024 / 4,096 / 16,384; per seed at N = 1,024 0.00 / 0.00 / 0.00, at N = 16,384 0.00 / 0.00 / 0.00; the mean never reaches 0.9. The vector loop m at segment 64 scores 0.89 / 0.44 / 0.22 / 0.16 (per seed at 1,024: 0.46 / 0.30 / 0.57).", "<b>For comparison, same recipe.</b> value adaptation (E1, segment 32) 0.41 / 0.09 / 0.04 at N = 256 / 1,024 / 16,384; plain SWA (window 64) 0.00 at N = 256 and 0.00 at N = 1,024; GDN-2 (mean of 3 seeds) 0.33 / 0.33 / 0.05 at N = 1,024 / 4,096 / 16,384.", "<b>Longer training (E4, segment 32, output of pass 1).</b> 50k steps: 5 of 6 finished seeds learn the training range, 2 of 6 extrapolate; 150k steps: 6 of 6 finished seeds learn the training range, 1 of 6 extrapolate; 50k + 50k more: 1 of 2 finished seeds learn the training range, 0 of 2 extrapolate. Per-seed values and the switch-on steps are in the E4 table.", "<b>Where the passkey is.</b> A linear read-out of each passkey token from the cached window (no passkey token in sight; mean accuracy over the 4 tokens, chance 0.06): swa_2pass_seg32_po1_s0: values 0.98 / 0.95, keys 0.96 / 0.94 at 282 / 2,074 tokens (values, token by token at 2,074: 0.83 / 0.99 / 0.99 / 0.99); plain SWA 0.06 / 0.06; swa_2pass_seg32_po1_s2: values 0.61 / 0.60, keys 0.61 / 0.58 at 282 / 2,074 tokens (values, token by token at 2,074: 0.93 / 0.97 / 0.19 / 0.30); plain SWA 0.06 / 0.06; swa_2pass_seg32_po1_s1: values 0.64 / 0.31, keys 0.57 / 0.22 at 282 / 2,074 tokens (values, token by token at 2,074: 0.20 / 0.29 / 0.43 / 0.32); plain SWA 0.06 / 0.06; swa_2pass_seg32_po2_s0: values 0.37 / 0.31, keys 0.35 / 0.28 at 282 / 2,074 tokens (values, token by token at 2,074: 0.80 / 0.20 / 0.12 / 0.10); plain SWA 0.06 / 0.06; swa_2pass_seg64_po2_s0: values 0.61 / 0.20, keys 0.61 / 0.20 at 314 / 2,106 tokens (values, token by token at 2,106: 0.52 / 0.17 / 0.05 / 0.06); plain SWA 0.06 / 0.06. The window holds at most 63 tokens, so anything read out beyond that was carried by the store being re-written.", "<b>Perturbation in mid-stream</b> (far beyond the reach): swa_2pass_seg32_po1_s0 keeps 0.86 clean, 0.77 with its cached keys and values kicked by 1 \u00d7 RMS, 0.00 with the values zeroed, 0.00 with the keys zeroed; a kick shrinks to 0.01 of its size after 16 segments; swa_2pass_seg32_po1_s2 keeps 0.23 clean, 0.23 with its cached keys and values kicked by 1 \u00d7 RMS, 0.00 with the values zeroed, 0.04 with the keys zeroed; a kick shrinks to 0.08 of its size after 16 segments."], "tested": [], "results_title": "Results", "intro": "<h2>Method</h2><p>The task: remember a 4-token passkey shown once at the start of a stream and repeat it at the end, while answering associative-recall queries about recent key\u2013value writes. A plain sliding-window model cannot do the first part beyond its window. Here the long-term memory is meant to be the short-term store itself, kept alive by rehearsal: each segment, the layer reads the window, and the entries it stores for the segment are re-computed from what it read.</p><figure><div class='fig-title'>One layer, one segment</div><div class='chart'><svg viewBox='0 0 780 330' role='img' aria-label='Two-pass layer: pass 1 reads the cached window and stores nothing; pass 2 re-runs the block on the input plus the gained update and writes keys and values' style='width:100%;height:auto'><style>.tk{fill:var(--s1);opacity:.85}.to{fill:var(--s3);opacity:.85}.bl{fill:var(--surface);stroke:var(--axis);stroke-width:1.2}.ca{fill:var(--surface);stroke:var(--s2);stroke-width:1.6}.ar{stroke:var(--ink-2);stroke-width:1.4;fill:none}.rd{stroke:var(--ink-2);stroke-width:1.2;fill:none;stroke-dasharray:5 4}.wr{stroke:var(--s2);stroke-width:2.4;fill:none}.t{font:11.5px var(--mono);fill:var(--ink-2)}.tb{font:12px var(--mono);fill:var(--ink)}.to2{font:11.5px var(--mono);fill:var(--s2)}</style><defs><marker id='ah' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--ink-2)'/></marker><marker id='ao' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--s2)'/></marker></defs><text x='16' y='16' class='t'>one layer, one segment: h = input, y1 = block(h) read-only, y2 = block(h + g \u2299 (y1 \u2212 h))</text><rect x='20' y='84' width='150' height='150' rx='4' class='ca'/><text x='95' y='116' text-anchor='middle' class='tb'>cache</text><text x='95' y='136' text-anchor='middle' class='t'>keys and values of</text><text x='95' y='152' text-anchor='middle' class='t'>the last W \u2212 1 tokens,</text><text x='95' y='168' text-anchor='middle' class='to2'>as written by pass 2</text><rect x='320' y='286' width='18' height='18' rx='3' class='tk'/><rect x='341' y='286' width='18' height='18' rx='3' class='tk'/><rect x='362' y='286' width='18' height='18' rx='3' class='tk'/><rect x='383' y='286' width='18' height='18' rx='3' class='tk'/><rect x='404' y='286' width='18' height='18' rx='3' class='tk'/><rect x='425' y='286' width='18' height='18' rx='3' class='tk'/><text x='383' y='320' text-anchor='middle' class='tb'>h (segment s)</text><path d='M383 282 L383 248' class='ar' marker-end='url(#ah)'/><rect x='305' y='204' width='156' height='42' rx='4' class='bl'/><text x='383' y='222' text-anchor='middle' class='tb'>pass 1: block(h)</text><text x='383' y='238' text-anchor='middle' class='t'>reads, stores nothing</text><path d='M383 202 L383 170' class='ar' marker-end='url(#ah)'/><text x='392' y='190' class='t'>y1 \u2212 h, \u00d7 g</text><circle cx='383' cy='154' r='15' fill='var(--surface)' stroke='var(--s2)' stroke-width='2'/><text x='383' y='160' text-anchor='middle' style='font:700 16px var(--mono);fill:var(--s2)'>+</text><path d='M322 295 L286 295 L286 154 L366 154' class='ar' marker-end='url(#ah)'/><text x='292' y='146' class='t'>h</text><path d='M383 138 L383 112' class='ar' marker-end='url(#ah)'/><rect x='305' y='68' width='156' height='42' rx='4' class='bl'/><text x='383' y='86' text-anchor='middle' class='tb'>pass 2: block(h2)</text><text x='383' y='102' text-anchor='middle' class='t'>same weights, writes K, V</text><path d='M383 66 L383 40' class='ar' marker-end='url(#ah)'/><text x='392' y='54' class='t'>y2 or y1 \u2192 next layer</text><path d='M172 205 L301 226' class='rd' marker-end='url(#ah)'/><text x='186' y='214' class='t'>read</text><path d='M172 124 L301 96' class='rd' marker-end='url(#ah)'/><text x='186' y='108' class='t'>read</text><path d='M301 80 L174 96' class='wr' marker-end='url(#ao)'/><text x='186' y='78' class='to2'>write K, V</text><text x='510' y='110' class='t'>pass 1 reads the window, no writes</text><text x='510' y='130' class='t'>pass 2: same block and weights,</text><text x='510' y='150' class='t'>writes its keys and values</text><text x='510' y='170' class='t'>g = 0: both passes equal, plain SWA</text><text x='510' y='190' class='t'>only the cache crosses segments</text></svg></div><figcaption>Pass 1 attends over the cached window plus the segment (causal) and writes nothing. Pass 2 is the same block with the same weights on h + g \u2299 (y1 \u2212 h); its queries, keys and values all come from that input, and its keys and values are what later segments see. Both passes use the same positions. With g = 0 pass 2 equals pass 1 and the model is plain sliding-window attention.</figcaption></figure>", "results_intro": "The two-pass layer (segment 32 with the output of either pass, segment 64) against the vector loop m, value adaptation, plain SWA and GDN-2, all with the same recipe (50k steps, stream-length curriculum, 2 layers, window 64).", "fig1_title": "1. Accuracy by configuration and stream length", "fig1_sub": "Rows: the two-pass configurations (mean of the seeds), the vector loop, value adaptation, baselines. Columns: stream length N. Darker is higher.", "valid_title": "AR valid accuracy (key written within the last 16 writes)", "stale_title": "AR expired accuracy, stale keys only (last write more than 32 writes ago)", "cap1": "<p>Top grid: passkey. Middle and bottom grids: the associative-recall half.</p>", "cap2": "", "extra_figs": [{"key": ass_seg32_po1_s2</td><td>1</td><td>+0.90</td><td>1.20</td><td>3.49</td><td>30%</td></tr><tr><td>swa_2pass_seg32_po2_s0</td><td>0</td><td>-0.02</td><td>0.21</td><td>1.17</td><td>60%</td></tr><tr><td>swa_2pass_seg32_po2_s0</td><td>1</td><td>+0.11</td><td>0.26</td><td>2.08</td><td>32%</td></tr><tr><td>swa_2pass_seg32_po2_s1</td><td>0</td><td>-0.05</td><td>0.20</td><td>0.98</td><td>55%</td></tr><tr><td>swa_2pass_seg32_po2_s1</td><td>1</td><td>+0.09</td><td>0.15</td><td>2.44</td><td>19%</td></tr><tr><td>swa_2pass_seg32_po2_s2</td><td>0</td><td>-0.05</td><td>0.23</td><td>0.83</td><td>56%</td></tr><tr><td>swa_2pass_seg32_po2_s2</td><td>1</td><td>+0.04</td><td>0.19</td><td>1.64</td><td>41%</td></tr><tr><td>swa_2pass_seg64_po2_s0</td><td>0</td><td>-0.05</td><td>0.29</td><td>1.06</td><td>53%</td></tr><tr><td>swa_2pass_seg64_po2_s0</td><td>1</td><td>+0.22</td><td>0.31</td><td>1.39</td><td>20%</td></tr><tr><td>swa_2pass_seg64_po2_s1</td><td>0</td><td>-0.03</td><td>0.21</td><td>0.84</td><td>49%</td></tr><tr><td>swa_2pass_seg64_po2_s1</td><td>1</td><td>+0.12</td><td>0.19</td><td>2.42</td><td>20%</td></tr><tr><td>swa_2pass_seg64_po2_s2</td><td>0</td><td>+0.01</td><td>0.27</td><td>1.27</td><td>52%</td></tr><tr><td>swa_2pass_seg64_po2_s2</td><td>1</td><td>+0.16</td><td>0.27</td><td>1.82</td><td>19%</td></tr></tbody></table></div>"}, {"key": "appendix", "title": "13. Every configuration and what differs from the reference recipe", "sub": "37 runs in 13 configurations: runs are grouped by the diff of their stored config against the frozen reference (swa_v1 / swa_fb_v1, seed, logging and evaluation settings ignored), so runs that differ in any other setting are never averaged. Hover the first column for the run names.", "caption": "<p>Reference swa_fb_v1: window 64, 2 layers, tanh loop, segment = window, gain 0.1, 20k steps with the stream-length curriculum; reference swa_v1: window 64, 2 layers, 30k steps, no curriculum.</p>", "spec": null, "html": "<div class='tbl wide'><table><thead seg32_po1_steps50000_s2'>two-pass layer, window 64, segment 32, output of pass 1 \u00b7 init_from None \u2192 runs/swa_2pass_seg32_po1_s2/model.pt<br><span class='hint'>reference swa_2pass_v1; seeds 2</span></td><td>1</td><td>530k</td><td>1.8 h</td><td>1.00</td><td>0.13</td><td>0.00</td><td>0.00</td><td>1.00</td></tr><tr><td title='swa_2pass_seg32_po1_steps150000_s0, swa_2pass_seg32_po1_steps150000_s1, swa_2pass_seg32_po1_steps150000_s2, swa_2pass_seg32_po1_steps150000_s3, swa_2pass_seg32_po1_steps150000_s4, swa_2pass_seg32_po1_steps150000_s5'>two-pass layer, window 64, segment 32, output of pass 1 \u00b7 50000 \u2192 150000 steps<br><span class='hint'>reference swa_2pass_v1; seeds 0, 1, 2, 3, 4, 5</span></td><td>6</td><td>530k</td><td>4.2 h</td><td>1.00 / 0.98 / 1.00 / 1.00 / 1.00 / 1.00</td><td>0.26 / 0.94 / 0.09 / 0.00 / 0.24 / 0.37</td><td>0.00 / 0.77 / 0.00 / 0.00 / 0.00 / 0.00</td><td>0.00 / 0.42 / 0.00 / 0.00 / 0.00 / 0.00</td><td>1.00</td></tr><tr><td title='swa_2pass_seg32_po1_s0, swa_2pass_seg32_po1_s1, swa_2pass_seg32_po1_s2, swa_2pass_seg32_po1_s3, swa_2pass_seg32_po1_s4, swa_2pass_seg32_po1_s5'>two-pass layer, window 64, segment 32, output of pass 1<br><span class='hint'>reference swa_2pass_v1; seeds 0, 1, 2, 3, 4, 5</span></td><td>6</td><td>530k</td><td>1.8 h</td><td>1.00 / 0.53 / 1.00 / 1.00 / 1.00 / 1.00</td><td>0.87 / 0.00 / 0.20 / 0.15 / 0.50 / 0.99</td><td>0.71 / 0.00 / 0.00 / 0.00 / 0.00 / 0.96</td><td>0.58 / 0.00 / 0.00 / 0.00 / 0.00 / 0.87</td><td>1.00</td></tr><tr><td title='swa_2pass_seg32_po2_llr1_s0'>two-pass layer, window 64, segment 32, output of pass 2 \u00b7 loop_lr_mult 10 \u2192 1<br><span class='hint'>reference swa_2pass_v1; seeds 0</span></td><td>1</td><td>530k</td><td>1.7 h</td><td>0.01</td><td>0.00</td><td>0.00</td><td>0.00</td><td>1.00</td></tr><tr><td title='swa_2pass_seg32_po2_s0, swa_2pass_seg32_po2_s1, swa_2pass_seg32_po2_s2'>two-pass layer, window 64, segment 32, output of pass 2<br><span class='hint'>reference swa_2pass_v1; seeds 0, 1, 2</span></td><td>3</td><td>530k</td><td>2.1 h</td><td>0.58 / 0.00 / 0.00</td><td>0.01 / 0.00 / 0.00</td><td>0.00 / 0.00 / 0.00</td><td>0.00 / 0.00 / 0.00</td><td>1.00</td></tr><tr><td title='swa_fb_gi0_seg32_nlnone_steps50000_s0, swa_fb_gi0_seg32_nlnone_steps50000_s1, swa_fb_gi0_seg32_nlnone_steps50000_s2'>window 64, segment 32, no-tanh loop \u00b7 gain_init 0.1 \u2192 0, 20000 \u2192 50000 steps<br><span class='hint'>reference swa_fb_v1; seeds 0, 1, 2</span></td><td>3</td><td>563k</td><td>2.3 h</td><td>0.99 / 1.00 / 0.99</td><td>0.67 / 0.37 / 0.70</td><td>0.00 / 0.00 / 0.01</td><td>0.00 / 0.00 / 0.00</td><td>0.99</td></tr><tr><td title='swa_va_seg32_s0, swa_va_seg32_s1, swa_va_seg32_s2'>value adaptation, window 64, segment 32<br><span class='hint'>reference swa_va_v1; seeds 0, 1, 2</span></td><td>3</td><td>595k</td><td>1.5 h</td><td>0.26 / 0.30 / 0.68</td><td>0.09 / 0.18 / 0.01</td><td>0.03 / 0.12 / 0.00</td><td>0.01 / 0.11 / 0.00</td><td>0.99</td></tr><tr><td title='swa_2pass_seg64_po2_s0, swa_2pass_seg64_po2_s1, swa_2pass_seg64_po2_s2'>two-pass layer, window 64, segment 64, output of pass 2<br><span class='hint'>reference swa_2pass_v1; seeds 0, 1, 2</span></td><td>3</td><td>530k</td><td>1.4 h</td><td>0.99 / 0.00 / 0.00</td><td>0.00 / 0.00 / 0.00</td><td>0.00 / 0.00 / 0.00</td><td>0.00 / 0.00 / 0.00</td><td>1.00</td></tr><tr><td title='swa_fb_gi0_seg64_nltanh_steps50000_s0, swa_fb_gi0_seg64_nltanh_steps50000_s1, swa_fb_gi0_seg64_nltanh_steps50000_s2'>window 64, segment 64, tanh loop \u00b7 gain_init 0.1 \u2192 0, 20000 \u2192 50000 steps<br><span class='hint'>reference swa_fb_v1; seeds 0, 1, 2</span></td><td>3</td><td>563k</td><td>1.2 h</td><td>0.90 / 0.93 / 0.85</td><td>0.46 / 0.30 / 0.57</td><td>0.15 / 0.07 / 0.45</td><td>0.08 / 0.02 / 0.37</td><td>0.99</td></tr></tbody></table></div>"}], "next_title": "Open issues", "next": "<p><b>E4: training budget or seed? (segment 32, output of pass 1.)</b> Learning the training range (test passkey \u2265 0.9 at N = 256): 5 of 6 seeds at 50k steps, 6 of 6 at 150k (two-sided exact test p = 1.00). Extrapolating (\u2265 0.5 at N = 4,096): 2 of 6 against 1 of 6 (p = 1.00); with 6 seeds per arm, rates this far apart cannot be told apart. Tripling the schedule did not raise the mean passkey at N = 1,024 either (0.45 at 50k, 0.32 at 150k). The loop switched on (validation passkey \u2265 0.9 at N = 256) at step 18,000 (median of 5 seeds) at 50k and 23,000 (6 seeds, latest 34,000) at 150k, so the extra steps came long after it. At 150k steps the 5 seeds that do not extrapolate had a validation passkey at N = 4,096 of at most 0.01 at any evaluation of the whole run, and the extrapolating seed already had 0.50 by step 30,000: extrapolation was there early or not at all. Continuing seeds 1 and 2 for another 50k steps (the learning rate warmed up again) gives seed 1: passkey 0.39 at N = 256 (was 0.53), 0.01 at N = 1,024 (was 0.00), 0.00 at N = 4,096; seed 2: passkey 1.00 at N = 256 (was 1.00), 0.13 at N = 1,024 (was 0.20), 0.00 at N = 4,096.</p><p><b>Did the second pass switch on.</b> Seeds with a validation passkey above 0.5 at N = 256 at the end of training: segment 32, output of pass 2: 1 of 3; segment 32, output of pass 2, gain 0.1: 0 of 1; segment 32, output of pass 1: 6 of 6; segment 64, output of pass 2: 1 of 3.</p><p><b>Which pass feeds the next layer (segment 32).</b> Passkey at N = 1,024 per seed: output of pass 2 0.01 / 0.00 / 0.00, output of pass 1 0.87 / 0.00 / 0.20 / 0.15 / 0.50 / 0.99; at N = 16,384: 0.00 / 0.00 / 0.00 against 0.58 / 0.00 / 0.00 / 0.00 / 0.00 / 0.87. With 3 seeds for output 2, 6 for output 1 and a large seed-to-seed spread this is a comparison of tendencies, not a test.</p><p><b>Seeds.</b> The model families so far switch their memory on in some seeds only; the means are the summary, not the best seed.</p><p><b>Pilots (output of pass 2, seed 0, not part of the comparison rows).</b> swa_2pass_seg32_po2_gi0.1_s0 (gain_init 0 \u2192 0.1): 0.00 / 0.00 / 0.00 at N = 32 / 256 / 1,024; swa_2pass_seg32_po2_llr1_s0 (loop_lr_mult 10 \u2192 1): 0.57 / 0.01 / 0.00 at N = 32 / 256 / 1,024.</p>"};
const NS = DATA.ns, ROWS = DATA.rows;
const fmt2 = v => (v == null ? '–' : v.toFixed(2));
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cell = (rk, n) => (DATA.results[rk] || {})[String(n)];
const perTxt = (r, key) => (r && r.per && r.per[key] ? 'seeds: ' + r.per[key].map(v => v == null ? '–' : v.toFixed(2)).join(' / ') : '');

// ---- colour helpers (tokens are read from CSS so both themes work)
function hex2rgb(h) { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); }
function mix(c1, c2, t) { return c1.map((v, i) => Math.round(v + (c2[i] - v) * t)); }
function seqColor(v) {
  const stops = [0, 1, 2, 3, 4].map(i => hex2rgb(cssv('--seq' + i)));
  const x = Math.max(0, Math.min(1, v)) * 4, i = Math.min(3, Math.floor(x));
  return mix(stops[i], stops[i + 1], x - i);
}
const lum = c => { const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }; return .2126 * f(c[0]) + .7152 * f(c[1]) + .0722 * f(c[2]); };
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
// ordinal colour for item i of n: i = 0 is the darkest (light mode) / lightest (dark mode)
const ordColor = (i, n) => { const s = [0, 1, 2, 3].map(k => hex2rgb(cssv('--ord' + k))); const j = n - 1 - i; const x = n === 1 ? 3 : j / (n - 1) * 3, k = Math.min(2, Math.floor(x)); return rgb(mix(s[k], s[k + 1], x - k)); };
const rowColor = i => (ROWS[i].color ? cssv(ROWS[i].color) : ordColor(i, ROWS.length));  // a row may name its own colour token
// series colour: explicit css colour, or an ordinal slot [i, n], or its position in the list
const serCol = (sr, i, spec) => sr.c || (sr.ord ? ordColor(sr.ord[0], sr.ord[1]) : ordColor(spec.ordReverse ? spec.series.length - 1 - i : i, spec.series.length));

// ---- tooltip
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { tip.style.display = 'none'; return; }
  tip.innerHTML = t.getAttribute('data-tip');
  tip.style.display = 'block';
  const w = tip.offsetWidth, x = Math.min(e.clientX + 14, window.innerWidth - w - 8);
  tip.style.left = Math.max(8, x) + 'px';
  tip.style.top = Math.min(e.clientY + 16, window.innerHeight - tip.offsetHeight - 8) + 'px';
});

// ---- figure 1: heatmaps (rows = configurations, columns = N)
function heatmap(host, key, title, extra) {
  const lw = DATA.label_w || 58, W = 760, left = lw, top = 54, right = 8, ch = 28, cw = (W - left - right) / NS.length;
  const H = top + ROWS.length * ch + 24, trainCols = NS.filter(n => n <= 256).length;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} by configuration and N">`;
  s += `<text x="0" y="13" style="fill:var(--ink);font-family:var(--sans);font-size:13px;font-weight:600">${esc(title)}</text>`;
  s += `<line x1="${left}" x2="${left + trainCols * cw - 4}" y1="34" y2="34" stroke="var(--axis)" stroke-width="1"/>`;
  s += `<text x="${left}" y="28" font-size="10">trained on N ≤ 256</text>`;
  s += `<text x="${left + trainCols * cw + 2}" y="28" font-size="10">${NS.length - trainCols >= 3 ? 'evaluation only, longer than training' : 'beyond training'}</text>`;
  NS.forEach((n, j) => { s += `<text x="${left + j * cw + cw / 2}" y="${top - 6}" font-size="10.5" text-anchor="middle">${n}</text>`; });
  ROWS.forEach((row, i) => {
    s += `<text x="${left - 8}" y="${top + i * ch + ch / 2 + 4}" font-size="11" text-anchor="end" style="fill:var(--ink)">${esc(row.label)}</text>`;
    NS.forEach((n, j) => {
      const r = cell(row.key, n), v = r ? r[key] : null, x = left + j * cw, y = top + i * ch;
      let fill, txt, tcol;
      if (v == null) { fill = cssv('--nodata'); txt = '–'; tcol = cssv('--muted'); }
      else { const c = seqColor(v); fill = rgb(c); txt = v >= .995 ? '1.00' : v.toFixed(2); tcol = lum(c) > .32 ? '#0b0b0b' : '#ffffff'; }
      const tipTxt = `${esc(row.long || row.label)}, N = ${n.toLocaleString()} (~${Math.round(n * 3.75 / 1000)}k tokens)<br>${esc(title)}: ${v == null ? 'no such queries' : v.toFixed(3)}${v != null && r ? '<br>' + perTxt(r, key) : ''}${extra && r && v != null ? '<br>' + extra(r) : ''}`;
      s += `<rect x="${x + 1}" y="${y + 1}" width="${cw - 2}" height="${ch - 2}" rx="2" fill="${fill}" data-tip="${esc(tipTxt)}"/>`;
      s += `<text x="${x + cw / 2}" y="${y + ch / 2 + 4}" font-size="10.5" text-anchor="middle" style="fill:${tcol};pointer-events:none">${txt}</text>`;
    });
  });
  s += `<line x1="${left + trainCols * cw - 1}" x2="${left + trainCols * cw - 1}" y1="${top - 2}" y2="${top + ROWS.length * ch}" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="3 3"/>`;
  host.innerHTML = s + '</svg>';
}

// ---- figure 2: scatter panels (one point per configuration, faint dots = seeds)
function scatter(host, n) {
  const S = 250, m = { l: 40, r: 12, t: 24, b: 38 }, iw = S - m.l - m.r, ih = S - m.t - m.b;
  const X = v => m.l + v * iw, Y = v => m.t + (1 - v) * ih;
  let s = `<svg viewBox="0 0 ${S} ${S}" role="img" aria-label="Passkey vs expired accuracy at N=${n}">`;
  s += `<text x="${m.l}" y="14" style="fill:var(--ink);font-family:var(--sans);font-size:13.5px;font-weight:600">N = ${n.toLocaleString()} writes</text>`;
  [0, .25, .5, .75, 1].forEach(t => {
    s += `<line x1="${m.l}" x2="${m.l + iw}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)" stroke-width=".8"/>`;
    s += `<line y1="${m.t}" y2="${m.t + ih}" x1="${X(t)}" x2="${X(t)}" stroke="var(--grid)" stroke-width=".8"/>`;
    s += `<text x="${m.l - 5}" y="${Y(t) + 3.5}" font-size="10.5" text-anchor="end">${Math.round(t * 100)}</text>`;
    s += `<text x="${X(t)}" y="${m.t + ih + 14}" font-size="10.5" text-anchor="middle">${Math.round(t * 100)}</text>`;
  });
  s += `<text x="${m.l + iw / 2}" y="${S - 6}" font-size="11" text-anchor="middle">expired-query accuracy, %</text>`;
  s += `<text transform="translate(10 ${m.t + ih / 2}) rotate(-90)" font-size="11" text-anchor="middle">passkey exact match, %</text>`;
  const groups = {};
  ROWS.forEach((row, i) => { const r = cell(row.key, n); if (!r) return; const k = r.expired.toFixed(2) + '|' + r.passkey.toFixed(2); (groups[k] = groups[k] || []).push({ row, i, r }); });
  Object.values(groups).forEach(g => {
    const r = g[0].r, cx = X(r.expired), cy = Y(r.passkey);
    const tipTxt = g.map(o => `${esc(o.row.long || o.row.label)}: passkey ${o.r.passkey.toFixed(3)}, expired ${o.r.expired.toFixed(3)}, valid ${o.r.valid.toFixed(3)}`).join('<br>');
    g.forEach(o => { if (o.r.per && o.r.per.passkey) o.r.per.passkey.forEach((pk, k) => { const ex = o.r.per.expired[k]; if (pk != null && ex != null) s += `<circle cx="${X(ex)}" cy="${Y(pk)}" r="2.6" fill="${rowColor(o.i)}" opacity=".4"/>`; }); });
    [...g].reverse().forEach(o => {  // drawn from the last row to the first so row 0 ends up on top
      const hollow = o.r.valid < .9;
      s += `<circle cx="${cx}" cy="${cy}" r="6" fill="${hollow ? 'var(--surface)' : rowColor(o.i)}" stroke="${hollow ? rowColor(o.i) : 'var(--surface)'}" stroke-width="${hollow ? 2 : 1.6}" data-tip="${esc(tipTxt)}"/>`;
    });
    const names = g.filter(o => !o.row.nolabel).map(o => o.row.slabel || o.row.label);  // rows may opt out of a label (identified by colour and tooltip)
    if (!names.length) return;
    const label = (DATA.row_prefix || '') + (names.length > 3 ? names[0] + ' … ' + names[names.length - 1] + ' (' + names.length + ')' : names.join(', '));
    const onRight = cx > m.l + iw * .55, lx = onRight ? cx - 10 : cx + 10;
    const ly = cy + (r.passkey > .5 ? 14 : -9);
    s += `<text x="${lx}" y="${ly}" font-size="10.5" class="endlabel" text-anchor="${onRight ? 'end' : 'start'}" style="fill:var(--ink)">${esc(label)}</text>`;
  });
  host.insertAdjacentHTML('beforeend', `<div>${s}</svg></div>`);
}

// ---- generic line chart: spec = { xTicks, x0, x1, xLog, xLabel, yLabel, yMax, series[], vlines[], note }
// series: { label, short, c (css colour, optional), width, dashed, points: [{x, y, lo, hi, tip}] }
function lineChart(host, legendHost, spec) {
  const W = 760, H = spec.height || 340, m = { l: 52, r: spec.rightPad || 132, t: 14, b: 44 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const tr = v => spec.xLog === false ? v : Math.log2(v);
  const y0 = spec.yMin || 0, y1 = spec.yMax || 1;
  const X = v => m.l + (tr(v) - tr(spec.x0)) / (tr(spec.x1) - tr(spec.x0)) * iw, Y = v => m.t + (1 - (v - y0) / (y1 - y0)) * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.aria || 'line chart')}">`;
  [0, .25, .5, .75, 1].forEach(t => {
    const v = y0 + t * (y1 - y0);
    s += `<line x1="${m.l}" x2="${m.l + iw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width=".8"/>`;
    s += `<text x="${m.l - 8}" y="${Y(v) + 3.5}" font-size="10.5" text-anchor="end">${(v * 100).toFixed(y1 - y0 < .5 ? 1 : 0)}%</text>`;
  });
  spec.xTicks.forEach(x => {
    s += `<line x1="${X(x)}" x2="${X(x)}" y1="${m.t + ih}" y2="${m.t + ih + 4}" stroke="var(--axis)"/>`;
    s += `<text x="${X(x)}" y="${m.t + ih + 17}" font-size="10.5" text-anchor="middle">${x}</text>`;
  });
  s += `<line x1="${m.l}" x2="${m.l + iw}" y1="${m.t + ih}" y2="${m.t + ih}" stroke="var(--axis)"/>`;
  s += `<text x="${m.l + iw / 2}" y="${H - 8}" font-size="11" text-anchor="middle">${esc(spec.xLabel)}</text>`;
  s += `<text transform="translate(13 ${m.t + ih / 2}) rotate(-90)" font-size="11" text-anchor="middle">${esc(spec.yLabel)}</text>`;
  (spec.vlines || []).forEach(v => {
    s += `<line x1="${X(v.x)}" x2="${X(v.x)}" y1="${m.t}" y2="${m.t + ih}" stroke="var(--ink-2)" stroke-dasharray="3 3" stroke-width=".8"/>`;
    if (v.label) s += `<text x="${X(v.x) + 4}" y="${m.t + 10 + (v.dy || 0)}" font-size="9.5">${esc(v.label)}</text>`;
  });
  if (spec.note) s += `<text x="${m.l + 8}" y="${m.t + ih - 10}" font-size="10">${esc(spec.note)}</text>`;
  const ends = [];
  spec.series.forEach((sr, i) => {
    const col = serCol(sr, i, spec), pts = sr.points.filter(p => p.y != null);
    s += `<polyline fill="none" style="stroke:${col}" stroke-width="${sr.width || 2}" ${sr.dashed ? 'stroke-dasharray="6 4"' : ''} points="${pts.map(p => X(p.x) + ',' + Y(p.y)).join(' ')}"/>`;
    pts.forEach(p => {
      if (p.lo != null && p.hi != null && p.hi - p.lo > 1e-6) s += `<line x1="${X(p.x)}" x2="${X(p.x)}" y1="${Y(p.lo)}" y2="${Y(p.hi)}" style="stroke:${col}" stroke-width="1.4" opacity=".6"/>`;
      if (sr.noDots) return;
      const t = p.tip || `${sr.label}<br>${esc(spec.xLabel)}: ${p.x}<br>${esc(spec.yLabel)}: ${p.y.toFixed(3)}`;
      s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${sr.dashed ? 3.5 : 5}" style="fill:${sr.dashed ? 'var(--surface)' : col};stroke:${sr.dashed ? col : 'var(--surface)'}" stroke-width="1.6" data-tip="${esc(t)}"/>`;
    });
    if (sr.short && pts.length) { const last = pts[pts.length - 1]; ends.push({ x: X(last.x), py: Y(last.y), y: Y(last.y), text: sr.short }); }
  });
  // spread the end labels so they never touch each other or the axis
  const gap = 15, ymax = m.t + ih - 12;
  ends.sort((a, b) => a.y - b.y);
  for (let k = 1; k < ends.length; k++) ends[k].y = Math.max(ends[k].y, ends[k - 1].y + gap);
  if (ends.length && ends[ends.length - 1].y > ymax) { ends[ends.length - 1].y = ymax; for (let k = ends.length - 2; k >= 0; k--) ends[k].y = Math.min(ends[k].y, ends[k + 1].y - gap); }
  ends.forEach(e => {
    if (Math.abs(e.y - e.py) > 3) s += `<line x1="${e.x + 6}" y1="${e.py}" x2="${e.x + 12}" y2="${e.y}" stroke="var(--muted)" stroke-width=".8"/>`;
    s += `<text x="${e.x + 14}" y="${e.y + 4}" font-size="10.5" class="endlabel" style="fill:var(--ink)">${esc(e.text)}</text>`;
  });
  host.innerHTML = s + '</svg>';
  legendHost.innerHTML = spec.series.map((sr, i) => `<span><i class="${sr.dashed ? 'dash' : (spec.legendLine ? 'line' : '')}" style="${sr.dashed || spec.legendLine ? 'border-color' : 'background'}:${serCol(sr, i, spec)}"></i>${esc(sr.label)}</span>`).join('');
}

function table(cols, rows) {
  return `<table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function renderCharts() {
  heatmap($('#hm-passkey'), 'passkey', 'Passkey exact match', r => `${r.n_examples} examples per seed`);
  heatmap($('#hm-valid'), 'valid', DATA.valid_title, r => `${r.n_valid.toLocaleString()} queries per seed`);
  heatmap($('#hm-stale'), 'stale', DATA.stale_title, r => `${r.n_stale.toLocaleString()} queries per seed`);
  if (!DATA.hide_scatter) { $('#scatter').innerHTML = ''; DATA.scatter_ns.forEach(n => scatter($('#scatter'), n)); }
  DATA.extra_figs.forEach((f, i) => { if (f.spec) lineChart($('#ch-' + i), $('#lg-' + i), f.spec); });  // a figure may carry html instead of a line chart
}

function fillText() {
  $('#meta').innerHTML = DATA.meta;
  $('#tldr').innerHTML = DATA.tldr.map(t => `<li>${t}</li>`).join('');
  $('#intro').innerHTML = DATA.intro || '';  // optional block between the summary and the cards (a method description with its own figures)
  $('#tested-h').textContent = DATA.tested_title || 'What was tested'; $('#results-h').textContent = DATA.results_title || 'Results'; $('#next-h').textContent = DATA.next_title || 'What is next';
  if (DATA.fig1_title) $('#fig1-title').textContent = DATA.fig1_title;
  if (DATA.hide_scatter) $('#fig2-fig').remove();
  $('#tested').innerHTML = DATA.tested.map(c => `<div class="card"><h3>${c.title} <span class="tag ${c.ok ? 'ok' : ''}">${esc(c.tag)}</span></h3><p>${c.body}</p></div>`).join('');
  if (!DATA.tested.length) { $('#tested-h').remove(); $('#tested').remove(); }
  $('#results-intro').innerHTML = DATA.results_intro;
  $('#fig1-sub').innerHTML = DATA.fig1_sub;
  $('#cap1').innerHTML = DATA.cap1;
  if (!DATA.hide_scatter) { $('#fig2-sub').innerHTML = DATA.fig2_sub; $('#cap2').innerHTML = DATA.cap2; }
  $('#next').innerHTML = DATA.next;
  const rows = [];
  ROWS.forEach(row => NS.forEach(n => { const r = cell(row.key, n); if (r) rows.push([row.label, n, fmt2(r.passkey), fmt2(r.valid), fmt2(r.stale), fmt2(r.expired), r.n_stale]); }));
  $('#tbl1').innerHTML = table([DATA.row_name, 'N', 'passkey', 'ar_valid', 'expired (stale)', 'expired (all)', '# stale queries per seed'], rows);
  if (!DATA.hide_scatter) {
    const rows2 = [];
    DATA.scatter_ns.forEach(n => ROWS.forEach(row => { const r = cell(row.key, n); if (r) rows2.push([n, row.label, fmt2(r.expired), fmt2(r.passkey), fmt2(r.valid)]); }));
    $('#tbl2').innerHTML = table(['N', DATA.row_name, 'expired acc', 'passkey', 'ar_valid'], rows2);
  }
  $('#extra-figs').innerHTML = DATA.extra_figs.map((f, i) => `
    <figure>
      <div class="fig-title">${f.title}</div>
      <p class="fig-sub">${f.sub}</p>
      ${f.spec ? `<div class="legend" id="lg-${i}"></div><div class="chart" id="ch-${i}"></div>` : ''}${f.html || ''}
      <figcaption>${f.caption}</figcaption>
      ${f.spec ? `<details><summary>Table view</summary><div class="tbl" id="tb-${i}"></div></details>` : ''}
    </figure>`).join('');
  DATA.extra_figs.forEach((f, i) => {
    if (!f.spec) return;
    const rws = []; f.spec.series.forEach(sr => sr.points.forEach(p => rws.push([sr.label, p.x, p.y == null ? '–' : p.y.toFixed(3), p.lo != null ? `${p.lo.toFixed(3)} to ${p.hi.toFixed(3)}` : ''])));
    $('#tb-' + i).innerHTML = table(['series', f.spec.xLabel, f.spec.yLabel, 'range over seeds'], rws);
  });
}
fillText();
renderCharts();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderCharts);
new MutationObserver(renderCharts).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
</script>
