<style>
/* Layout: one reading column; the summary comes first, each chart sits in its own bordered figure with the description under it. */
:root {

}

    --s1: #3987e5; --s2: #d95926; --s3: #199e70;

    --ord0: #cde2fb; --ord1: #6da7ec; --ord2: #2a78d6; --ord3: #1c5cab;
    --good: #5fd98a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --nodata: #262624;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;

body { background: var(--page); color: var(--ink); font: 15px/1.6 var(--sans); margin: 0; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }
h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 6px; font-weight: 600; text-wrap: balance; }
h2 { font-size: 1.2rem; margin: 40px 0 10px; font-weight: 600; text-wrap: balance; }
h3 { font-size: 1rem; margin: 0 0 4px; font-weight: 600; }
p { margin: 0 0 10px; max-width: 70ch; }
.meta { color: var(--ink-2); font-size: .9rem; margin: 0 0 22px; }
code, .mono { font-family: var(--mono); font-size: .88em; }
.summary { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; }
.summary ol { margin: 8px 0 0; padding-left: 1.2em; display: grid; gap: 8px; }
.summary li { max-width: 78ch; }
.status { display: inline-flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: .85rem; color: var(--ink-2); font-family: var(--mono); }
.status b { color: var(--ink); font-weight: 500; }
figure { margin: 18px 0 0; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 14px 10px; }
figcaption { color: var(--ink-2); font-size: .92rem; margin-top: 8px; }
figcaption p { max-width: 82ch; }
.fig-title { font-weight: 600; font-size: .98rem; }
.fig-sub { color: var(--ink-2); font-size: .86rem; margin: 0 0 8px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { font-family: var(--mono); fill: var(--ink-2); }
.chart text.endlabel { paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.hm-scroll { overflow-x: auto; }
.hm-scroll svg { min-width: 640px; }
.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .84rem; color: var(--ink-2); margin: 4px 0 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.legend i.line { width: 18px; height: 0; border-radius: 0; border-top: 2px solid; vertical-align: 3px; }
.legend i.dash { width: 18px; height: 0; border-radius: 0; border-top: 2px dashed; vertical-align: 3px; }
.pbar { display: grid; grid-template-columns: minmax(150px, 290px) minmax(0, 1fr); gap: 2px 12px; align-items: center; margin: 5px 0; font-size: .8rem; color: var(--ink-2); }
.pbar .stack { display: flex; height: 22px; border-radius: 3px; overflow: hidden; border: 1px solid var(--border); }
.pbar .stack i { display: block; min-width: 0; font: 10.5px/22px var(--mono); text-align: center; font-style: normal; overflow: hidden; }
details { margin-top: 8px; font-size: .86rem; }
summary { cursor: pointer; color: var(--ink-2); }
summary:focus-visible, a:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.tbl { overflow-x: auto; margin-top: 6px; }
table { border-collapse: collapse; font-family: var(--mono); font-size: .8rem; font-variant-numeric: tabular-nums; }
th, td { padding: 3px 9px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
.tbl.kv th, .tbl.kv td { text-align: left; white-space: normal; vertical-align: top; }
.tbl.wide td:first-child { white-space: normal; min-width: 240px; max-width: 420px; }
.hint { color: var(--muted); font-size: .72rem; }
th { color: var(--ink-2); font-weight: 500; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-top: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.card p { font-size: .9rem; }
ul.tight { margin: 4px 0 10px; padding-left: 1.2em; display: grid; gap: 4px; max-width: 82ch; }

.tag.ok { color: var(--good); border-color: var(--good); }
#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--page); font: 12px/1.45 var(--mono); padding: 6px 9px; border-radius: 5px; max-width: 300px; display: none; }

, 1.0], "expired": [1.0, 1.0, 1.0]}}, "256": {"passkey": 1.0, "valid": 1.0, "stale": 1.0, "expired": 1.0, "n_examples": 1000, "n_valid": 32106, "n_stale": 17131, "per": {"passkey": [1.0, 1.0, 1.0], "valid": [1.0, 1.0, 1.0], "stale": [1.0, 1.0, 1.0], "expired": [1.0, 1.0, 1.0]}}, "512": {"passkey": 0.5950000000000001, "valid": 1.0, "stale": 0.9999929843762058, "expired": 0.9999947589098532, "n_examples": 1000, "n_valid": 63711, "n_stale": 47513, "per": {"passkey": [0.785, 0.0, 1.0], "valid": [1.0, 1.0, 1.0], "stale": [0.9999789531286174, 1.0, 1.0], "expired": [0.9999842767295597, 1.0, 1.0]}}, "1024": {"passkey": 0.3333333333333333, "valid": 1.0, "stale": 1.0, "expired": 1.0, "n_examples": 1000, "n_valid": 128076, "n_stale": 111966, "per": {"passkey": [0.0, 0.0, 1.0], "valid": [1.0, 1.0, 1.0], "stale": [1.0, 1.0, 1.0], "expired": [1.0, 1.0, 1.0]}}, "2048": {"passkey": 0.3333333333333333, "valid": 0.9999987001609201, "stale": 0.9999986176255508, "expired": 0.9999987042133798, "n_examples": 1000, "n_valid": 256442, "n_stale": 241131, "per": {"passkey": [0.0, 0.0, 1.0], "valid": [1.0, 0.9999961004827602, 1.0], "stale": [1.0, 0.9999958528766522, 1.0], "expired": [1.0, 0.9999961126401393, 1.0]}}, "4096": {"passkey": 0.3333333333333333, "valid": 0.9999915397465959, "stale": 1.0, "expired": 1.0, "n_examples": 1000, "n_valid": 512199, "n_stale": 495568, "per": {"passkey": [0.0, 0.0, 1.0], "valid": [1.0, 1.0, 0.9999746192397877], "stale": [1.0, 1.0, 1.0], "expired": [1.0, 1.0, 1.0]}}, "8192": {"passkey": 0.32266666666666666, "valid": 0.9998904954980938, "stale": 1.0, "expired": 1.0, "n_examples": 1000, "n_valid": 1022789, "n_stale": 1006975, "per": {"passkey": [0.0, 0.0, 0.968], "valid": [1.0, 0.9999990222812329, 0.9996724642130488], "stale": [1.0, 1.0, 1.0], "expired": [1.0, 1.0, 1.0]}}, "16384": {"passkey": 0.050666666666666665, "valid": 0.9992628183667541, "stale": 0.999999014776869, "expired": 0.9999990227236303, "n_examples": 1000, "n_valid": 2046081, "n_stale": 2029997, "per": {"passkey": [0.0, 0.0, 0.152], "valid": [1.0, 0.9999990225215912, 0.9977894325786711], "stale": [0.9999995073884346, 0.9999985221653037, 0.9999990147768691], "expired": [0.9999995113618151, 0.9999985340854453, 0.9999990227236302]}}}}, "scatter_ns": [], "hide_scatter": true, "label_w": 352, "row_name": "configuration", "row_prefix": "", "meta": "Design experiment E1, results of 08 Oct 2026, 08:16. Test split, N counts AR writes, one write is about 3.75 tokens. Every row is one configuration; seeds are averaged only within a configuration.", "tldr": ["<b>Idea.</b> Instead of adding a loop vector m to the inputs of the next segment, the new model changes the <b>values</b> of the sliding-window store: per layer and segment, the layer's outputs on the previous segment give keys a_j and values b_j (tanh of linear maps of the normalised outputs), and every token of the next segment gets v_t = W_v h_t + \u0394W_v h_t with \u0394W_v = (g / C) \u03a3_j b_j a_j\u1d40, a matrix of rank at most C with entries bounded by |g| (g: one learned scalar per layer, 0 at the start). Queries and keys are untouched, each value is computed once and stays in the cache for the 63 tokens it lives; nothing else crosses the segment boundary. 2 layers, window 64, 595,842 parameters (the vector loop: 564k).", "<b>Segment 32.</b> Value adaptation (3 seeds) scores passkey exact match 0.41 / 0.09 / 0.05 / 0.04 (mean, test) at N = 256 / 1,024 / 4,096 / 16,384; per seed at N = 16,384 0.01 / 0.11 / 0.00; the mean stays at 0.9 or above up to N = 64. The vector loop m at the same segment (3 seeds) scores 0.99 / 0.58 / 0.00 / 0.00 (per seed at 16,384: 0.00 / 0.00 / 0.00).", "<b>Segment 8.</b> Value adaptation (3 seeds) scores passkey exact match 0.03 / 0.03 / 0.02 / 0.02 (mean, test) at N = 256 / 1,024 / 4,096 / 16,384; per seed at N = 16,384 0.05 / 0.00 / 0.00; the mean never reaches 0.9. The vector loop m at the same segment (3 seeds) scores 0.69 / 0.40 / 0.35 / 0.35 (per seed at 16,384: 0.07 / 0.00 / 0.99).", "<b>Baselines, same recipe.</b> plain SWA (window 64) 0.00 at N = 256 and 0.00 at N = 1,024; GDN-2 (mean of 3 seeds) 0.33 / 0.33 / 0.05 at N = 1,024 / 4,096 / 16,384.", "<b>Where the passkey is.</b> A linear read-out of each passkey token from the cached <i>values</i> of the last window (no passkey token in sight; mean accuracy over the 4 tokens, chance 0.06) reaches swa_va_seg32_s2: 0.53 / 0.45 at 282 / 2,074 tokens (token by token at 2,074: 0.69 / 0.17 / 0.74 / 0.19) (plain SWA: 0.06 / 0.06); swa_va_seg32_s1: 0.53 / 0.47 at 282 / 2,074 tokens (token by token at 2,074: 0.72 / 0.20 / 0.72 / 0.24) (plain SWA: 0.06 / 0.06); swa_va_seg32_s0: 0.51 / 0.43 at 282 / 2,074 tokens (token by token at 2,074: 0.62 / 0.19 / 0.64 / 0.27) (plain SWA: 0.06 / 0.06); swa_va_seg8_s0: 0.49 / 0.36 at 258 / 2,050 tokens (token by token at 2,050: 0.74 / 0.32 / 0.23 / 0.16) (plain SWA: 0.06 / 0.06); swa_va_seg8_s2: 0.07 / 0.06 at 258 / 2,050 tokens (token by token at 2,050: 0.07 / 0.07 / 0.06 / 0.06) (plain SWA: 0.06 / 0.06); swa_va_seg8_s1: 0.06 / 0.07 at 258 / 2,050 tokens (token by token at 2,050: 0.07 / 0.07 / 0.07 / 0.07) (plain SWA: 0.06 / 0.06). The window itself is at most 63 tokens, so what is read out was carried by the adaptation. Per-token accuracies are in the probe table.", "<b>What the adaptation looks like.</b> swa_va_seg32_s2: layer 0 has \u2016\u0394W_v\u2016 = 7.9 \u00d7 \u2016W_v\u2016, participation rank 1.1 (of at most 32), 99% of the key and value entries saturated, 83% of its energy in the segment-mean part; swa_va_seg32_s1: layer 0 has \u2016\u0394W_v\u2016 = 6.3 \u00d7 \u2016W_v\u2016, participation rank 1.9 (of at most 32), 99% of the key and value entries saturated, 32% of its energy in the segment-mean part; swa_va_seg32_s0: layer 0 has \u2016\u0394W_v\u2016 = 6.4 \u00d7 \u2016W_v\u2016, participation rank 1.9 (of at most 32), 99% of the key and value entries saturated, 56% of its energy in the segment-mean part; swa_va_seg8_s0: layer 0 has \u2016\u0394W_v\u2016 = 1.2 \u00d7 \u2016W_v\u2016, participation rank 1.7 (of at most 8), 99% of the key and value entries saturated, 58% of its energy in the segment-mean part; swa_va_seg8_s2: layer 0 has \u2016\u0394W_v\u2016 = 0.1 \u00d7 \u2016W_v\u2016, participation rank 2.1 (of at most 8), 98% of the key and value entries saturated, 27% of its energy in the segment-mean part; swa_va_seg8_s1: layer 0 has \u2016\u0394W_v\u2016 = 0.2 \u00d7 \u2016W_v\u2016, participation rank 1.9 (of at most 8), 98% of the key and value entries saturated, 22% of its energy in the segment-mean part.", "<b>Perturbation in mid-stream</b> (far beyond the reach): swa_va_seg32_s1 keeps 0.16 clean, 0.14 with its cached values kicked by 1 \u00d7 RMS, 0.08 with the previous segment's encoding zeroed, 0.00 with both zeroed; a kick to the cached values shrinks to 0.02 of its size after 16 segments; swa_va_seg32_s0 keeps 0.07 clean, 0.05 with its cached values kicked by 1 \u00d7 RMS, 0.01 with the previous segment's encoding zeroed, 0.00 with both zeroed; a kick to the cached values shrinks to 0.14 of its size after 16 segments."], "tested": [], "results_title": "Results", "intro": "<h2>Method</h2><p>The task: remember a 4-token passkey shown once at the start of a stream and repeat it at the end, while answering associative-recall queries about recent key\u2013value writes. A plain sliding-window model cannot do the first part beyond its window. Here the long-term memory is meant to live in the short-term store itself: the values of the cached window are adapted, segment by segment, by an associative read of the layer's own previous outputs.</p><figure><div class='fig-title'>One layer, two consecutive segments</div><div class='chart'><svg viewBox='0 0 780 330' role='img' aria-label='Value adaptation: the outputs of segment s-1 give a low-rank matrix that is added to W_v for the tokens of segment s' style='width:100%;height:auto'><style>.tk{fill:var(--s1);opacity:.85}.to{fill:var(--s3);opacity:.85}.bl{fill:var(--surface);stroke:var(--axis);stroke-width:1.2}.kv{fill:var(--s2);opacity:.9}.ar{stroke:var(--ink-2);stroke-width:1.4;fill:none}.fb{stroke:var(--s2);stroke-width:2.4;fill:none}.t{font:11.5px var(--mono);fill:var(--ink-2)}.tb{font:12px var(--mono);fill:var(--ink)}.to2{font:11.5px var(--mono);fill:var(--s2)}</style><defs><marker id='ah' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--ink-2)'/></marker><marker id='ao' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--s2)'/></marker></defs><text x='16' y='16' class='t'>from the block outputs o_j of segment s\u22121:  a_j = tanh(W_y\u00b7norm(o_j)),  b_j = tanh(W_x\u00b7norm(o_j))</text><text x='16' y='32' class='t'>\u0394W_v = (g / C) \u03a3_j b_j a_j\u1d40 is added to W_v for segment s; g: one learned scalar per layer, 0 at the start</text><text x='120' y='318' text-anchor='middle' class='tb'>segment s\u22121 (C tokens)</text><rect x='40' y='270' width='18' height='18' rx='3' class='tk'/><rect x='61' y='270' width='18' height='18' rx='3' class='tk'/><rect x='82' y='270' width='18' height='18' rx='3' class='tk'/><rect x='103' y='270' width='18' height='18' rx='3' class='tk'/><rect x='124' y='270' width='18' height='18' rx='3' class='tk'/><rect x='145' y='270' width='18' height='18' rx='3' class='tk'/><path d='M120 266 L120 206' class='ar' marker-end='url(#ah)'/><rect x='30' y='132' width='180' height='72' rx='4' class='bl'/><text x='120' y='160' text-anchor='middle' class='tb'>layer \u2113</text><text x='120' y='178' text-anchor='middle' class='t'>window attention + MLP</text><path d='M120 130 L120 98' class='ar' marker-end='url(#ah)'/><rect x='40' y='76' width='18' height='18' rx='3' class='to'/><rect x='61' y='76' width='18' height='18' rx='3' class='to'/><rect x='82' y='76' width='18' height='18' rx='3' class='to'/><rect x='103' y='76' width='18' height='18' rx='3' class='to'/><rect x='124' y='76' width='18' height='18' rx='3' class='to'/><rect x='145' y='76' width='18' height='18' rx='3' class='to'/><text x='120' y='64' text-anchor='middle' class='t'>outputs o_j</text><path d='M212 86 L282 112' class='ar' marker-end='url(#ah)'/><rect x='286' y='84' width='172' height='66' rx='4' class='bl'/><text x='372' y='106' text-anchor='middle' class='tb'>\u0394W_v</text><text x='372' y='124' text-anchor='middle' class='t'>(g/C) \u03a3 b_j a_j\u1d40</text><text x='372' y='140' text-anchor='middle' class='t'>rank \u2264 C, |entry| \u2264 |g|</text><text x='640' y='318' text-anchor='middle' class='tb'>segment s</text><rect x='560' y='270' width='18' height='18' rx='3' class='tk'/><rect x='581' y='270' width='18' height='18' rx='3' class='tk'/><rect x='602' y='270' width='18' height='18' rx='3' class='tk'/><rect x='623' y='270' width='18' height='18' rx='3' class='tk'/><rect x='644' y='270' width='18' height='18' rx='3' class='tk'/><rect x='665' y='270' width='18' height='18' rx='3' class='tk'/><path d='M640 266 L640 206' class='ar' marker-end='url(#ah)'/><rect x='530' y='132' width='220' height='72' rx='4' class='bl'/><text x='640' y='156' text-anchor='middle' class='tb'>layer \u2113</text><text x='640' y='174' text-anchor='middle' class='t'>v_t = W_v h_t + \u0394W_v h_t</text><text x='640' y='192' text-anchor='middle' class='to2'>stored once in the cache</text><path d='M640 130 L640 98' class='ar' marker-end='url(#ah)'/><rect x='560' y='76' width='18' height='18' rx='3' class='to'/><rect x='581' y='76' width='18' height='18' rx='3' class='to'/><rect x='602' y='76' width='18' height='18' rx='3' class='to'/><rect x='623' y='76' width='18' height='18' rx='3' class='to'/><rect x='644' y='76' width='18' height='18' rx='3' class='to'/><rect x='665' y='76' width='18' height='18' rx='3' class='to'/><path d='M460 118 L526 152' class='fb' marker-end='url(#ao)'/><text x='474' y='214' class='to2'>queries and keys unchanged;</text><text x='474' y='228' class='to2'>no other path between segments</text></svg></div><figcaption>The adaptation is a low-rank test-time update of W_v, \u0394W_v = (g / C) \u03a3 b_j a_j\u1d40, built from the previous segment and never formed as a matrix (\u0394v_t = (g / C) \u03a3_j b_j \u27e8a_j, h_t\u27e9). The first segment is plain attention. The model runs on a key/value cache: a value computed for a token keeps the adaptation of its own segment for as long as it stays in the window.</figcaption></figure>", "results_intro": "Value adaptation against the vector loop m at the same segment, plain SWA and GDN-2, all with the same recipe (50k steps, stream-length curriculum, 2 layers, window 64).", "fig1_title": "1. Accuracy by configuration and stream length", "fig1_sub": "Rows: value adaptation (mean of the seeds), the vector loop at the same segments, baselines. Columns: stream length N. Darker is higher.", "valid_title": "AR valid accuracy (key written within the last 16 writes)", "stale_title": "AR expired accuracy, stale keys only (last write more than 32 writes ago)", "cap1": "<p>Top grid: passkey. Middle and bottom grids: the associative-recall half.</p>", "cap2": "", "extra_figs": [{"key": "n", "title": "2. Passkey accuracy against stream length", "sub": "Test split (1,000 streams per N). The passkey is shown once, 4 tokens, and asked for at the end of a stream of N writes plus associative-recall queries.", "caption": "<p>Plain window attention reaches 126 tokens; the dotted line is the longest training stream (N = 256). Everything to its right is length extrapolation.</p>", "spec": {"series": [{"label": "value adaptation, segment 32, mean of 3 seeds (bars: worst to best seed)", "short": "VA seg 32", "points": [{"x": 32, "y": 0.9870000000000001, "tip": "value adaptation, segment 32, mean of 3 seeds (bars: worst to best seed)<br>N = 32 (about 0k tokens)<br>passkey 0.987 (seeds 0.98, 0.99, 0.99)", "lo": 0.976, "hi": 0.994}, {"x": 64, "y": 0.945 an></td><td>3</td><td>530k</td><td>0.2 h</td><td>0.00 / 0.00 / 0.00</td><td>0.00 / 0.00 / 0.00</td><td>0.00 / 0.00 / 0.00</td><td>0.00 / 0.00 / 0.00</td><td>0.99</td></tr><tr><td title='gdn2_steps50000_cur2000_s0, gdn2_steps50000_cur2000_s1, gdn2_steps50000_cur2000_s2'>GDN-2 (learned decay) \u00b7 curriculum 0 \u2192 2000 steps per stage, 30000 \u2192 50000 steps<br><span class='hint'>reference gdn2_v1; seeds 0, 1, 2</span></td><td>3</td><td>441k</td><td>0.6 h</td><td>1.00 / 1.00 / 1.00</td><td>0.00 / 0.00 / 1.00</td><td>0.00 / 0.00 / 1.00</td><td>0.00 / 0.00 / 0.15</td><td>1.00</td></tr><tr><td title='swa_fb_gi0_nlnone_seg8_steps50000_s0, swa_fb_gi0_nlnone_seg8_steps50000_s1, swa_fb_gi0_nlnone_seg8_steps50000_s2'>window 64, segment 8, no-tanh loop \u00b7 gain_init 0.1 \u2192 0, 20000 \u2192 50000 steps<br><span class='hint'>reference swa_fb_v1; seeds 0, 1, 2</span></td><td>3</td><td>563k</td><td>8.8 h</td><td>0.07 / 1.00 / 1.00</td><td>0.07 / 0.15 / 1.00</td><td>0.06 / 0.00 / 0.99</td><td>0.07 / 0.00 / 0.99</td><td>0.99</td></tr><tr><td title='swa_va_seg8_s0, swa_va_seg8_s1, swa_va_seg8_s2'>value adaptation, window 64, segment 8<br><span class='hint'>reference swa_va_v1; seeds 0, 1, 2</span></td><td>3</td><td>595k</td><td>3.6 h</td><td>0.10 / 0.00 / 0.00</td><td>0.08 / 0.00 / 0.00</td><td>0.06 / 0.00 / 0.00</td><td>0.05 / 0.00 / 0.00</td><td>0.66</td></tr><tr><td title='swa_fb_gi0_seg32_nlnone_steps50000_s0, swa_fb_gi0_seg32_nlnone_steps50000_s1, swa_fb_gi0_seg32_nlnone_steps50000_s2'>window 64, segment 32, no-tanh loop \u00b7 gain_init 0.1 \u2192 0, 20000 \u2192 50000 steps<br><span class='hint'>reference swa_fb_v1; seeds 0, 1, 2</span></td><td>3</td><td>563k</td><td>2.3 h</td><td>0.99 / 1.00 / 0.99</td><td>0.67 / 0.37 / 0.70</td><td>0.00 / 0.00 / 0.01</td><td>0.00 / 0.00 / 0.00</td><td>0.99</td></tr><tr><td title='swa_va_seg32_s0, swa_va_seg32_s1, swa_va_seg32_s2'>value adaptation, window 64, segment 32<br><span class='hint'>reference swa_va_v1; seeds 0, 1, 2</span></td><td>3</td><td>595k</td><td>1.5 h</td><td>0.26 / 0.30 / 0.68</td><td>0.09 / 0.18 / 0.01</td><td>0.03 / 0.12 / 0.00</td><td>0.01 / 0.11 / 0.00</td><td>0.99</td></tr></tbody></table></div>"}], "next_title": "Open issues", "next": "<p><b>Training length.</b> At segment 32 the validation passkey at N = 256 was 0.17 / 0.17 / 0.47 per seed at step 38,000 and 0.27 / 0.27 / 0.70 at step 50,000, with the learning rate already cosine-decayed to 10% at the end: the runs were still improving when the schedule ended, so a longer schedule is the first thing to try (not run).</p><p><b>Segment 8.</b> Value adaptation does not work here: passkey at N = 256 per seed 0.10 / 0.00 / 0.00 (at N = 32: 0.52 / 0.00 / 0.37), AR valid accuracy 0.00 / 0.99 / 1.00. The vector loop m at segment 8, the best configuration of the earlier rounds, scores 0.07 / 0.00 / 0.99 per seed at N = 16,384. A seed that never learned the associative-recall half (valid 0.00) has the only passkey signal, which decays with N. Read-out of the passkey from the cached values 2,050 tokens after it was shown: seed 0 (AR valid 0.00): 0.36; seed 1 (AR valid 0.99): 0.07; seed 2 (AR valid 1.00): 0.06 (chance 0.06). Whether the narrower channel (rank at most 8 per segment, against 32) is the cause is not tested.</p><p><b>Saturated codes.</b> In the probed runs 99% of the key and value entries are saturated (|tanh| above 0.95); in the 4 runs where the layer-0 update is at least as large as W_v (1.2\u20137.9 \u00d7 \u2016W_v\u2016) it is mostly one or two directions (participation rank 1.1\u20131.9). The adaptation behaves like a binary hash with a large constant part rather than a graded associative memory. Keeping the codes unsaturated (a scale or a norm before the tanh) or removing the segment mean are the natural variants (not run).</p><p><b>Which passkey tokens are kept.</b> At the longest cut the read-out of the four passkey tokens from the cached values is 0.68 / 0.18 / 0.70 / 0.23 (mean over the probed segment-32 runs): an alternating pattern, as the loop model showed a period-3 pattern at 8 passkey tokens. Why the stored positions alternate is not explained here.</p><p><b>Seeds.</b> Both families switch their memory on in some seeds only; the means above are the summary, not the best seed.</p>"};
const NS = DATA.ns, ROWS = DATA.rows;
const fmt2 = v => (v == null ? '–' : v.toFixed(2));
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cell = (rk, n) => (DATA.results[rk] || {})[String(n)];
const perTxt = (r, key) => (r && r.per && r.per[key] ? 'seeds: ' + r.per[key].map(v => v == null ? '–' : v.toFixed(2)).join(' / ') : '');

// ---- colour helpers (tokens are read from CSS so both themes work)
function hex2rgb(h) { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); }
function mix(c1, c2, t) { return c1.map((v, i) => Math.round(v + (c2[i] - v) * t)); }
function seqColor(v) {
  const stops = [0, 1, 2, 3, 4].map(i => hex2rgb(cssv('--seq' + i)));
  const x = Math.max(0, Math.min(1, v)) * 4, i = Math.min(3, Math.floor(x));
  return mix(stops[i], stops[i + 1], x - i);
}
const lum = c => { const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }; return .2126 * f(c[0]) + .7152 * f(c[1]) + .0722 * f(c[2]); };
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
// ordinal colour for item i of n: i = 0 is the darkest (light mode) / lightest (dark mode)
const ordColor = (i, n) => { const s = [0, 1, 2, 3].map(k => hex2rgb(cssv('--ord' + k))); const j = n - 1 - i; const x = n === 1 ? 3 : j / (n - 1) * 3, k = Math.min(2, Math.floor(x)); return rgb(mix(s[k], s[k + 1], x - k)); };
const rowColor = i => (ROWS[i].color ? cssv(ROWS[i].color) : ordColor(i, ROWS.length));  // a row may name its own colour token
// series colour: explicit css colour, or an ordinal slot [i, n], or its position in the list
const serCol = (sr, i, spec) => sr.c || (sr.ord ? ordColor(sr.ord[0], sr.ord[1]) : ordColor(spec.ordReverse ? spec.series.length - 1 - i : i, spec.series.length));

// ---- tooltip
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { tip.style.display = 'none'; return; }
  tip.innerHTML = t.getAttribute('data-tip');
  tip.style.display = 'block';
  const w = tip.offsetWidth, x = Math.min(e.clientX + 14, window.innerWidth - w - 8);
  tip.style.left = Math.max(8, x) + 'px';
  tip.style.top = Math.min(e.clientY + 16, window.innerHeight - tip.offsetHeight - 8) + 'px';
});

// ---- figure 1: heatmaps (rows = configurations, columns = N)
function heatmap(host, key, title, extra) {
  const lw = DATA.label_w || 58, W = 760, left = lw, top = 54, right = 8, ch = 28, cw = (W - left - right) / NS.length;
  const H = top + ROWS.length * ch + 24, trainCols = NS.filter(n => n <= 256).length;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} by configuration and N">`;
  s += `<text x="0" y="13" style="fill:var(--ink);font-family:var(--sans);font-size:13px;font-weight:600">${esc(title)}</text>`;
  s += `<line x1="${left}" x2="${left + trainCols * cw - 4}" y1="34" y2="34" stroke="var(--axis)" stroke-width="1"/>`;
  s += `<text x="${left}" y="28" font-size="10">trained on N ≤ 256</text>`;
  s += `<text x="${left + trainCols * cw + 2}" y="28" font-size="10">${NS.length - trainCols >= 3 ? 'evaluation only, longer than training' : 'beyond training'}</text>`;
  NS.forEach((n, j) => { s += `<text x="${left + j * cw + cw / 2}" y="${top - 6}" font-size="10.5" text-anchor="middle">${n}</text>`; });
  ROWS.forEach((row, i) => {
    s += `<text x="${left - 8}" y="${top + i * ch + ch / 2 + 4}" font-size="11" text-anchor="end" style="fill:var(--ink)">${esc(row.label)}</text>`;
    NS.forEach((n, j) => {
      const r = cell(row.key, n), v = r ? r[key] : null, x = left + j * cw, y = top + i * ch;
      let fill, txt, tcol;
      if (v == null) { fill = cssv('--nodata'); txt = '–'; tcol = cssv('--muted'); }
      else { const c = seqColor(v); fill = rgb(c); txt = v >= .995 ? '1.00' : v.toFixed(2); tcol = lum(c) > .32 ? '#0b0b0b' : '#ffffff'; }
      const tipTxt = `${esc(row.long || row.label)}, N = ${n.toLocaleString()} (~${Math.round(n * 3.75 / 1000)}k tokens)<br>${esc(title)}: ${v == null ? 'no such queries' : v.toFixed(3)}${v != null && r ? '<br>' + perTxt(r, key) : ''}${extra && r && v != null ? '<br>' + extra(r) : ''}`;
      s += `<rect x="${x + 1}" y="${y + 1}" width="${cw - 2}" height="${ch - 2}" rx="2" fill="${fill}" data-tip="${esc(tipTxt)}"/>`;
      s += `<text x="${x + cw / 2}" y="${y + ch / 2 + 4}" font-size="10.5" text-anchor="middle" style="fill:${tcol};pointer-events:none">${txt}</text>`;
    });
  });
  s += `<line x1="${left + trainCols * cw - 1}" x2="${left + trainCols * cw - 1}" y1="${top - 2}" y2="${top + ROWS.length * ch}" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="3 3"/>`;
  host.innerHTML = s + '</svg>';
}

// ---- figure 2: scatter panels (one point per configuration, faint dots = seeds)
function scatter(host, n) {
  const S = 250, m = { l: 40, r: 12, t: 24, b: 38 }, iw = S - m.l - m.r, ih = S - m.t - m.b;
  const X = v => m.l + v * iw, Y = v => m.t + (1 - v) * ih;
  let s = `<svg viewBox="0 0 ${S} ${S}" role="img" aria-label="Passkey vs expired accuracy at N=${n}">`;
  s += `<text x="${m.l}" y="14" style="fill:var(--ink);font-family:var(--sans);font-size:13.5px;font-weight:600">N = ${n.toLocaleString()} writes</text>`;
  [0, .25, .5, .75, 1].forEach(t => {
    s += `<line x1="${m.l}" x2="${m.l + iw}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)" stroke-width=".8"/>`;
    s += `<line y1="${m.t}" y2="${m.t + ih}" x1="${X(t)}" x2="${X(t)}" stroke="var(--grid)" stroke-width=".8"/>`;
    s += `<text x="${m.l - 5}" y="${Y(t) + 3.5}" font-size="10.5" text-anchor="end">${Math.round(t * 100)}</text>`;
    s += `<text x="${X(t)}" y="${m.t + ih + 14}" font-size="10.5" text-anchor="middle">${Math.round(t * 100)}</text>`;
  });
  s += `<text x="${m.l + iw / 2}" y="${S - 6}" font-size="11" text-anchor="middle">expired-query accuracy, %</text>`;
  s += `<text transform="translate(10 ${m.t + ih / 2}) rotate(-90)" font-size="11" text-anchor="middle">passkey exact match, %</text>`;
  const groups = {};
  ROWS.forEach((row, i) => { const r = cell(row.key, n); if (!r) return; const k = r.expired.toFixed(2) + '|' + r.passkey.toFixed(2); (groups[k] = groups[k] || []).push({ row, i, r }); });
  Object.values(groups).forEach(g => {
    const r = g[0].r, cx = X(r.expired), cy = Y(r.passkey);
    const tipTxt = g.map(o => `${esc(o.row.long || o.row.label)}: passkey ${o.r.passkey.toFixed(3)}, expired ${o.r.expired.toFixed(3)}, valid ${o.r.valid.toFixed(3)}`).join('<br>');
    g.forEach(o => { if (o.r.per && o.r.per.passkey) o.r.per.passkey.forEach((pk, k) => { const ex = o.r.per.expired[k]; if (pk != null && ex != null) s += `<circle cx="${X(ex)}" cy="${Y(pk)}" r="2.6" fill="${rowColor(o.i)}" opacity=".4"/>`; }); });
    [...g].reverse().forEach(o => {  // drawn from the last row to the first so row 0 ends up on top
      const hollow = o.r.valid < .9;
      s += `<circle cx="${cx}" cy="${cy}" r="6" fill="${hollow ? 'var(--surface)' : rowColor(o.i)}" stroke="${hollow ? rowColor(o.i) : 'var(--surface)'}" stroke-width="${hollow ? 2 : 1.6}" data-tip="${esc(tipTxt)}"/>`;
    });
    const names = g.filter(o => !o.row.nolabel).map(o => o.row.slabel || o.row.label);  // rows may opt out of a label (identified by colour and tooltip)
    if (!names.length) return;
    const label = (DATA.row_prefix || '') + (names.length > 3 ? names[0] + ' … ' + names[names.length - 1] + ' (' + names.length + ')' : names.join(', '));
    const onRight = cx > m.l + iw * .55, lx = onRight ? cx - 10 : cx + 10;
    const ly = cy + (r.passkey > .5 ? 14 : -9);
    s += `<text x="${lx}" y="${ly}" font-size="10.5" class="endlabel" text-anchor="${onRight ? 'end' : 'start'}" style="fill:var(--ink)">${esc(label)}</text>`;
  });
  host.insertAdjacentHTML('beforeend', `<div>${s}</svg></div>`);
}

// ---- generic line chart: spec = { xTicks, x0, x1, xLog, xLabel, yLabel, yMax, series[], vlines[], note }

function lineChart(host, legendHost, spec) {
  const W = 760, H = spec.height || 340, m = { l: 52, r: spec.rightPad || 132, t: 14, b: 44 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const tr = v => spec.xLog === false ? v : Math.log2(v);
  const y0 = spec.yMin || 0, y1 = spec.yMax || 1;

  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.aria || 'line chart')}">`;
  [0, .25, .5, .75, 1].forEach(t => {

    s += `<line x1="${m.l}" x2="${m.l + iw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width=".8"/>`;
    s += `<text x="${m.l - 8}" y="${Y(v) + 3.5}" font-size="10.5" text-anchor="end">${(v * 100).toFixed(y1 - y0 < .5 ? 1 : 0)}%</text>`;
  });
  spec.xTicks.forEach(x => {

    s += `<text x="${X(x)}" y="${m.t + ih + 17}" font-size="10.5" text-anchor="middle">${x}</text>`;
  });
  s += `<line x1="${m.l}" x2="${m.l + iw}" y1="${m.t + ih}" y2="${m.t + ih}" stroke="var(--axis)"/>`;
  s += `<text x="${m.l + iw / 2}" y="${H - 8}" font-size="11" text-anchor="middle">${esc(spec.xLabel)}</text>`;
  s += `<text transform="translate(13 ${m.t + ih / 2}) rotate(-90)" font-size="11" text-anchor="middle">${esc(spec.yLabel)}</text>`;
  (spec.vlines || []).forEach(v => {
    s += `<line x1="${X(v.x)}" x2="${X(v.x)}" y1="${m.t}" y2="${m.t + ih}" stroke="var(--ink-2)" stroke-dasharray="3 3" stroke-width=".8"/>`;
    if (v.label) s += `<text x="${X(v.x) + 4}" y="${m.t + 10 + (v.dy || 0)}" font-size="9.5">${esc(v.label)}</text>`;
  });
  if (spec.note) s += `<text x="${m.l + 8}" y="${m.t + ih - 10}" font-size="10">${esc(spec.note)}</text>`;
  const ends = [];
  spec.series.forEach((sr, i) => {
    const col = serCol(sr, i, spec), pts = sr.points.filter(p => p.y != null);
    s += `<polyline fill="none" style="stroke:${col}" stroke-width="${sr.width || 2}" ${sr.dashed ? 'stroke-dasharray="6 4"' : ''} points="${pts.map(p => X(p.x) + ',' + Y(p.y)).join(' ')}"/>`;
    pts.forEach(p => {
      if (p.lo != null && p.hi != null && p.hi - p.lo > 1e-6) s += `<line x1="${X(p.x)}" x2="${X(p.x)}" y1="${Y(p.lo)}" y2="${Y(p.hi)}" style="stroke:${col}" stroke-width="1.4" opacity=".6"/>`;
      if (sr.noDots) return;
      const t = p.tip || `${sr.label}<br>${esc(spec.xLabel)}: ${p.x}<br>${esc(spec.yLabel)}: ${p.y.toFixed(3)}`;
      s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${sr.dashed ? 3.5 : 5}" style="fill:${sr.dashed ? 'var(--surface)' : col};stroke:${sr.dashed ? col : 'var(--surface)'}" stroke-width="1.6" data-tip="${esc(t)}"/>`;
    });
    if (sr.short && pts.length) { const last = pts[pts.length - 1]; ends.push({ x: X(last.x), py: Y(last.y), y: Y(last.y), text: sr.short }); }
  });
  // spread the end labels so they never touch each other or the axis
  const gap = 15, ymax = m.t + ih - 12;
  ends.sort((a, b) => a.y - b.y);
  for (let k = 1; k < ends.length; k++) ends[k].y = Math.max(ends[k].y, ends[k - 1].y + gap);
  if (ends.length && ends[ends.length - 1].y > ymax) { ends[ends.length - 1].y = ymax; for (let k = ends.length - 2; k >= 0; k--) ends[k].y = Math.min(ends[k].y, ends[k + 1].y - gap); }
  ends.forEach(e => {
    if (Math.abs(e.y - e.py) > 3) s += `<line x1="${e.x + 6}" y1="${e.py}" x2="${e.x + 12}" y2="${e.y}" stroke="var(--muted)" stroke-width=".8"/>`;
    s += `<text x="${e.x + 14}" y="${e.y + 4}" font-size="10.5" class="endlabel" style="fill:var(--ink)">${esc(e.text)}</text>`;
  });
  host.innerHTML = s + '</svg>';
  legendHost.innerHTML = spec.series.map((sr, i) => `<span><i class="${sr.dashed ? 'dash' : (spec.legendLine ? 'line' : '')}" style="${sr.dashed || spec.legendLine ? 'border-color' : 'background'}:${serCol(sr, i, spec)}"></i>${esc(sr.label)}</span>`).join('');
}

function table(cols, rows) {
  return `<table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function renderCharts() {
  heatmap($('#hm-passkey'), 'passkey', 'Passkey exact match', r => `${r.n_examples} examples per seed`);
  heatmap($('#hm-valid'), 'valid', DATA.valid_title, r => `${r.n_valid.toLocaleString()} queries per seed`);
  heatmap($('#hm-stale'), 'stale', DATA.stale_title, r => `${r.n_stale.toLocaleString()} queries per seed`);
  if (!DATA.hide_scatter) { $('#scatter').innerHTML = ''; DATA.scatter_ns.forEach(n => scatter($('#scatter'), n)); }
  DATA.extra_figs.forEach((f, i) => { if (f.spec) lineChart($('#ch-' + i), $('#lg-' + i), f.spec); });  // a figure may carry html instead of a line chart
}

function fillText() {
  $('#meta').innerHTML = DATA.meta;
  $('#tldr').innerHTML = DATA.tldr.map(t => `<li>${t}</li>`).join('');
  $('#intro').innerHTML = DATA.intro || '';  // optional block between the summary and the cards (a method description with its own figures)
  $('#tested-h').textContent = DATA.tested_title || 'What was tested'; $('#results-h').textContent = DATA.results_title || 'Results'; $('#next-h').textContent = DATA.next_title || 'What is next';
  if (DATA.fig1_title) $('#fig1-title').textContent = DATA.fig1_title;
  if (DATA.hide_scatter) $('#fig2-fig').remove();
  $('#tested').innerHTML = DATA.tested.map(c => `<div class="card"><h3>${c.title} <span class="tag ${c.ok ? 'ok' : ''}">${esc(c.tag)}</span></h3><p>${c.body}</p></div>`).join('');
  if (!DATA.tested.length) { $('#tested-h').remove(); $('#tested').remove(); }
  $('#results-intro').innerHTML = DATA.results_intro;
  $('#fig1-sub').innerHTML = DATA.fig1_sub;
  $('#cap1').innerHTML = DATA.cap1;
  if (!DATA.hide_scatter) { $('#fig2-sub').innerHTML = DATA.fig2_sub; $('#cap2').innerHTML = DATA.cap2; }
  $('#next').innerHTML = DATA.next;
  const rows = [];
  ROWS.forEach(row => NS.forEach(n => { const r = cell(row.key, n); if (r) rows.push([row.label, n, fmt2(r.passkey), fmt2(r.valid), fmt2(r.stale), fmt2(r.expired), r.n_stale]); }));
  $('#tbl1').innerHTML = table([DATA.row_name, 'N', 'passkey', 'ar_valid', 'expired (stale)', 'expired (all)', '# stale queries per seed'], rows);
  if (!DATA.hide_scatter) {
    const rows2 = [];
    DATA.scatter_ns.forEach(n => ROWS.forEach(row => { const r = cell(row.key, n); if (r) rows2.push([n, row.label, fmt2(r.expired), fmt2(r.passkey), fmt2(r.valid)]); }));
    $('#tbl2').innerHTML = table(['N', DATA.row_name, 'expired acc', 'passkey', 'ar_valid'], rows2);
  }
  $('#extra-figs').innerHTML = DATA.extra_figs.map((f, i) => `
    <figure>
      <div class="fig-title">${f.title}</div>
      <p class="fig-sub">${f.sub}</p>
      ${f.spec ? `<div class="legend" id="lg-${i}"></div><div class="chart" id="ch-${i}"></div>` : ''}${f.html || ''}
      <figcaption>${f.caption}</figcaption>
      ${f.spec ? `<details><summary>Table view</summary><div class="tbl" id="tb-${i}"></div></details>` : ''}
    </figure>`).join('');
  DATA.extra_figs.forEach((f, i) => {
    if (!f.spec) return;
    const rws = []; f.spec.series.forEach(sr => sr.points.forEach(p => rws.push([sr.label, p.x, p.y == null ? '–' : p.y.toFixed(3), p.lo != null ? `${p.lo.toFixed(3)} to ${p.hi.toFixed(3)}` : ''])));
    $('#tb-' + i).innerHTML = table(['series', f.spec.xLabel, f.spec.yLabel, 'range over seeds'], rws);
  });
}
fillText();
renderCharts();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderCharts);
new MutationObserver(renderCharts).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
</script>
