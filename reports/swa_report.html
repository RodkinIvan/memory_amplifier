<title>SWA Baseline Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column; the summary comes first, each chart sits in its own bordered figure with the description under it. */
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10); --nodata: #ecebe6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --seq0: #eaf2fd; --seq1: #9ec5f4; --seq2: #3987e5; --seq3: #1c5cab; --seq4: #0d366b;
  --ord0: #86b6ef; --ord1: #3987e5; --ord2: #1c5cab; --ord3: #0d366b;
  --good: #0f6b2f;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --nodata: #262624;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --seq0: #14294a; --seq1: #1c5cab; --seq2: #3987e5; --seq3: #86b6ef; --seq4: #cde2fb;
    --ord0: #cde2fb; --ord1: #6da7ec; --ord2: #2a78d6; --ord3: #1c5cab;
    --good: #5fd98a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --nodata: #262624;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --seq0: #14294a; --seq1: #1c5cab; --seq2: #3987e5; --seq3: #86b6ef; --seq4: #cde2fb;
  --ord0: #cde2fb; --ord1: #6da7ec; --ord2: #2a78d6; --ord3: #1c5cab;
  --good: #5fd98a;
}
body { background: var(--page); color: var(--ink); font: 15px/1.6 var(--sans); margin: 0; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }
h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 6px; font-weight: 600; text-wrap: balance; }
h2 { font-size: 1.2rem; margin: 40px 0 10px; font-weight: 600; text-wrap: balance; }
h3 { font-size: 1rem; margin: 0 0 4px; font-weight: 600; }
p { margin: 0 0 10px; max-width: 70ch; }
.meta { color: var(--ink-2); font-size: .9rem; margin: 0 0 22px; }
code, .mono { font-family: var(--mono); font-size: .88em; }
.summary { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; }
.summary ol { margin: 8px 0 0; padding-left: 1.2em; display: grid; gap: 8px; }
.summary li { max-width: 78ch; }
.status { display: inline-flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: .85rem; color: var(--ink-2); font-family: var(--mono); }
.status b { color: var(--ink); font-weight: 500; }
figure { margin: 18px 0 0; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 14px 10px; }
figcaption { color: var(--ink-2); font-size: .92rem; margin-top: 8px; }
figcaption p { max-width: 82ch; }
.fig-title { font-weight: 600; font-size: .98rem; }
.fig-sub { color: var(--ink-2); font-size: .86rem; margin: 0 0 8px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { font-family: var(--mono); fill: var(--ink-2); }
.chart text.endlabel { paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.hm-scroll { overflow-x: auto; }
.hm-scroll svg { min-width: 640px; }
.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .84rem; color: var(--ink-2); margin: 4px 0 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.legend i.line { width: 18px; height: 0; border-radius: 0; border-top: 2px solid; vertical-align: 3px; }
.legend i.dash { width: 18px; height: 0; border-radius: 0; border-top: 2px dashed; vertical-align: 3px; }
.pbar { display: grid; grid-template-columns: minmax(150px, 290px) minmax(0, 1fr); gap: 2px 12px; align-items: center; margin: 5px 0; font-size: .8rem; color: var(--ink-2); }
.pbar .stack { display: flex; height: 22px; border-radius: 3px; overflow: hidden; border: 1px solid var(--border); }
.pbar .stack i { display: block; min-width: 0; font: 10.5px/22px var(--mono); text-align: center; font-style: normal; overflow: hidden; }
details { margin-top: 8px; font-size: .86rem; }
summary { cursor: pointer; color: var(--ink-2); }
summary:focus-visible, a:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.tbl { overflow-x: auto; margin-top: 6px; }
table { border-collapse: collapse; font-family: var(--mono); font-size: .8rem; font-variant-numeric: tabular-nums; }
th, td { padding: 3px 9px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
.tbl.kv th, .tbl.kv td { text-align: left; white-space: normal; vertical-align: top; }
.tbl.wide td:first-child { white-space: normal; min-width: 240px; max-width: 420px; }
.hint { color: var(--muted); font-size: .72rem; }
th { color: var(--ink-2); font-weight: 500; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-top: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.card p { font-size: .9rem; }
ul.tight { margin: 4px 0 10px; padding-left: 1.2em; display: grid; gap: 4px; max-width: 82ch; }
.tag { font-family: var(--mono); font-size: .75rem; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--border); color: var(--ink-2); white-space: nowrap; }
.tag.ok { color: var(--good); border-color: var(--good); }
#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--page); font: 12px/1.45 var(--mono); padding: 6px 9px; border-radius: 5px; max-width: 300px; display: none; }
@media (max-width: 520px) { h1 { font-size: 1.5rem; } .wrap { padding-block: 20px 48px; } .pbar { grid-template-columns: 1fr; } }
</style>

pired": 0.9996159303866495, "n_examples": 1000, "n_valid": 2046081, "n_stale": 2029997, "per": {"passkey": [0.0, 0.0, 0.0], "valid": [0.9597078512532007, 0.9711756279443482, 0.9896641433061546], "stale": [0.9988571411681889, 0.9999960591074765, 0.9999931034380839], "expired": [0.9988585412000172, 0.9999960908945206, 0.9999931590654111]}}}}, "scatter_ns": [32, 64, 256, 16384], "label_w": 124, "row_name": "configuration", "row_prefix": "", "meta": "Phase 1, 2 Oct 2026. <span class='status'><span>runs finished: <b>18/18</b></span><span>\u00b7</span><span>3 seeds per configuration</span></span>", "tldr": ["<b>Sliding-window attention solves the AR half by construction.</b> Stale-key accuracy is at least 0.998 in all 18 runs at every N up to 16,384. Valid accuracy is at least 0.99 except for W32 L2 (0.96): one window covers 0.74 of the valid answers and the full reach 0.99. Such a model has to relay writes across layers, which it does only in part.", "<b>The passkey is out of reach almost everywhere, as the bound says.</b> Information travels at most R = layers \u00d7 (window \u2212 1) tokens (verified in the code: nothing leaks beyond R). Configurations with a seed-mean passkey of at least 50% at some N: W128 L4 up to N = 64; W128 L2 up to N = 32. At N = 256 (about 1k tokens) the best configuration scores 0.00. Never above 50%: W64 L4, W64 L2, W32 L4, W32 L2.", "<b>The practical cliff is below the nominal reach.</b> W128 L4 (R = 508) holds the passkey up to N = 64 (~251 tokens, 0.67) and is at 0.41 by N = 80 (~312 tokens), well short of its nominal reach. On streams shorter than any seen in training it falls too (0.06 at N = 4), which suggests the passkey is learned as a lookup at the training distances rather than as a search for the PK marker.", "<b>Expiry follows token distance, not the number of writes.</b> With more queries between writes, valid accuracy falls (at 2 queries per write: W128 L4 0.90, W128 L2 0.90, W64 L4 0.89, W64 L2 0.89, W32 L4 0.92, W32 L2 0.86), while GDN \u03b1 = 1 stays at 1.000. At the training density valid writes are at most 92 tokens back and stale ones at least 98, so a distance threshold solves expiry exactly. That is a weakness of the benchmark, not of the models.", "<b>Role in the project.</b> This is the floor for the memory-amplification step: AR solved, the passkey lost beyond a few hundred tokens. GDN \u03b1 = 1 holds the passkey to about N = 1,024 (about 4k tokens) for comparison."], "tested": [{"title": "Reach bound", "tag": "passed", "ok": true, "body": "Unit test on the actual implementation: changing token 0 changes the output at positions 0 to L\u00b7(W\u22121) and leaves every later position bit-identical, for several (window, layers) pairs. A 61k-token sequence runs finite."}, {"title": "SWA sweep", "tag": "18/18 runs", "ok": true, "body": "Window 32, 64, 128 \u00d7 2 and 4 layers \u00d7 3 seeds. Stock fla transformer blocks, RoPE, 4 heads of dim 32, d_model 128, same data, optimiser (30k steps, N \u2264 256) and evaluation as the GDN sweep. Trained in bf16 autocast (flash-attention needs it); the GDN runs were fp32. Logged to wandb project passkey_swar."}, {"title": "Passkey vs stream length", "tag": "probe", "ok": true, "body": "Fresh streams with N from 4 to 256 writes (200 per point and model, own probe seed), to see where the passkey stops working. Streams shorter than N = 32 were never seen in training."}, {"title": "Query-density probe", "tag": "probe", "ok": true, "body": "Fresh streams at N = 256 with 0.1 to 2 queries per write (training: 0.25), same answer rule in writes. Separates a token-distance rule from counting writes. Run on all SWA models and on GDN \u03b1 = 1."}, {"title": "Reach ceilings", "tag": "analysis", "ok": true, "body": "From the validation data: the share of valid answers within one window and within the full reach (table under figure 1). Valid writes are at most 92 tokens back, stale ones at least 98."}], "results_intro": "<b>SWA has no decay.</b> It keeps no recurrent state and has no multiplier like GDN\u2019s \u03b1: each layer attends exactly to the last W tokens, and anything older has weight zero. Forgetting is a hard cutoff, and the only memory-length knob is the reach R = L\u00b7(W\u22121) tokens, the farthest distance information can travel through L layers. \u03b1 appears in this report only on the dashed GDN line in figure 4, for contrast. Rows are (window W, layers L, reach R). All numbers are from the <b>test</b> split (1,000 examples per N), as the mean over the seeds finished so far (hover a cell for the individual seeds), after 30k training steps on N \u2264 256.", "fig1_sub": "Columns: number of AR writes N (a write is about 3.75 tokens, so 16384 is about 61k tokens). Darker is higher.", "fig2_sub": "One point per configuration (mean over seeds, faint dots = seeds). Ideal is the top-right corner.", "valid_title": "AR valid accuracy (key written within the last 16 writes)", "stale_title": "AR expired accuracy, stale keys only (last write more than 32 writes ago)", "cap1": "<p><b>Bottom two grids:</b> stale-key accuracy is at least 0.998 everywhere, and valid accuracy is flat in N: it depends on the distance to the write, not on the stream length. Where one window cannot cover every valid answer, the measured accuracy sits between the one-window and the full-reach ceiling (one window / full reach / measured: W64 L4: 0.99 / 1.00 / 0.99; W64 L2: 0.99 / 1.00 / 0.99; W32 L4: 0.74 / 1.00 / 1.00; W32 L2: 0.74 / 0.99 / 0.98), so models relay across layers when it pays off, but not for the last few queries.</p><p><b>Top grid:</b> the passkey is 0 almost everywhere. The non-zero cells are at N = 32 and N = 64, where the passkey is still inside the reach. Hover a cell for the seeds.</p><div class='tbl'><table><thead><tr><th>config</th><th>one window, tokens</th><th>full reach R, tokens</th><th>valid answers within one window</th><th>within R</th><th>measured valid accuracy</th></tr></thead><tbody><tr><td>W128 L4</td><td>127</td><td>508</td><td>1.000</td><td>1.000</td><td>1.000</td></tr><tr><td>W128 L2</td><td>127</td><td>254</td><td>1.000</td><td>1.000</td><td>1.000</td></tr><tr><td>W64 L4</td><td>63</td><td>252</td><td>0.991</td><td>1.000</td><td>0.995</td></tr><tr><td>W64 L2</td><td>63</td><td>126</td><td>0.991</td><td>1.000</td><td>0.995</td></tr><tr><td>W32 L4</td><td>31</td><td>124</td><td>0.737</td><td>1.000</td><td>1.000</td></tr><tr><td>W32 L2</td><td>31</td><td>62</td><td>0.737</td><td>0.991</td><td>0.976</td></tr></tbody></table></div>", "cap2": "<p>Expired-query accuracy is at least 0.999 for every configuration, so all points sit on the right edge. The passkey separates them only at the shortest lengths. At N = 256 the best configuration scores 0.00 and at N = 16,384 every configuration is at 0, the bottom-right corner: the target corner (top right) is empty, which the window guarantees.</p>", "extra_figs": [{"title": "3. Where the passkey stops: accuracy against stream length", "sub": "Fresh streams, 200 per point and model. Stream length is measured in tokens (N writes is about 3.75 N tokens). Models (seeds) per configuration: W128 L4: 3, W128 L2: 3, W64 L4: 3, W64 L2: 3, W32 L4: 3, W32 L2: 3.", "caption": "<p>Passkey exact match against stream length (log scale; mean over seeds, bars show the seed range). Dotted lines are the nominal reaches R. W128 L4 (R = 508) holds the passkey up to N = 64 (~251 tokens, 0.67) and is at 0.41 by N = 80 (~312 tokens), well short of its nominal reach. Never above 50% at any length: W64 L4, W64 L2, W32 L4, W32 L2. Below the training range the best configuration falls too (0.06 at N = 4, about 27 tokens).</p>", "spec": {"series": [{"label": "W32 L2 (R = 62)", "short": "W32 L2", "points": [{"x": 27, "y": 0.0, "lo": 0.0, "hi": 0.0, "n": 4, "tip": "window 32, 2 layers, reach 62 tokens (3 seeds)<br>N = 4 writes, ~27 tokens<br>passkey 0.000 (seeds 0.00 to 0.00)"}, {"x": 43, "y": 0.0, "lo": 0.0, "hi": 0.0, "n": 8, "tip": "window 32, // ---- colour helpers (tokens are read from CSS so both themes work)
function hex2rgb(h) { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); }

// ---- figure 1: heatmaps (rows = configurations, columns = N)

  s += `<text x="${left}" y="28" font-size="10">trained on N ≤ 256</text>`;
  s += `<text x="${left + trainCols * cw + 2}" y="28" font-size="10">${NS.length - trainCols >= 3 ? 'evaluation only, longer than training' : 'beyond training'}</text>`;

    s += `<text x="${X(x)}" y="${m.t + ih + 17}" font-size="10.5" text-anchor="middle">${x}</text>`;
  });
  s += `<line x1="${m.l}" x2="${m.l + iw}" y1="${m.t + ih}" y2="${m.t + ih}" stroke="var(--axis)"/>`;
  s += `<text x="${m.l + iw / 2}" y="${H - 8}" font-size="11" text-anchor="middle">${esc(spec.xLabel)}</text>`;
  s += `<text transform="translate(13 ${m.t + ih / 2}) rotate(-90)" font-size="11" text-anchor="middle">${esc(spec.yLabel)}</text>`;
  (spec.vlines || []).forEach(v => {
    s += `<line x1="${X(v.x)}" x2="${X(v.x)}" y1="${m.t}" y2="${m.t + ih}" stroke="var(--ink-2)" stroke-dasharray="3 3" stroke-width=".8"/>`;
    if (v.label) s += `<text x="${X(v.x) + 4}" y="${m.t + 10 + (v.dy || 0)}" font-size="9.5">${esc(v.label)}</text>`;
  });
  if (spec.note) s += `<text x="${m.l + 8}" y="${m.t + ih - 10}" font-size="10">${esc(spec.note)}</text>`;
  const ends = [];
  spec.series.forEach((sr, i) => {
    const col = serCol(sr, i, spec), pts = sr.points.filter(p => p.y != null);
    s += `<polyline fill="none" style="stroke:${col}" stroke-width="${sr.width || 2}" ${sr.dashed ? 'stroke-dasharray="6 4"' : ''} points="${pts.map(p => X(p.x) + ',' + Y(p.y)).join(' ')}"/>`;
    pts.forEach(p => {
      if (p.lo != null && p.hi != null && p.hi - p.lo > 1e-6) s += `<line x1="${X(p.x)}" x2="${X(p.x)}" y1="${Y(p.lo)}" y2="${Y(p.hi)}" style="stroke:${col}" stroke-width="1.4" opacity=".6"/>`;
      if (sr.noDots) return;
      const t = p.tip || `${sr.label}<br>${esc(spec.xLabel)}: ${p.x}<br>${esc(spec.yLabel)}: ${p.y.toFixed(3)}`;
      s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${sr.dashed ? 3.5 : 5}" style="fill:${sr.dashed ? 'var(--surface)' : col};stroke:${sr.dashed ? col : 'var(--surface)'}" stroke-width="1.6" data-tip="${esc(t)}"/>`;
    });
    if (sr.short && pts.length) { const last = pts[pts.length - 1]; ends.push({ x: X(last.x), py: Y(last.y), y: Y(last.y), text: sr.short }); }
  });
  // spread the end labels so they never touch each other or the axis
  const gap = 15, ymax = m.t + ih - 12;
  ends.sort((a, b) => a.y - b.y);
  for (let k = 1; k < ends.length; k++) ends[k].y = Math.max(ends[k].y, ends[k - 1].y + gap);
  if (ends.length && ends[ends.length - 1].y > ymax) { ends[ends.length - 1].y = ymax; for (let k = ends.length - 2; k >= 0; k--) ends[k].y = Math.min(ends[k].y, ends[k + 1].y - gap); }
  ends.forEach(e => {
    if (Math.abs(e.y - e.py) > 3) s += `<line x1="${e.x + 6}" y1="${e.py}" x2="${e.x + 12}" y2="${e.y}" stroke="var(--muted)" stroke-width=".8"/>`;
    s += `<text x="${e.x + 14}" y="${e.y + 4}" font-size="10.5" class="endlabel" style="fill:var(--ink)">${esc(e.text)}</text>`;
  });
  host.innerHTML = s + '</svg>';
  legendHost.innerHTML = spec.series.map((sr, i) => `<span><i class="${sr.dashed ? 'dash' : (spec.legendLine ? 'line' : '')}" style="${sr.dashed || spec.legendLine ? 'border-color' : 'background'}:${serCol(sr, i, spec)}"></i>${esc(sr.label)}</span>`).join('');
}

function table(cols, rows) {
  return `<table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function renderCharts() {
  heatmap($('#hm-passkey'), 'passkey', 'Passkey exact match', r => `${r.n_examples} examples per seed`);
  heatmap($('#hm-valid'), 'valid', DATA.valid_title, r => `${r.n_valid.toLocaleString()} queries per seed`);
  heatmap($('#hm-stale'), 'stale', DATA.stale_title, r => `${r.n_stale.toLocaleString()} queries per seed`);
  $('#scatter').innerHTML = '';
  DATA.scatter_ns.forEach(n => scatter($('#scatter'), n));
  DATA.extra_figs.forEach((f, i) => { if (f.spec) lineChart($('#ch-' + i), $('#lg-' + i), f.spec); });  // a figure may carry html instead of a line chart
}

function fillText() {
  $('#meta').innerHTML = DATA.meta;
  $('#tldr').innerHTML = DATA.tldr.map(t => `<li>${t}</li>`).join('');
  $('#tested').innerHTML = DATA.tested.map(c => `<div class="card"><h3>${c.title} <span class="tag ${c.ok ? 'ok' : ''}">${esc(c.tag)}</span></h3><p>${c.body}</p></div>`).join('');
  $('#results-intro').innerHTML = DATA.results_intro;
  $('#fig1-sub').innerHTML = DATA.fig1_sub; $('#fig2-sub').innerHTML = DATA.fig2_sub;
  $('#cap1').innerHTML = DATA.cap1; $('#cap2').innerHTML = DATA.cap2;
  $('#next').innerHTML = DATA.next;
  const rows = [];
  ROWS.forEach(row => NS.forEach(n => { const r = cell(row.key, n); if (r) rows.push([row.label, n, fmt2(r.passkey), fmt2(r.valid), fmt2(r.stale), fmt2(r.expired), r.n_stale]); }));
  $('#tbl1').innerHTML = table([DATA.row_name, 'N', 'passkey', 'ar_valid', 'expired (stale)', 'expired (all)', '# stale queries per seed'], rows);
  const rows2 = [];
  DATA.scatter_ns.forEach(n => ROWS.forEach(row => { const r = cell(row.key, n); if (r) rows2.push([n, row.label, fmt2(r.expired), fmt2(r.passkey), fmt2(r.valid)]); }));
  $('#tbl2').innerHTML = table(['N', DATA.row_name, 'expired acc', 'passkey', 'ar_valid'], rows2);
  $('#extra-figs').innerHTML = DATA.extra_figs.map((f, i) => `
    <figure>
      <div class="fig-title">${f.title}</div>
      <p class="fig-sub">${f.sub}</p>
      ${f.spec ? `<div class="legend" id="lg-${i}"></div><div class="chart" id="ch-${i}"></div>` : ''}${f.html || ''}
      <figcaption>${f.caption}</figcaption>
      ${f.spec ? `<details><summary>Table view</summary><div class="tbl" id="tb-${i}"></div></details>` : ''}
    </figure>`).join('');
  DATA.extra_figs.forEach((f, i) => {
    if (!f.spec) return;
    const rws = []; f.spec.series.forEach(sr => sr.points.forEach(p => rws.push([sr.label, p.x, p.y == null ? '–' : p.y.toFixed(3), p.lo != null ? `${p.lo.toFixed(3)} to ${p.hi.toFixed(3)}` : ''])));
    $('#tb-' + i).innerHTML = table(['series', f.spec.xLabel, f.spec.yLabel, 'range over seeds'], rws);
  });
}
fillText();
renderCharts();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderCharts);
new MutationObserver(renderCharts).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
</script>
