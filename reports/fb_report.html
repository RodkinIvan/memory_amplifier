.pbar { display: grid; grid-template-columns: minmax(150px, 290px) minmax(0, 1fr); gap: 2px 12px; align-items: center; margin: 5px 0; font-size: .8rem; color: var(--ink-2); }

summary { cursor: pointer; color: var(--ink-2); }

.tbl { overflow-x: auto; margin-top: 6px; }
table { border-collapse: collapse; font-family: var(--mono); font-size: .8rem; font-variant-numeric: tabular-nums; }

tale": 0.9999394634036096, "expired": 0.9999414099118805, "n_examples": 1000, "n_valid": 512199, "n_stale": 495568, "per": {"passkey": [0.004], "valid": [0.9941643775173321], "stale": [0.9999394634036096], "expired": [0.9999414099118805]}}, "8192": {"passkey": 0.001, "valid": 0.9944103818089557, "stale": 0.9999245264281635, "expired": 0.9999247434680751, "n_examples": 1000, "n_valid": 1022789, "n_stale": 1006975, "per": {"passkey": [0.001], "valid": [0.9944103818089557], "stale": [0.9999245264281635], "expired": [0.9999247434680751]}}, "16384": {"passkey": 0.0, "valid": 0.9943663031913204, "stale": 0.9999241378189229, "expired": 0.9999247497195217, "n_examples": 1000, "n_valid": 2046081, "n_stale": 2029997, "per": {"passkey": [0.0], "valid": [0.9943663031913204], "stale": [0.9999241378189229], "expired": [0.9999247497195217]}}}}, "row_runs": {"ref": ["swa_steps20000_cur2000_w64_L2_s0", "swa_steps20000_cur2000_w64_L2_s1", "swa_steps20000_cur2000_w64_L2_s2"], "64_tanh_0_20000": ["swa_fb_nltanh_seg64_s0", "swa_fb_nltanh_seg64_s1", "swa_fb_nltanh_seg64_s2"], "32_tanh_0_20000": ["swa_fb_nltanh_seg32_s0", "swa_fb_nltanh_seg32_s1", "swa_fb_nltanh_seg32_s2"], "16_tanh_0_20000": ["swa_fb_nltanh_seg16_s0", "swa_fb_nltanh_seg16_s1", "swa_fb_nltanh_seg16_s2"], "8_tanh_0_20000": ["swa_fb_seg8_nltanh_s0", "swa_fb_seg8_nltanh_s1"], "64_none_0_20000": ["swa_fb_nlnone_seg64_s0", "swa_fb_nlnone_seg64_s1", "swa_fb_nlnone_seg64_s2"], "32_none_0_20000": ["swa_fb_nlnone_seg32_s0", "swa_fb_nlnone_seg32_s1", "swa_fb_nlnone_seg32_s2"], "16_none_0_20000": ["swa_fb_nlnone_seg16_s0", "swa_fb_nlnone_seg16_s1", "swa_fb_nlnone_seg16_s2"], "8_none_0_20000": ["swa_fb_seg8_nlnone_s0", "swa_fb_seg8_nlnone_s1"], "32_tanh_0.1_20000": ["swa_fb_seg32_noise0.1_nltanh_s0"], "32_tanh_0.3_20000": ["swa_fb_seg32_noise0.3_nltanh_s0"], "32_none_0.1_20000": ["swa_fb_seg32_noise0.1_nlnone_s0"], "32_none_0.3_20000": ["swa_fb_seg32_noise0.3_nlnone_s0"], "64_tanh_0_40000": ["swa_fb_steps40000_seg64_nltanh_s0"], "32_tanh_0_40000": ["swa_fb_steps40000_seg32_nltanh_s0"], "64_none_0_40000": ["swa_fb_steps40000_seg64_nlnone_s0"], "32_none_0_40000": ["swa_fb_steps40000_seg32_nlnone_s0"]}, "recipe_gain": 0.1, "scatter_ns": [1024, 16384], "label_w": 330, "row_name": "configuration", "row_prefix": "", "meta": "Phase 1, results of 06 Oct 2026, 00:03. <span class='status'><span>main sweep: <b>18/18 runs</b></span><span>\u00b7</span><span>extra runs: <b>12/12</b></span><span>\u00b7</span><span><b>1 runs in progress</b></span></span>", "tldr": ["<b>The loop works inside the training range.</b> With the stream-length curriculum, a 2-layer window-64 model (reach 126 tokens) that cannot answer the passkey at all (0.00 without the loop) keeps it at N = 256, about 8 times its reach: 0.96 for the no-tanh loop and 0.78 for the tanh loop at segment 64, with AR valid accuracy 0.99, the same as the plain window.", "<b>One configuration carries the passkey to about 488 times the attention reach, but not reliably.</b> Window 64, segment 8, no tanh, gain 0 (seed 0): passkey 0.93 at N = 16,384 (about 61k tokens, 7,680 loop hops) with AR valid 0.99 and AR expired 1.00, on validation 0.93; the plain window with the same training is at 0.00. It is not reliable: the three seeds score 0.93 / 0.01 / 0.72 at N = 16,384, and only 4 of 24 gain-0 runs learned both halves (figure 3).", "<b>No evidence that a smaller segment extrapolates better.</b> Passkey at N = 1024, 4\u00d7 the longest training stream, for segment 64 / 32 / 16 / 8: no-tanh loop 0.23 / 0.43 / 0.04 / 0.09, tanh loop 0.36 / 0.09 / 0.05 / 0.14. The hypothesis that a smaller segment extrapolates better is not supported by these runs: neither loop shows a monotone trend. The best segment at N = 1024 is 32 for the no-tanh loop (seeds 0.00, 0.65, 0.63) and 64 for the tanh loop (seeds 0.37, 0.31, 0.40). Small segments can fit the training range (N = 256, no-tanh loop, segment 64 / 32 / 16 / 8: 0.96 / 0.65 / 0.88 / 1.00) but do no better beyond it. Training also becomes less reliable: runs whose training loss stayed above 0.1 (segment 64: 0 of 6, segment 32: 1 of 6, segment 16: 1 of 6, segment 8: 3 of 4); at segment 8, 3 of 4 runs did not learn the AR half (valid accuracy below 0.6). The comparison is also handicapped by a slow start: the AR half is learned later the smaller the segment (AR valid accuracy at N = 256, mean over runs: segment 64: 0.62 at step 2,000 and 0.94 at step 6,000, segment 32: 0.17 at step 2,000 and 0.96 at step 6,000, segment 16: 0.00 at step 2,000 and 0.68 at step 6,000), so small segments spend less of the 20k steps on long streams. The gain-0 runs further down remove this confound.", "<b>With the loop gain at 0 the AR stall is gone, but the loop often does not start, and one configuration holds the passkey far longer than anything else.</b> AR valid accuracy at N = 256 after 2,000 steps, segments 64 / 32 / 16 / 8: gain 0.1: 0.61 / 0.17 / 0.00 / 0.00; gain 0: 0.96 / 0.70 / 0.79 / 0.73. In return the loop did not start (passkey below 0.5 at N = 64) in 7 of 12 gain-0 runs at segments 16 and 8, against 0 of 10 at gain 0.1. The best gain-0 configuration is the no-tanh loop at segment 8: passkey 0.73 / 0.60 / 0.55 at N = 1,024 / 4,096 / 16,384 (seeds at N = 16,384: 0.93, 0.01, 0.72; AR valid accuracy at N = 256 per seed: 0.99, 0.99, 0.00), about 7,680 loop hops. The best configuration of the main grid and extras at N = 16,384 is window 64, segment 32, tanh loop \u00b7 noise 0 \u2192 0.3 (1) with 0.42.", "<b>The tanh loop keeps a floor, the no-tanh loop does not.</b> No-tanh loops fit the training range better and are at 0.01 or less by N = 4096 in every configuration. The segment-64 tanh loop holds 0.19 / 0.15 / 0.14 at N = 4096 / 8192 / 16384 (about 960 loop hops at the end), a constant instead of a decay. GDN \u03b1 = 1 (3 seeds) is better in range: 1.00 at N = 512, 0.97 at 1024, 0.53 at 2048, then 0.09 at 4096 and 0.00 at 16384; the models are not size-matched: 441k parameters, 1 head, fp32 for GDN against 563k, 4 heads, bf16 for the loop models. The loop does not beat GDN \u03b1 = 1 where GDN works (N \u2264 2048), but at N = 16384 GDN is at zero and the tanh loop is not.", "<b>Noise during training made the retention all-or-nothing</b> (one seed). For the segment-32 tanh loop with noise 0.3, 43% of the streams at N = 4096 keep all four passkey tokens, 35% keep none and only 22% keep some. The segment-64 tanh loop (seed 2) at the same N has 26% with all four, 1% with none and 74% with some: a graded loss, as for the no-tanh loop at N = 1024, where the four tokens are right 94% / 86% / 72% / 48% of the time, later tokens first. An intact-or-gone passkey is what error-correcting (attractor) dynamics would produce. Noise 0.1 does not help (0.00 at N = 4096).", "<b>The runs that keep the passkey correct perturbations of their loop vector.</b> In the 4 probed runs that hold the passkey at N = 4,096 (window 64, segment 8 \u00b7 no tanh \u00b7 gain 0 \u00b7 seed 0, window 64, segment 8 \u00b7 no tanh \u00b7 gain 0 \u00b7 seed 2, window 64, segment 32 \u00b7 tanh \u00b7 noise 0.3 \u00b7 seed 0, window 64, segment 64 \u00b7 tanh \u00b7 seed 2) a perturbation of 0.3 times the RMS of m leaves at least 91% of the clean exact match and one of 1.0 times the RMS at least 56%; the difference to the clean run shrinks to 1.2% of its start within 64 hops at most, and the one-hop Jacobian has a spectral radius of 0.16 to 0.97. Contraction alone is not retention: the 4 probed runs that lose the passkey (clean exact match below 0.05) have spectral radii of 0.12 to 1.39, and the largest one belongs to a no-tanh loop whose state is large and keeps drifting. What decides retention is therefore not contraction by itself; a direct test is whether the retaining runs hold one stable state per passkey (decode the passkey from m late in the stream).", "<b>Twice the training helps a little and changes no horizon</b> (one seed each). At N = 1024: segment-64 tanh 0.49 (20k steps: 0.36), segment-32 no-tanh 0.54 (0.43); the no-tanh loops are still at 0 by N = 4096.", "<b>50k steps instead of 20k (gain 0, same curriculum), and plain windows trained the same way.</b> window 64, segment 32 \u00b7 no tanh \u00b7 gain 0, 50k steps (3 seeds): passkey at N = 1,024 / 4,096 / 16,384 0.67 / 0.37 / 0.70 | 0.00 / 0.00 / 0.01 | 0.00 / 0.00 / 0.00 per seed, means 0.58 / 0.00 / 0.00 against 0.56 / 0.01 / 0.00 after 20k steps; window 64, segment 64 \u00b7 tanh \u00b7 gain 0, 50k steps (3 seeds): passkey at N = 1,024 / 4,096 / 16,384 0.46 / 0.30 / 0.57 | 0.15 / 0.07 / 0.45 | 0.08 / 0.02 / 0.37 per seed, means 0.44 / 0.22 / 0.16 against 0.40 / 0.21 / 0.13 after 20k steps; GDN-2 (stock learned decay, same training, 441k parameters, 3 seeds): passkey at N = 1,024 / 4,096 / 8,192 / 16,384 per seed 0.00 / 0.00 / 1.00 | 0.00 / 0.00 / 1.00 | 0.00 / 0.00 / 0.97 | 0.00 / 0.00 / 0.15. Plain SWA with the same training, window (reach in tokens): longest N with mean passkey \u2265 0.9 64 (126): none, 128 (254): 32, 256 (510): 64, 512 (1,022): 128, 1024 (2,046): 256. Window 1024 reaches 2,046 tokens, enough for streams up to N = 512, but holds the passkey only up to N = 256, the longest training stream. So a plain window does not extrapolate in length even inside its reach, whereas the loop with segment 32 and a 126-token attention reach scores 0.58 at N = 1,024 (about 3,840 tokens); the loop with segment 64 and a 126-token attention reach scores 0.44 at N = 1,024 (about 3,840 tokens).  (figures 13, 14, validation curves 15.)", "<b>What these results do not show.</b> The passkey is always the first item and the only long-range one, so a loop that simply holds whatever the first segment said is enough; nothing here tests selecting or replacing content. The noise and 40k-step results are single seeds.", "<b>Seed-to-seed spread is large, so small differences are not conclusions.</b> Segment-32 no tanh: N = 256 passkey 0.00, 0.98, 0.98 across seeds (one seed never started the loop; its training loss stayed at 0.18 against 0.02). Segment-32 tanh: 0.55, 0.57, 0.16. Still training when this page was built: gi0_nlnone_seg8_steps50000_s1 (step 46,000)."], "tested": [{"title": "Main sweep", "tag": "18/18 runs", "ok": true, "body": "Loop type (tanh, no tanh) \u00d7 segment (64, 32, 16) \u00d7 3 seeds, window 64, 2 layers, 20k steps, stream-length curriculum (n32, then n64, n128, n256 every 2,000 steps), no loss re-weighting. Evaluated on the test split up to N = 16,384 (about 61k tokens). Four runs crashed with GPU out-of-memory errors (three in the final evaluation) and were rerun with identical settings."}, {"title": "Extra runs", "tag": "12 runs", "ok": true, "body": "Segment 8 (2 seeds per loop), Gaussian noise (std 0.1 and 0.3) added to the loop vector during training at segment 32, and 40k-step training at segments 64 and 32 (one seed each). They share the recipe and the evaluation of the main sweep."}, {"title": "Token profile", "tag": "probe", "ok": true, "body": "For a few finished models, how many of the 4 passkey tokens are right in each test stream, at N = 256, 1024 and 4096. Separates a memory that decays gradually from one that is either kept or lost. One seed per row."}, {"title": "Recipe exploration", "tag": "8 runs", "ok": true, "body": "12k-step runs that fixed the recipe. The curriculum alone gave AR valid accuracy 0.99 at N = 256; every run that re-weighted the passkey loss was at 0.71 or lower."}, {"title": "Gain-0 comparison", "tag": "24 runs", "ok": true, "body": "The segment comparison again with the loop gain initialised at 0 instead of the recipe's 0.1 (code review H2): segments 64, 32, 16 and 8, tanh and no-tanh loop, 3 seeds, everything else as in the main sweep. The plain-SWA control with the same curriculum is the reference row."}], "results_intro": "All numbers are from the <b>test</b> split (1,000 examples per N), the mean over the seeds that finished; the number of seeds is in brackets when it is not 3. N counts AR writes, one write is about 3.75 tokens, so N = 16,384 is about 61k tokens and, at segment 64, about 960 loop hops. Training: 20k steps on N \u2264 256 with the curriculum unless a row says otherwise. The reference is the plain window (W = 64, 2 layers, no loop, 20k steps with the same curriculum as the loop models, 3 seeds). 'No tanh' means the loop without the tanh only: the RMSNorm in front of the projection and the layer stack between injection and read-out stay, so it is not a linear system. Rows are configurations: the runs whose settings, apart from the seed, are identical; the last figure lists every configuration with its difference to the reference recipe.", "fig1_sub": "Rows: segment length, loop type and extra settings. Columns: stream length N. Darker is higher.", "fig2_sub": "One point per configuration. Ideal is the top-right corner. Blue = tanh, orange = no tanh, hollow = AR valid accuracy below 0.90.", "valid_title": "AR valid accuracy (key written within the last 16 writes)", "stale_title": "AR expired accuracy, stale keys only (last write more than 32 writes ago)", "cap1": "<p><b>Top grid.</b> The plain window is at 0.00 everywhere. Inside the training range (N \u2264 256, left of the dashed line) the loop rows range from 0.18 to 1.00 at N = 256. Beyond it the no-tanh loops fall to 0.01 or less by N = 4096, while the tanh rows keep a non-zero tail: segment 64 reaches 0.14 at N = 16384, and the noise-0.3 row 0.42. Hover a cell for the individual seeds.</p><p><b>Middle grid.</b> AR valid accuracy is flat in N, as for every earlier model, and 0.97 or higher except for: window 64, segment 16 \u00b7 tanh 0.96, window 64, segment 8 \u00b7 tanh (2) 0.27, window 64, segment 8 \u00b7 no tanh (2) 0.50, window 64, segment 32 \u00b7 no tanh \u00b7 noise 0.1 (1) 0.82. These are rows with runs whose training did not converge.</p><p><b>Bottom grid.</b> Stale-key accuracy is at or near 1.00 wherever the AR half was learned.</p>", "cap2": "<p>Each point is one configuration at N = 1,024 and N = 16,384 (mean over seeds). Blue = tanh loop, orange = no-tanh loop, grey = plain window; hollow = AR valid accuracy below 0.90. The target corner is top right. At N = 16,384 only tanh loops are above 0.</p>", "extra_figs": [{"key": "far", "title": "3. Far propagation: the best configuration", "sub": "Window 64, segment 8, no tanh, loop gain 0 at the start; test split unless stated.", "caption": "<p>Mean passkey at N = 1,024 for segments 64 / 32 / 16 / 8, by loop type and initial gain. 0 of the 4 rows rise steadily as the segment shrinks from 64 to 8, 0 fall steadily and 4 are not monotone.</p><div class='tbl '><table><thead><tr><th>loop, gain</th><th>segment 64</th><th>32</th><th>16</th><th>8</th></tr></thead><tbody><tr><td>no tanh, gain 0</td><td>0.23</td><td>0.56</td><td>0.05</td><td>0.73</td></tr><tr><td>no tanh, gain 0.1</td><td>0.23</td><td>0.43</td><td>0.04</td><td>0.09</td></tr><tr><td>tanh, gain 0</td><td>0.40</td><td>0.10</td><td>0.00</td><td>0.00</td></tr><tr><td>tanh, gain 0.1</td><td>0.36</td><td>0.09</td><td>0.05</td><td>0.14</td></tr></tbody></table></div>", "spec": null, "html": "<div class='tbl kv'><table><tbody><tr><th>configuration</th><td>window 64, segment 8, no-tanh loop \u00b7 gain_init 0.1 \u2192 0; trained on N \u2264 256 (about 960 tokens), 20,000 steps</td></tr><tr><th>best seed (0), N = 16,384</th><td>passkey 0.93 on test, 0.93 on validation; AR valid 0.99, AR expired 1.00; about 61,440 tokens and 7,680 loop hops, 488 times the attention reach of 126 tokens</td></tr><tr><th>all seeds, N = 16,384</th><td>passkey 0.93 / 0.01 / 0.72 (seeds 0, 1, 2); AR valid 0.99 / 0.99 / 0.00</td></tr><tr><th>plain window, same curriculum and steps (no loop)</th><td>passkey 0.00 at N = 256 and 0.00 at N = 16,384, below 0.05 from N = 64; AR valid 0.99</td></tr><tr><th>gain-0 runs that learned both halves</th><td>4 of 24 (AR valid above 0.9 at N = 256 and passkey above 0.5 at N = 1,024)</td></tr></tbody></table></div>"}, {"key": "fa p, gain 0, segment 8<br>N = 16,384<br>passkey 0.552 (seeds 0.93, 0.01, 0.72)"}, {"x": 16, "y": 0.0006666666666666666, "lo": 0.0, "hi": 0.002, "tip": "no-tanh loop, gain 0, segment 16<br>N = 16,384<br>passkey 0.001 (seeds 0.00, 0.00, 0.00)"}, {"x": 32, "y": 0.0, "lo": 0.0, "hi": 0.0, "tip": "no-tanh loop, gain 0, segment 32<br>N = 16,384<br>passkey 0.000 (seeds 0.00, 0.00, 0.00)"}, {"x": 64, "y": 0.0, "lo": 0.0, "hi": 0.0, "tip": "no-tanh loop, gain 0, segment 64<br>N = 16,384<br>passkey 0.000 (seeds 0.00, 0.00, 0.00)"}], "width": 2.2, "c": "var(--s2)", "dashed": true}], "xTicks": [8, 16, 32, 64], "x0": 8, "x1": 64, "xLabel": "segment length in tokens (log scale)", "yLabel": "passkey exact match, N = 16,384", "legendLine": true, "rightPad": 92, "aria": "Passkey accuracy at N = 16384 against segment length for two initial loop gains"}}, {"key": "started", "title": "10. Did the loop start? Segment, loop type and initial gain", "sub": "Runs per row: 3 seeds (fewer where a run is missing, one for the gain-0.01 pilot). Loop started = passkey of at least 0.5 at N = 64 on the test split. AR valid, step 2k = AR valid accuracy at N = 256 after 2,000 training steps (validation, mean over the runs of the row).", "caption": "<p>The recipe gain (0.1) started the loop in 22 of 22 runs and gain 0 in 17 of 24: from a zero injection the optimiser has to find the loop, and at small segments often does not. In exchange gain 0 learns the AR half much earlier (column 'AR valid, step 2k'); the recipe gain delays it the more, the smaller the segment. The two gain-0.01 pilot runs behave like gain 0: the loop started at segment 64 and not at segment 16.</p>", "spec": null, "html": "<div class='tbl'><table><thead><tr><th>loop</th><th>segment</th><th>gain</th><th>loop started</th><th>AR valid, step 2k</th><th>passkey N = 256</th><th>N = 1024</th><th>N = 16384</th><th>train loss</th></tr></thead><tbody><tr><td>tanh loop</td><td>64</td><td>gain 0.1</td><td>3 of 3</td><td>0.83</td><td>0.78</td><td>0.36</td><td>0.14</td><td>0.021</td></tr><tr><td>tanh loop</td><td>64</td><td>gain 0.01</td><td>1 of 1</td><td>0.96</td><td>0.96</td><td>0.20</td><td>0.00</td><td>0.017</td></tr><tr><td>tanh loop</td><td>64</td><td>gain 0</td><td>3 of 3</td><td>0.96</td><td>0.85</td><td>0.40</td><td>0.13</td><td>0.020</td></tr><tr><td>tanh loop</td><td>32</td><td>gain 0.1</td><td>3 of 3</td><td>0.34</td><td>0.43</td><td>0.09</td><td>0.02</td><td>0.046</td></tr><tr><td>tanh loop</td><td>32</td><td>gain 0</td><td>3 of 3</td><td>0.82</td><td>0.50</td><td>0.10</td><td>0.05</td><td>0.037</td></tr><tr><td>tanh loop</td><td>16</td><td>gain 0.1</td><td>3 of 3</td><td>0.00</td><td>0.19</td><td>0.05</td><td>0.02</td><td>0.122</td></tr><tr><td>tanh loop</td><td>16</td><td>gain 0.01</td><td>0 of 1</td><td>0.97</td><td>0.00</td><td>0.00</td><td>0.00</td><td>0.261</td></tr><tr><td>tanh loop</td><td>16</td><td>gain 0</td><td>1 of 3</td><td>0.97</td><td>0.26</td><td>0.00</td><td>0.00</td><td>0.188</td></tr><tr><td>tanh loop</td><td>8</td><td>gain 0.1</td><td>2 of 2</td><td>0.00</td><td>0.39</td><td>0.14</td><td>0.03</td><td>1.167</td></tr><tr><td>tanh loop</td><td>8</td><td>gain 0</td><td>0 of 3</td><td>0.98</td><td>0.00</td><td>0.00</td><td>0.00</td><td>0.250</td></tr><tr><td>no-tanh loop</td><td>64</td><td>gain 0.1</td><td>3 of 3</td><td>0.40</td><td>0.96</td><td>0.23</td><td>0.00</td><td>0.017</td></tr><tr><td>no-tanh loop</td><td>64</td><td>gain 0</td><td>3 of 3</td><td>0.96</td><td>0.99</td><td>0.23</td><td>0.00</td><td>0.016</td></tr><tr><td>no-tanh loop</td><td>32</td><td>gain 0.1</td><td>3 of 3</td><td>0.00</td><td>0.65</td><td>0.43</td><td>0.00</td><td>0.074</td></tr><tr><td>no-tanh loop</td><td>32</td><td>gain 0</td><td>3 of 3</td><td>0.57</td><td>0.99</td><td>0.56</td><td>0.00</td><td>0.018</td></tr><tr><td>no-tanh loop</td><td>16</td><td>gain 0.1</td><td>3 of 3</td><td>0.00</td><td>0.88</td><td>0.04</td><td>0.00</td><td>0.022</td></tr><tr><td>no-tanh loop</td><td>16</td><td>gain 0</td><td>1 of 3</td><td>0.62</td><td>0.33</td><td>0.05</td><td>0.00</td><td>0.184</td></tr><tr><td>no-tanh loop</td><td>8</td><td>gain 0.1</td><td>2 of 2</td><td>0.00</td><td>1.00</td><td>0.09</td><td>0.00</td><td>0.779</td></tr><tr><td>no-tanh loop</td><td>8</td><td>gain 0</td><td>3 of 3</td><td>0.48</td><td>1.00</td><td>0.73</td><td>0.55</td><td>0.512</td></tr></tbody></table></div>"}, {"key": "attractor", "title": "11. Is the loop an attractor? Perturbation, contraction and Jacobian of the loop vector", "sub": "Fresh streams of N = 4,096 writes (100 for the exact match, 16 for the contraction, 4 \u00d7 3 positions for the Jacobian). m is perturbed at 25% of the stream, in all layers at once, by Gaussian noise of the given multiple of its own RMS.", "caption": "<p>In the 4 probed runs that hold the passkey at N = 4,096 (window 64, segment 8 \u00b7 no tanh \u00b7 gain 0 \u00b7 seed 0, window 64, segment 8 \u00b7 no tanh \u00b7 gain 0 \u00b7 seed 2, window 64, segment 32 \u00b7 tanh \u00b7 noise 0.3 \u00b7 seed 0, window 64, segment 64 \u00b7 tanh \u00b7 seed 2) a perturbation of 0.3 times the RMS of m leaves at least 91% of the clean exact match and one of 1.0 times the RMS at least 56%; the difference to the clean run shrinks to 1.2% of its start within 64 hops at most, and the one-hop Jacobian has a spectral radius of 0.16 to 0.97. Contraction alone is not retention: the 4 probed runs that lose the passkey (clean exact match below 0.05) have spectral radii of 0.12 to 1.39, and the largest one belongs to a no-tanh loop whose state is large and keeps drifting.</p><p>Two caveats. The Jacobian is the one-hop response of m with the layer inputs of the window held fixed, so it does not include what the 63-token window itself holds, and it is computed in bf16. The rows are single runs chosen as contrasts, not a sample.</p>", "spec": null, "html": "<div class='tbl'><table><thead><tr><th>run</th><th>exact, clean</th><th>\u00d70.1</th><th>\u00d70.3</th><th>\u00d71</th><th>\u00d73</th><th>diff after 1 hop</th><th>16 hops</th><th>64 hops</th><th>\u03c3 max</th><th>spectral radius</th><th>RMS of m</th></tr></thead><tbody><tr><td>window 64, segment 8 \u00b7 no tanh \u00b7 gain 0 \u00b7 seed 0</td><td>0.97</td><td>0.97</td><td>0.97</td><td>0.84</td><td>0.54</td><td>0.088</td><td>0.023</td><td>0.012</td><td>3.24</td><td>0.33</td><td>0.72</td></tr><tr><td>window 64, segment 8 \u00b7 no tanh \u00b7 gain 0 \u00b7 seed 2</td><td>0.76</td><td>0.76</td><td>0.76</td><td>0.76</td><td>0.63</td><td>0.106</td><td>0.017</td><td>0.007</td><td>1.11</td><td>0.48</td><td>1.26</td></tr><tr><td>window 64, segment 32 \u00b7 tanh \u00b7 noise 0.3 \u00b7 seed 0</td><td>0.44</td><td>0.44</td><td>0.43</td><td>0.35</td><td>0.01</td><td>0.154</td><td>0.019</td><td>0.005</td><td>1.75</td><td>0.97</td><td>0.63</td></tr><tr><td>window 64, segment 64 \u00b7 tanh \u00b7 seed 2</td><td>0.32</td><td>0.32</td><td>0.29</td><td>0.18</td><td>0.10</td><td>0.116</td><td>0.099</td><td>0.005</td><td>2.38</td><td>0.16</td><td>0.44</td></tr><tr><td>window 64, segment 32 \u00b7 no tanh \u00b7 noise 0.3 \u00b7 seed 0</td><td>0.00</td><td>0.00</td><td>0.00</td><td>0.01</td><td>0.00</td><td>0.344</td><td>0.120</td><td>0.115</td><td>1.73</td><td>1.39</td><td>3.96</td></tr><tr><td>window 64, segment 32 \u00b7 tanh \u00b7 seed 0</td><td>0.00</td><td>0.00</td><td>0.00</td><td>0.00</td><td>0.00</td><td>0.070</td><td>0.015</td><td>0.011</td><td>2.70</td><td>0.19</td><td>0.63</td></tr><tr><td>window 64, segment 64 \u00b7 no tanh \u00b7 seed 0</td><td>0.00</td><td>0.00</td><td>0.00</td><td>0.00</td><td>0.00</td><td>0.276</td><td>0.255</td><td>0.215</td><td>1.41</td><td>0.61</td><td>4.75</td></tr><tr><td>window 64, segment 8 \u00b7 no tanh \u00b7 gain 0 \u00b7 seed 1</td><td>0.00</td><td>0.00</td><td>0.00</td><td>0.00</td><td>0.00</td><td>0.043</td><td>0.013</td><td>0.009</td><td>1.59</td><td>0.12</td><td>1.72</td></tr></tbody></table></div>"}, {"key": "explore", "title": "12. How the training recipe was chosen: the 12k-step exploration", "sub": "8 runs, window 64, segment 64, seed 0, validation split.", "caption": "<p>The curriculum alone is the only recipe that learns the AR half and the passkey together; every run that up-weighted the passkey loss paid with AR accuracy. This is what the main sweep's recipe is based on.</p>", "spec": null, "html": "<div class='tbl'><table><thead><tr><th>recipe</th><th>loop</th><th>AR valid, N = 256</th><th>passkey, N = 256</th><th>passkey, N = 1024</th></tr></thead><tbody><tr><td>curriculum, no re-weighting</td><td>tanh</td><td>0.99</td><td>0.73</td><td>0.26</td></tr><tr><td>curriculum, no re-weighting</td><td>no tanh</td><td>0.99</td><td>0.96</td><td>0.14</td></tr><tr><td>curriculum, passkey weight 100 \u2192 1 over 4k steps</td><td>tanh</td><td>0.71</td><td>0.58</td><td>0.35</td></tr><tr><td>curriculum, passkey weight 100 \u2192 1 over 4k steps</td><td>no tanh</td><td>0.15</td><td>0.88</td><td>0.05</td></tr><tr><td>no curriculum, passkey weight 100 \u2192 1 over 4k steps</td><td>tanh</td><td>0.15</td><td>0.28</td><td>0.25</td></tr><tr><td>no curriculum, passkey weight 100 \u2192 1 over 4k steps</td><td>no tanh</td><td>0.00</td><td>0.92</td><td>0.14</td></tr><tr><td>no curriculum, passkey weight 100 \u2192 1 over 8k steps</td><td>tanh</td><td>0.00</td><td>0.34</td><td>0.34</td></tr><tr><td>no curriculum, passkey weight 100 \u2192 1 over 8k steps</td><td>no tanh</td><td>0.06</td><td>0.95</td><td>0.35</td></tr></tbody></table></div>"}, {"key": "long", "title": "13. 50k-step runs against plain windows, passkey against stream length", "sub": "Test split, mean over seeds with the seed range as bars. Dashed = the 20k-step runs of the same setup. Grey ramp = plain sliding-window attention with the same curriculum, 50k steps and 2 layers, at windows 64 / 128 / 256 / 512 / 1,024.", "caption": "<p>A plain window of W tokens reaches 2(W\u22121) tokens back, so it can hold the passkey while the stream is shorter than that. The 50k-st const NS = DATA.ns, ROWS = DATA.rows;
const fmt2 = v => (v == null ? '–' : v.toFixed(2));
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cell = (rk, n) => (DATA.results[rk] || {})[String(n)];
const perTxt = (r, key) => (r && r.per && r.per[key] ? 'seeds: ' + r.per[key].map(v => v == null ? '–' : v.toFixed(2)).join(' / ') : '');

// ---- colour helpers (tokens are read from CSS so both themes work)
function hex2rgb(h) { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); }
function mix(c1, c2, t) { return c1.map((v, i) => Math.round(v + (c2[i] - v) * t)); }
function seqColor(v) {
  const stops = [0, 1, 2, 3, 4].map(i => hex2rgb(cssv('--seq' + i)));
  const x = Math.max(0, Math.min(1, v)) * 4, i = Math.min(3, Math.floor(x));
  return mix(stops[i], stops[i + 1], x - i);
}
const lum = c => { const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }; return .2126 * f(c[0]) + .7152 * f(c[1]) + .0722 * f(c[2]); };
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
// ordinal colour for item i of n: i = 0 is the darkest (light mode) / lightest (dark mode)
const ordColor = (i, n) => { const s = [0, 1, 2, 3].map(k => hex2rgb(cssv('--ord' + k))); const j = n - 1 - i; const x = n === 1 ? 3 : j / (n - 1) * 3, k = Math.min(2, Math.floor(x)); return rgb(mix(s[k], s[k + 1], x - k)); };
const rowColor = i => (ROWS[i].color ? cssv(ROWS[i].color) : ordColor(i, ROWS.length));  // a row may name its own colour token
// series colour: explicit css colour, or an ordinal slot [i, n], or its position in the list
const serCol = (sr, i, spec) => sr.c || (sr.ord ? ordColor(sr.ord[0], sr.ord[1]) : ordColor(spec.ordReverse ? spec.series.length - 1 - i : i, spec.series.length));

// ---- tooltip
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { tip.style.display = 'none'; return; }
  tip.innerHTML = t.getAttribute('data-tip');
  tip.style.display = 'block';
  const w = tip.offsetWidth, x = Math.min(e.clientX + 14, window.innerWidth - w - 8);
  tip.style.left = Math.max(8, x) + 'px';
  tip.style.top = Math.min(e.clientY + 16, window.innerHeight - tip.offsetHeight - 8) + 'px';
});

// ---- figure 1: heatmaps (rows = configurations, columns = N)
function heatmap(host, key, title, extra) {
  const lw = DATA.label_w || 58, W = 760, left = lw, top = 54, right = 8, ch = 28, cw = (W - left - right) / NS.length;
  const H = top + ROWS.length * ch + 24, trainCols = NS.filter(n => n <= 256).length;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} by configuration and N">`;
  s += `<text x="0" y="13" style="fill:var(--ink);font-family:var(--sans);font-size:13px;font-weight:600">${esc(title)}</text>`;
  s += `<line x1="${left}" x2="${left + trainCols * cw - 4}" y1="34" y2="34" stroke="var(--axis)" stroke-width="1"/>`;
  s += `<text x="${left}" y="28" font-size="10">trained on N ≤ 256</text>`;
  s += `<text x="${left + trainCols * cw + 2}" y="28" font-size="10">${NS.length - trainCols >= 3 ? 'evaluation only, longer than training' : 'beyond training'}</text>`;
  NS.forEach((n, j) => { s += `<text x="${left + j * cw + cw / 2}" y="${top - 6}" font-size="10.5" text-anchor="middle">${n}</text>`; });
  ROWS.forEach((row, i) => {
    s += `<text x="${left - 8}" y="${top + i * ch + ch / 2 + 4}" font-size="11" text-anchor="end" style="fill:var(--ink)">${esc(row.label)}</text>`;
    NS.forEach((n, j) => {
      const r = cell(row.key, n), v = r ? r[key] : null, x = left + j * cw, y = top + i * ch;
      let fill, txt, tcol;
      if (v == null) { fill = cssv('--nodata'); txt = '–'; tcol = cssv('--muted'); }
      else { const c = seqColor(v); fill = rgb(c); txt = v >= .995 ? '1.00' : v.toFixed(2); tcol = lum(c) > .32 ? '#0b0b0b' : '#ffffff'; }
      const tipTxt = `${esc(row.long || row.label)}, N = ${n.toLocaleString()} (~${Math.round(n * 3.75 / 1000)}k tokens)<br>${esc(title)}: ${v == null ? 'no such queries' : v.toFixed(3)}${v != null && r ? '<br>' + perTxt(r, key) : ''}${extra && r && v != null ? '<br>' + extra(r) : ''}`;
      s += `<rect x="${x + 1}" y="${y + 1}" width="${cw - 2}" height="${ch - 2}" rx="2" fill="${fill}" data-tip="${esc(tipTxt)}"/>`;
      s += `<text x="${x + cw / 2}" y="${y + ch / 2 + 4}" font-size="10.5" text-anchor="middle" style="fill:${tcol};pointer-events:none">${txt}</text>`;
    });
  });
  s += `<line x1="${left + trainCols * cw - 1}" x2="${left + trainCols * cw - 1}" y1="${top - 2}" y2="${top + ROWS.length * ch}" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="3 3"/>`;
  host.innerHTML = s + '</svg>';
}

// ---- figure 2: scatter panels (one point per configuration, faint dots = seeds)
function scatter(host, n) {
  const S = 250, m = { l: 40, r: 12, t: 24, b: 38 }, iw = S - m.l - m.r, ih = S - m.t - m.b;
  const X = v => m.l + v * iw, Y = v => m.t + (1 - v) * ih;
  let s = `<svg viewBox="0 0 ${S} ${S}" role="img" aria-label="Passkey vs expired accuracy at N=${n}">`;
  s += `<text x="${m.l}" y="14" style="fill:var(--ink);font-family:var(--sans);font-size:13.5px;font-weight:600">N = ${n.toLocaleString()} writes</text>`;
  [0, .25, .5, .75, 1].forEach(t => {
    s += `<line x1="${m.l}" x2="${m.l + iw}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)" stroke-width=".8"/>`;
    s += `<line y1="${m.t}" y2="${m.t + ih}" x1="${X(t)}" x2="${X(t)}" stroke="var(--grid)" stroke-width=".8"/>`;
    s += `<text x="${m.l - 5}" y="${Y(t) + 3.5}" font-size="10.5" text-anchor="end">${Math.round(t * 100)}</text>`;
    s += `<text x="${X(t)}" y="${m.t + ih + 14}" font-size="10.5" text-anchor="middle">${Math.round(t * 100)}</text>`;
  });
  s += `<text x="${m.l + iw / 2}" y="${S - 6}" font-size="11" text-anchor="middle">expired-query accuracy, %</text>`;
  s += `<text transform="translate(10 ${m.t + ih / 2}) rotate(-90)" font-size="11" text-anchor="middle">passkey exact match, %</text>`;
  const groups = {};
  ROWS.forEach((row, i) => { const r = cell(row.key, n); if (!r) return; const k = r.expired.toFixed(2) + '|' + r.passkey.toFixed(2); (groups[k] = groups[k] || []).push({ row, i, r }); });
  Object.values(groups).forEach(g => {
    const r = g[0].r, cx = X(r.expired), cy = Y(r.passkey);
    const tipTxt = g.map(o => `${esc(o.row.long || o.row.label)}: passkey ${o.r.passkey.toFixed(3)}, expired ${o.r.expired.toFixed(3)}, valid ${o.r.valid.toFixed(3)}`).join('<br>');
    g.forEach(o => { if (o.r.per && o.r.per.passkey) o.r.per.passkey.forEach((pk, k) => { const ex = o.r.per.expired[k]; if (pk != null && ex != null) s += `<circle cx="${X(ex)}" cy="${Y(pk)}" r="2.6" fill="${rowColor(o.i)}" opacity=".4"/>`; }); });
    [...g].reverse().forEach(o => {  // drawn from the last row to the first so row 0 ends up on top
      const hollow = o.r.valid < .9;
      s += `<circle cx="${cx}" cy="${cy}" r="6" fill="${hollow ? 'var(--surface)' : rowColor(o.i)}" stroke="${hollow ? rowColor(o.i) : 'var(--surface)'}" stroke-width="${hollow ? 2 : 1.6}" data-tip="${esc(tipTxt)}"/>`;
    });
    const names = g.filter(o => !o.row.nolabel).map(o => o.row.slabel || o.row.label);  // rows may opt out of a label (identified by colour and tooltip)
    if (!names.length) return;
    const label = (DATA.row_prefix || '') + (names.length > 3 ? names[0] + ' … ' + names[names.length - 1] + ' (' + names.length + ')' : names.join(', '));
    const onRight = cx > m.l + iw * .55, lx = onRight ? cx - 10 : cx + 10;
    const ly = cy + (r.passkey > .5 ? 14 : -9);
    s += `<text x="${lx}" y="${ly}" font-size="10.5" class="endlabel" text-anchor="${onRight ? 'end' : 'start'}" style="fill:var(--ink)">${esc(label)}</text>`;
  });
  host.insertAdjacentHTML('beforeend', `<div>${s}</svg></div>`);
}

// ---- generic line chart: spec = { xTicks, x0, x1, xLog, xLabel, yLabel, yMax, series[], vlines[], note }
// series: { label, short, c (css colour, optional), width, dashed, points: [{x, y, lo, hi, tip}] }
function lineChart(host, legendHost, spec) {
  const W = 760, H = spec.height || 340, m = { l: 52, r: spec.rightPad || 132, t: 14, b: 44 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const tr = v => spec.xLog === false ? v : Math.log2(v);
  const y0 = spec.yMin || 0, y1 = spec.yMax || 1;
  const X = v => m.l + (tr(v) - tr(spec.x0)) / (tr(spec.x1) - tr(spec.x0)) * iw, Y = v => m.t + (1 - (v - y0) / (y1 - y0)) * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.aria || 'line chart')}">`;
  [0, .25, .5, .75, 1].forEach(t => {
    const v = y0 + t * (y1 - y0);
    s += `<line x1="${m.l}" x2="${m.l + iw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width=".8"/>`;
    s += `<text x="${m.l - 8}" y="${Y(v) + 3.5}" font-size="10.5" text-anchor="end">${(v * 100).toFixed(y1 - y0 < .5 ? 1 : 0)}%</text>`;
  });
  spec.xTicks.forEach(x => {
    s += `<line x1="${X(x)}" x2="${X(x)}" y1="${m.t + ih}" y2="${m.t + ih + 4}" stroke="var(--axis)"/>`;
    s += `<text x="${X(x)}" y="${m.t + ih + 17}" font-size="10.5" text-anchor="middle">${x}</text>`;
  });
  s += `<line x1="${m.l}" x2="${m.l + iw}" y1="${m.t + ih}" y2="${m.t + ih}" stroke="var(--axis)"/>`;
  s += `<text x="${m.l + iw / 2}" y="${H - 8}" font-size="11" text-anchor="middle">${esc(spec.xLabel)}</text>`;
  s += `<text transform="translate(13 ${m.t + ih / 2}) rotate(-90)" font-size="11" text-anchor="middle">${esc(spec.yLabel)}</text>`;
  (spec.vlines || []).forEach(v => {
    s += `<line x1="${X(v.x)}" x2="${X(v.x)}" y1="${m.t}" y2="${m.t + ih}" stroke="var(--ink-2)" stroke-dasharray="3 3" stroke-width=".8"/>`;
    if (v.label) s += `<text x="${X(v.x) + 4}" y="${m.t + 10 + (v.dy || 0)}" font-size="9.5">${esc(v.label)}</text>`;
  });
  if (spec.note) s += `<text x="${m.l + 8}" y="${m.t + ih - 10}" font-size="10">${esc(spec.note)}</text>`;
  const ends = [];
  spec.series.forEach((sr, i) => {
    const col = serCol(sr, i, spec), pts = sr.points.filter(p => p.y != null);
    s += `<polyline fill="none" style="stroke:${col}" stroke-width="${sr.width || 2}" ${sr.dashed ? 'stroke-dasharray="6 4"' : ''} points="${pts.map(p => X(p.x) + ',' + Y(p.y)).join(' ')}"/>`;
    pts.forEach(p => {
      if (p.lo != null && p.hi != null && p.hi - p.lo > 1e-6) s += `<line x1="${X(p.x)}" x2="${X(p.x)}" y1="${Y(p.lo)}" y2="${Y(p.hi)}" style="stroke:${col}" stroke-width="1.4" opacity=".6"/>`;
      if (sr.noDots) return;
      const t = p.tip || `${sr.label}<br>${esc(spec.xLabel)}: ${p.x}<br>${esc(spec.yLabel)}: ${p.y.toFixed(3)}`;
      s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${sr.dashed ? 3.5 : 5}" style="fill:${sr.dashed ? 'var(--surface)' : col};stroke:${sr.dashed ? col : 'var(--surface)'}" stroke-width="1.6" data-tip="${esc(t)}"/>`;
    });
    if (sr.short && pts.length) { const last = pts[pts.length - 1]; ends.push({ x: X(last.x), py: Y(last.y), y: Y(last.y), text: sr.short }); }
  });
  // spread the end labels so they never touch each other or the axis
  const gap = 15, ymax = m.t + ih - 12;
  ends.sort((a, b) => a.y - b.y);
  for (let k = 1; k < ends.length; k++) ends[k].y = Math.max(ends[k].y, ends[k - 1].y + gap);
  if (ends.length && ends[ends.length - 1].y > ymax) { ends[ends.length - 1].y = ymax; for (let k = ends.length - 2; k >= 0; k--) ends[k].y = Math.min(ends[k].y, ends[k + 1].y - gap); }
  ends.forEach(e => {
    if (Math.abs(e.y - e.py) > 3) s += `<line x1="${e.x + 6}" y1="${e.py}" x2="${e.x + 12}" y2="${e.y}" stroke="var(--muted)" stroke-width=".8"/>`;
    s += `<text x="${e.x + 14}" y="${e.y + 4}" font-size="10.5" class="endlabel" style="fill:var(--ink)">${esc(e.text)}</text>`;
  });
  host.innerHTML = s + '</svg>';
  legendHost.innerHTML = spec.series.map((sr, i) => `<span><i class="${sr.dashed ? 'dash' : (spec.legendLine ? 'line' : '')}" style="${sr.dashed || spec.legendLine ? 'border-color' : 'background'}:${serCol(sr, i, spec)}"></i>${esc(sr.label)}</span>`).join('');
}

function table(cols, rows) {
  return `<table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function renderCharts() {
  heatmap($('#hm-passkey'), 'passkey', 'Passkey exact match', r => `${r.n_examples} examples per seed`);
  heatmap($('#hm-valid'), 'valid', DATA.valid_title, r => `${r.n_valid.toLocaleString()} queries per seed`);
  heatmap($('#hm-stale'), 'stale', DATA.stale_title, r => `${r.n_stale.toLocaleString()} queries per seed`);
  if (!DATA.hide_scatter) { $('#scatter').innerHTML = ''; DATA.scatter_ns.forEach(n => scatter($('#scatter'), n)); }
  DATA.extra_figs.forEach((f, i) => { if (f.spec) lineChart($('#ch-' + i), $('#lg-' + i), f.spec); });  // a figure may carry html instead of a line chart
}

function fillText() {
  $('#meta').innerHTML = DATA.meta;
  $('#tldr').innerHTML = DATA.tldr.map(t => `<li>${t}</li>`).join('');
  $('#intro').innerHTML = DATA.intro || '';  // optional block between the summary and the cards (a method description with its own figures)
  $('#tested-h').textContent = DATA.tested_title || 'What was tested'; $('#results-h').textContent = DATA.results_title || 'Results'; $('#next-h').textContent = DATA.next_title || 'What is next';
  if (DATA.fig1_title) $('#fig1-title').textContent = DATA.fig1_title;
  if (DATA.hide_scatter) $('#fig2-fig').remove();
  $('#tested').innerHTML = DATA.tested.map(c => `<div class="card"><h3>${c.title} <span class="tag ${c.ok ? 'ok' : ''}">${esc(c.tag)}</span></h3><p>${c.body}</p></div>`).join('');
  if (!DATA.tested.length) { $('#tested-h').remove(); $('#tested').remove(); }
  $('#results-intro').innerHTML = DATA.results_intro;
  $('#fig1-sub').innerHTML = DATA.fig1_sub;
  $('#cap1').innerHTML = DATA.cap1;
  if (!DATA.hide_scatter) { $('#fig2-sub').innerHTML = DATA.fig2_sub; $('#cap2').innerHTML = DATA.cap2; }
  $('#next').innerHTML = DATA.next;
  const rows = [];
  ROWS.forEach(row => NS.forEach(n => { const r = cell(row.key, n); if (r) rows.push([row.label, n, fmt2(r.passkey), fmt2(r.valid), fmt2(r.stale), fmt2(r.expired), r.n_stale]); }));
  $('#tbl1').innerHTML = table([DATA.row_name, 'N', 'passkey', 'ar_valid', 'expired (stale)', 'expired (all)', '# stale queries per seed'], rows);
  if (!DATA.hide_scatter) {
    const rows2 = [];
    DATA.scatter_ns.forEach(n => ROWS.forEach(row => { const r = cell(row.key, n); if (r) rows2.push([n, row.label, fmt2(r.expired), fmt2(r.passkey), fmt2(r.valid)]); }));
    $('#tbl2').innerHTML = table(['N', DATA.row_name, 'expired acc', 'passkey', 'ar_valid'], rows2);
  }
  $('#extra-figs').innerHTML = DATA.extra_figs.map((f, i) => `
    <figure>
      <div class="fig-title">${f.title}</div>
      <p class="fig-sub">${f.sub}</p>
      ${f.spec ? `<div class="legend" id="lg-${i}"></div><div class="chart" id="ch-${i}"></div>` : ''}${f.html || ''}
      <figcaption>${f.caption}</figcaption>
      ${f.spec ? `<details><summary>Table view</summary><div class="tbl" id="tb-${i}"></div></details>` : ''}
    </figure>`).join('');
  DATA.extra_figs.forEach((f, i) => {
    if (!f.spec) return;
    const rws = []; f.spec.series.forEach(sr => sr.points.forEach(p => rws.push([sr.label, p.x, p.y == null ? '–' : p.y.toFixed(3), p.lo != null ? `${p.lo.toFixed(3)} to ${p.hi.toFixed(3)}` : ''])));
    $('#tb-' + i).innerHTML = table(['series', f.spec.xLabel, f.spec.yLabel, 'range over seeds'], rws);
  });
}
fillText();
renderCharts();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderCharts);
new MutationObserver(renderCharts).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
</script>
