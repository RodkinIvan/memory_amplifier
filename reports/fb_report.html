body { background: var(--page); color: var(--ink); font: 15px/1.6 var(--sans); margin: 0; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }

.meta { color: var(--ink-2); font-size: .9rem; margin: 0 0 22px; }

.summary { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; }

.summary li { max-width: 78ch; }

figure { margin: 18px 0 0; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 14px 10px; }
figcaption { color: var(--ink-2); font-size: .92rem; margin-top: 8px; }
figcaption p { max-width: 82ch; }
.fig-title { font-weight: 600; font-size: .98rem; }
.fig-sub { color: var(--ink-2); font-size: .86rem; margin: 0 0 8px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { font-family: var(--mono); fill: var(--ink-2); }
.chart text.endlabel { paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.hm-scroll { overflow-x: auto; }
.hm-scroll svg { min-width: 640px; }
.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }

.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.legend i.line { width: 18px; height: 0; border-radius: 0; border-top: 2px solid; vertical-align: 3px; }
.legend i.dash { width: 18px; height: 0; border-radius: 0; border-top: 2px dashed; vertical-align: 3px; }
.pbar { display: grid; grid-template-columns: minmax(150px, 290px) minmax(0, 1fr); gap: 2px 12px; align-items: center; margin: 5px 0; font-size: .8rem; color: var(--ink-2); }
.pbar .stack { display: flex; height: 22px; border-radius: 3px; overflow: hidden; border: 1px solid var(--border); }
.pbar .stack i { display: block; min-width: 0; font: 10.5px/22px var(--mono); text-align: center; font-style: normal; overflow: hidden; }
details { margin-top: 8px; font-size: .86rem; }
summary { cursor: pointer; color: var(--ink-2); }
summary:focus-visible, a:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.tbl { overflow-x: auto; margin-top: 6px; }
table { border-collapse: collapse; font-family: var(--mono); font-size: .8rem; font-variant-numeric: tabular-nums; }
th, td { padding: 3px 9px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }

.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-top: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; min-width: 0; }

(N = 256, linear loop, segment 64 / 32 / 16 / 8: 0.96 / 0.49 / 0.86 / 1.00) but do no better beyond it. Training also becomes less reliable: runs whose training loss stayed above 0.1 (segment 64: 0 of 5, segment 32: 1 of 5, segment 16: 1 of 4, segment 8: 3 of 4); at segment 8, 3 of 4 runs did not learn the AR half (valid accuracy below 0.6). The comparison is also handicapped by a slow start: the AR half is learned later the smaller the segment (AR valid accuracy at N = 256, mean over runs: segment 64: 0.62 at step 2,000 and 0.94 at step 6,000, segment 32: 0.17 at step 2,000 and 0.96 at step 6,000, segment 16: 0.00 at step 2,000 and 0.54 at step 6,000), so small segments spend less of the 20k steps on long streams. A rerun with the loop gain initialised at 0 would remove this confound.", "<b>The tanh loop keeps a floor, the linear loop does not.</b> Linear loops fit the training range better and are at 0.01 or less by N = 4096 in every configuration. The segment-64 tanh loop holds 0.20 / 0.15 / 0.15 at N = 4096 / 8192 / 16384 (about 960 loop hops at the end), a constant instead of a decay. GDN \u03b1 = 1 (3 seeds) is better in range: 1.00 at N = 512, 0.97 at 1024, 0.53 at 2048, then 0.09 at 4096 and 0.00 at 16384; the models are not size-matched: 441k parameters, 1 head, fp32 for GDN against 563k, 4 heads, bf16 for the loop models. The loop does not beat GDN \u03b1 = 1 where GDN works (N \u2264 2048), but at N = 16384 GDN is at zero and the tanh loop is not.", "<b>Noise during training made the retention all-or-nothing</b> (one seed). For the segment-32 tanh loop with noise 0.3, 43% of the streams at N = 4096 keep all four passkey tokens, 35% keep none and only 22% keep some. The segment-64 tanh loop (seed 2) at the same N has 26% with all four, 1% with none and 74% with some: a graded loss, as for the linear loop at N = 1024, where the four tokens are right 94% / 86% / 72% / 48% of the time, later tokens first. An intact-or-gone passkey is what error-correcting (attractor) dynamics would produce. Noise 0.1 does not help (0.00 at N = 4096).", "<b>Twice the training helps a little and changes no horizon</b> (one seed each). At N = 1024: segment-64 tanh 0.49 (20k steps: 0.36), segment-32 linear 0.54 (0.32); the linear loops are still at 0 by N = 4096.", "<b>What these results do not show.</b> The passkey is always the first item and the only long-range one, so a loop that simply holds whatever the first segment said is enough; nothing here tests selecting or replacing content. The AR accuracy of the loop models is compared with a plain window trained differently (30k steps, no curriculum); the passkey comparison is unaffected, since a plain window cannot reach that far. The noise and 40k-step results are single seeds.", "<b>Seed-to-seed spread is large, so small differences are not conclusions.</b> Segment-32 linear: N = 256 passkey 0.00, 0.98 across seeds (one seed never started the loop; its training loss stayed at 0.18 against 0.02). Segment-32 tanh: 0.55, 0.57, 0.16. 4 of the 18 main-grid runs failed with a GPU out-of-memory error and are being rerun; seeds per row are shown in brackets: nlnone_seg16_s0 (step 4,000), nltanh_seg16_s0 (step 4,000), nlnone_seg32_s1 (step 8,000), nltanh_seg64_s0 (step 12,000)."], "tested": [{"title": "Main sweep", "tag": "14/18 runs", "ok": false, "body": "Loop type (tanh, linear) \u00d7 segment (64, 32, 16) \u00d7 3 seeds, window 64, 2 layers, 20k steps, stream-length curriculum (n32, then n64, n128, n256 every 2,000 steps), no loss re-weighting. Evaluated on the test split up to N = 16,384 (about 61k tokens)."}, {"title": "Extra runs", "tag": "12 runs", "ok": true, "body": "Segment 8 (2 seeds per loop), Gaussian noise (std 0.1 and 0.3) added to the loop vector during training at segment 32, and 40k-step training at segments 64 and 32 (one seed each). They share the recipe and the evaluation of the main sweep."}, {"title": "Token profile", "tag": "probe", "ok": true, "body": "For a few finished models, how many of the 4 passkey tokens are right in each test stream, at N = 256, 1024 and 4096. Separates a memory that decays gradually from one that is either kept or lost. One seed per row."}, {"title": "Recipe exploration", "tag": "8 runs", "ok": true, "body": "12k-step runs that fixed the recipe. The curriculum alone gave AR valid accuracy 0.99 at N = 256; every run that re-weighted the passkey loss was at 0.71 or lower."}], "results_intro": "All numbers are from the <b>test</b> split (1,000 examples per N), the mean over the seeds that finished; the number of seeds is in brackets when it is not 3. N counts AR writes, one write is about 3.75 tokens, so N = 16,384 is about 61k tokens and, at segment 64, about 960 loop hops. Training: 20k steps on N \u2264 256 with the curriculum unless a row says otherwise. The reference is the plain window (W = 64, 2 layers, no loop, 30k steps, 3 seeds).", "fig1_sub": "Rows: segment length, loop type and extra settings. Columns: stream length N. Darker is higher.", "fig2_sub": "One point per configuration. Ideal is the top-right corner. Blue = tanh, orange = linear, hollow = AR valid accuracy below 0.90.", "valid_title": "AR valid accuracy (key written within the last 16 writes)", "stale_title": "AR expired accuracy, stale keys only (last write more than 32 writes ago)", "cap1": "<p><b>Top grid.</b> The plain window is at 0.00 everywhere. Inside the training range (N \u2264 256, left of the dashed line) the loop rows range from 0.18 to 1.00 at N = 256. Beyond it the linear loops fall to 0.01 or less by N = 4096, while the tanh rows keep a non-zero tail: segment 64 reaches 0.15 at N = 16384, and the noise-0.3 row 0.42. Hover a cell for the individual seeds.</p><p><b>Middle grid.</b> AR valid accuracy is flat in N, as for every earlier model, and 0.97 or higher except for: seg 16 \u00b7 tanh (2) 0.95, seg 8 \u00b7 tanh (2) 0.27, seg 8 \u00b7 linear (2) 0.50, seg 32 \u00b7 linear \u00b7 noise 0.1 (1) 0.82. These are rows with runs whose training did not converge.</p><p><b>Bottom grid.</b> Stale-key accuracy is at or near 1.00 wherever the AR half was learned.</p>", "cap2": "<p>Each point is one configuration at N = 1,024 and N = 16,384 (mean over seeds). Blue = tanh loop, orange = linear loop, grey = plain window; hollow = AR valid accuracy below 0.90. The target corner is top right. At N = 16,384 only tanh loops are above 0.</p>", "extra_figs": [{"title": "3. Passkey against stream length, tanh loops", "sub": "Mean over seeds with the seed range as bars; the single-seed extras are drawn thicker. The dotted line marks the longest training stream (N = 256).", "caption": "<p>Tanh loops start lower than linear ones but decay slowly and level off. Segment 64 is at 0.15 at N = 8192 and 0.15 at N = 16,384. With noise 0.3 during training, segment 32 holds 0.43 / 0.42 at N = 4096 / 16,384 (one seed). The other segments (main grid) stay at or below 0.09 from N = 2048 on.</p>", "spec": {"series": [{"label": "segment 64 (2 seeds)", "short": "seg 64", "ord": [0, 4], "points": [{"x": 32, "y": 0.9955, "lo": 0.991, "hi": 1.0, "tip": "segment 64 (2 seeds)<br>N = 32 (~2 loop hops)<br>passkey 0.996 (seeds 1.00, 0.99)"}, {"x": 64, "y": 0.992, "lo": 0.984, "hi": 1.0, "tip": "segment 64 (2 seeds)<br>N = 64 (~4 loop hops)<br>passkey 0.992 (seeds 1.00, 0.98)"}, {"x": 128, "y": 0.9415, "lo": 0.915, "hi": 0.968, "tip": "segment 64 (2 seeds)<br>N = 128 (~8 loop hops)<br>passkey 0.942 (seeds 0.97, 0.92)"}, {"x": 256, "y": 0.767, "lo": 0.767, "hi": 0.767, "tip": "segment 64 (2 seeds)<br>N = 256 (~15 loop hops)<br>passkey 0.767 (seeds 0.77, 0.77)"}, {"x": 512, "y": 0.5345, "lo": 0.524, "hi": 0.545, "tip": "segment 64 (2 seeds)<br>N = 512 (~30 loop hops)<br>passkey 0.534 (seeds 0.52, 0.55)"}, {"x": 1024, "y": 0.35650000000000004, "lo": 0.311, "hi": 0.402, "tip": "segment 64 (2 seeds)<br>N = 1,024 (~60 loop hops)<br>passkey 0.357 (seeds 0.31, 0.40)"}, {"x": 2048, "y": 0.2425, "lo": 0.179, "hi": 0.306, "tip": "segment // series: { label, short, c (css colour, optional), width, dashed, points: [{x, y, lo, hi, tip}] }
function lineChart(host, legendHost, spec) {
  const W = 760, H = spec.height || 340, m = { l: 52, r: spec.rightPad || 132, t: 14, b: 44 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const tr = v => spec.xLog === false ? v : Math.log2(v);
  const y0 = spec.yMin || 0, y1 = spec.yMax || 1;
  const X = v => m.l + (tr(v) - tr(spec.x0)) / (tr(spec.x1) - tr(spec.x0)) * iw, Y = v => m.t + (1 - (v - y0) / (y1 - y0)) * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.aria || 'line chart')}">`;
  [0, .25, .5, .75, 1].forEach(t => {
    const v = y0 + t * (y1 - y0);
    s += `<line x1="${m.l}" x2="${m.l + iw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width=".8"/>`;
    s += `<text x="${m.l - 8}" y="${Y(v) + 3.5}" font-size="10.5" text-anchor="end">${(v * 100).toFixed(y1 - y0 < .5 ? 1 : 0)}%</text>`;
  });
  spec.xTicks.forEach(x => {
    s += `<line x1="${X(x)}" x2="${X(x)}" y1="${m.t + ih}" y2="${m.t + ih + 4}" stroke="var(--axis)"/>`;
    s += `<text x="${X(x)}" y="${m.t + ih + 17}" font-size="10.5" text-anchor="middle">${x}</text>`;
  });
  s += `<line x1="${m.l}" x2="${m.l + iw}" y1="${m.t + ih}" y2="${m.t + ih}" stroke="var(--axis)"/>`;
  s += `<text x="${m.l + iw / 2}" y="${H - 8}" font-size="11" text-anchor="middle">${esc(spec.xLabel)}</text>`;
  s += `<text transform="translate(13 ${m.t + ih / 2}) rotate(-90)" font-size="11" text-anchor="middle">${esc(spec.yLabel)}</text>`;
  (spec.vlines || []).forEach(v => {
    s += `<line x1="${X(v.x)}" x2="${X(v.x)}" y1="${m.t}" y2="${m.t + ih}" stroke="var(--ink-2)" stroke-dasharray="3 3" stroke-width=".8"/>`;
    if (v.label) s += `<text x="${X(v.x) + 4}" y="${m.t + 10 + (v.dy || 0)}" font-size="9.5">${esc(v.label)}</text>`;
  });
  if (spec.note) s += `<text x="${m.l + 8}" y="${m.t + ih - 10}" font-size="10">${esc(spec.note)}</text>`;
  const ends = [];
  spec.series.forEach((sr, i) => {
    const col = serCol(sr, i, spec), pts = sr.points.filter(p => p.y != null);
    s += `<polyline fill="none" style="stroke:${col}" stroke-width="${sr.width || 2}" ${sr.dashed ? 'stroke-dasharray="6 4"' : ''} points="${pts.map(p => X(p.x) + ',' + Y(p.y)).join(' ')}"/>`;
    pts.forEach(p => {
      if (p.lo != null && p.hi != null && p.hi - p.lo > 1e-6) s += `<line x1="${X(p.x)}" x2="${X(p.x)}" y1="${Y(p.lo)}" y2="${Y(p.hi)}" style="stroke:${col}" stroke-width="1.4" opacity=".6"/>`;
      if (sr.noDots) return;
      const t = p.tip || `${sr.label}<br>${esc(spec.xLabel)}: ${p.x}<br>${esc(spec.yLabel)}: ${p.y.toFixed(3)}`;
      s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${sr.dashed ? 3.5 : 5}" style="fill:${sr.dashed ? 'var(--surface)' : col};stroke:${sr.dashed ? col : 'var(--surface)'}" stroke-width="1.6" data-tip="${esc(t)}"/>`;
    });
    if (sr.short && pts.length) { const last = pts[pts.length - 1]; ends.push({ x: X(last.x), py: Y(last.y), y: Y(last.y), text: sr.short }); }
  });
  // spread the end labels so they never touch each other or the axis
  const gap = 15, ymax = m.t + ih - 12;
  ends.sort((a, b) => a.y - b.y);
  for (let k = 1; k < ends.length; k++) ends[k].y = Math.max(ends[k].y, ends[k - 1].y + gap);
  if (ends.length && ends[ends.length - 1].y > ymax) { ends[ends.length - 1].y = ymax; for (let k = ends.length - 2; k >= 0; k--) ends[k].y = Math.min(ends[k].y, ends[k + 1].y - gap); }
  ends.forEach(e => {
    if (Math.abs(e.y - e.py) > 3) s += `<line x1="${e.x + 6}" y1="${e.py}" x2="${e.x + 12}" y2="${e.y}" stroke="var(--muted)" stroke-width=".8"/>`;
    s += `<text x="${e.x + 14}" y="${e.y + 4}" font-size="10.5" class="endlabel" style="fill:var(--ink)">${esc(e.text)}</text>`;
  });
  host.innerHTML = s + '</svg>';
  legendHost.innerHTML = spec.series.map((sr, i) => `<span><i class="${sr.dashed ? 'dash' : (spec.legendLine ? 'line' : '')}" style="${sr.dashed || spec.legendLine ? 'border-color' : 'background'}:${serCol(sr, i, spec)}"></i>${esc(sr.label)}</span>`).join('');
}

function table(cols, rows) {
  return `<table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function renderCharts() {
  heatmap($('#hm-passkey'), 'passkey', 'Passkey exact match', r => `${r.n_examples} examples per seed`);
  heatmap($('#hm-valid'), 'valid', DATA.valid_title, r => `${r.n_valid.toLocaleString()} queries per seed`);
  heatmap($('#hm-stale'), 'stale', DATA.stale_title, r => `${r.n_stale.toLocaleString()} queries per seed`);
  $('#scatter').innerHTML = '';
  DATA.scatter_ns.forEach(n => scatter($('#scatter'), n));
  DATA.extra_figs.forEach((f, i) => { if (f.spec) lineChart($('#ch-' + i), $('#lg-' + i), f.spec); });  // a figure may carry html instead of a line chart
}

function fillText() {
  $('#meta').innerHTML = DATA.meta;
  $('#tldr').innerHTML = DATA.tldr.map(t => `<li>${t}</li>`).join('');
  $('#tested').innerHTML = DATA.tested.map(c => `<div class="card"><h3>${c.title} <span class="tag ${c.ok ? 'ok' : ''}">${esc(c.tag)}</span></h3><p>${c.body}</p></div>`).join('');
  $('#results-intro').innerHTML = DATA.results_intro;
  $('#fig1-sub').innerHTML = DATA.fig1_sub; $('#fig2-sub').innerHTML = DATA.fig2_sub;
  $('#cap1').innerHTML = DATA.cap1; $('#cap2').innerHTML = DATA.cap2;
  $('#next').innerHTML = DATA.next;
  const rows = [];
  ROWS.forEach(row => NS.forEach(n => { const r = cell(row.key, n); if (r) rows.push([row.label, n, fmt2(r.passkey), fmt2(r.valid), fmt2(r.stale), fmt2(r.expired), r.n_stale]); }));
  $('#tbl1').innerHTML = table([DATA.row_name, 'N', 'passkey', 'ar_valid', 'expired (stale)', 'expired (all)', '# stale queries per seed'], rows);
  const rows2 = [];
  DATA.scatter_ns.forEach(n => ROWS.forEach(row => { const r = cell(row.key, n); if (r) rows2.push([n, row.label, fmt2(r.expired), fmt2(r.passkey), fmt2(r.valid)]); }));
  $('#tbl2').innerHTML = table(['N', DATA.row_name, 'expired acc', 'passkey', 'ar_valid'], rows2);
  $('#extra-figs').innerHTML = DATA.extra_figs.map((f, i) => `
    <figure>
      <div class="fig-title">${f.title}</div>
      <p class="fig-sub">${f.sub}</p>
      ${f.spec ? `<div class="legend" id="lg-${i}"></div><div class="chart" id="ch-${i}"></div>` : ''}${f.html || ''}
      <figcaption>${f.caption}</figcaption>
      ${f.spec ? `<details><summary>Table view</summary><div class="tbl" id="tb-${i}"></div></details>` : ''}
    </figure>`).join('');
  DATA.extra_figs.forEach((f, i) => {
    if (!f.spec) return;
    const rws = []; f.spec.series.forEach(sr => sr.points.forEach(p => rws.push([sr.label, p.x, p.y == null ? '–' : p.y.toFixed(3), p.lo != null ? `${p.lo.toFixed(3)} to ${p.hi.toFixed(3)}` : ''])));
    $('#tb-' + i).innerHTML = table(['series', f.spec.xLabel, f.spec.yLabel, 'range over seeds'], rws);
  });
}
fillText();
renderCharts();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderCharts);
new MutationObserver(renderCharts).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
</script>
