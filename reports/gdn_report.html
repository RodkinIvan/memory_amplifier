256, 1024, 4096, 16384], "label_w": 58, "row_name": "\u03b1", "row_prefix": "\u03b1 ", "meta": "Phase 1, 2 Oct 2026. Fixed-decay Gated DeltaNet baselines (Exp 1), final. <span class='status'><span>runs finished: <b>24/24</b></span><span>\u00b7</span><span>3 seeds per \u03b1</span></span>", "tldr": ["<b>The benchmark is built and verified.</b> 24 files, valid and expired queries split 50/50, an independent brute-force oracle reproduces every label, and no example is shared between splits.", "<b>Every \u03b1 gets the expired queries right.</b> Stale-key accuracy is at least 0.999 in all 24 runs at every N up to 16,384 (6,089,991 stale queries at N = 16,384 over the three seeds), including \u03b1 = 1, which has no decay at all. Valid accuracy is at least 0.993 except for \u03b1 = 0.9 (0.99) and \u03b1 = 0.8 (0.91), where the decay is fast enough to cost some recent answers. The expected conflict, forgetting needs \u03b1 &lt; 1, does not show up.", "<b>Only the passkey separates the \u03b1 values, through how long it survives.</b> Longest N with a seed-mean of at least 90% exact match: \u03b1 = 1: 1,024, \u03b1 = 0.999: 512, \u03b1 = 0.995: 256, \u03b1 = 0.99: 256, \u03b1 = 0.98: never, \u03b1 = 0.95: never, \u03b1 = 0.9: never, \u03b1 = 0.8: never. For \u03b1 = 1 this is seed-dependent: at N = 2,048 the three seeds score 0.96, 0.20, 0.44. \u03b1 = 0.98 learned the passkey in one seed only (partially, N \u2264 64). No \u03b1 holds the passkey at N = 4,096 or beyond.", "<b>\u03b1 = 1 expires old bindings through the delta rule, not through decay.</b> On the seed-0 checkpoint its accuracy does not move when the query density changes 40-fold, so it counts writes (which overwrite each other), while a scalar decay counts tokens.", "<b>The \u03b1 = 1 passkey leak is not a kernel-precision artifact.</b> The fla kernel, an fp32 recurrence and an fp64 recurrence gave identical passkey accuracy on 32 streams. The leak grows with sequence length and with query density (figure 3).", "<b>Next.</b> A sliding-window attention baseline (separate report) has a provable reach limit, which makes it a cleaner base for the memory-amplification loop."], "tested": [{"title": "Benchmark", "tag": "passed", "ok": true, "body": "Oracle reproduces 100% of labels on all files, rejects deliberately corrupted examples, and never meets a gray-zone query. Regenerating from the stored seeds gives identical examples. No leakage between splits. Drift rate tuned to 0.10. At N \u2264 32 no key can be stale, so expired queries there are all never-written keys (n64: 92%)."}, {"title": "Model plumbing", "tag": "passed", "ok": true, "body": "Fixed-decay GDN on stock fla blocks, checked against a naive recurrence (0.3% relative, the kernel\u2019s precision). Padding to a common length does not change predictions beyond float rounding. The unit tests pass."}, {"title": "Calibration gate", "tag": "passed", "ok": true, "body": "\u03b1 = 0.95 and 0.9 answer NULL for stale keys despite GDN\u2019s output RMSNorm, so the norm eps stays at its default. \u03b1 = 1 holds the passkey at N = 256, so head_dim 32 has enough capacity."}, {"title": "Exp 1 sweep", "tag": "24/24 runs", "ok": true, "body": "8 decays \u00d7 3 seeds, 2 layers, d_model 128, 1 head of dim 32 (a 32-dim key space independent of d_model), 30k steps on N \u2264 256, fp32, evaluated on N up to 16,384. Logged to wandb project passkey_swar."}, {"title": "Probes of the \u03b1 = 1 model", "tag": "seed 0", "ok": true, "body": "Query density (0.05 to 2 queries per write): expiry unchanged, passkey leak grows with it. Number of active keys and key drift: no effect on expiry. Kernel versus fp32 and fp64 recurrence on 32 streams at N = 1,024 / 3,072 / 4,096: identical passkey accuracy."}], "results_intro": "All numbers are from the <b>test</b> split (1,000 examples per N), as the mean over 3 seeds, after 30k training steps on N \u2264 256. Hover a heatmap cell for the individual seeds.", "fig1_sub": "Rows: decay \u03b1 per token (1 = no decay). Columns: number of AR writes N (a write is about 3.75 tokens, so 16384 is about 61k tokens). Darker is higher.", "fig2_sub": "One point per \u03b1 (mean over seeds, faint dots = seeds). Ideal is the top-right corner. Labels list the \u03b1 values that share a point.", "valid_title": "AR valid accuracy (key written within the last 16 writes)", "stale_title": "AR expired accuracy, stale keys only (last write more than 32 writes ago)", "cap1": "<p><b>Bottom two grids:</b> every row is close to 1.00 in every column. Only the fastest decays cost valid answers (\u03b1 = 0.9 (0.99) and \u03b1 = 0.8 (0.91), worst over seeds and N); all other rows are at 0.993 or above. Whether a stored value fades does not decide if the model can answer these queries, including for \u03b1 = 1 where nothing fades.</p><p><b>Top grid:</b> the passkey is where rows differ. Rows \u03b1 \u2265 0.99 solve it inside the training range (N \u2264 256). Beyond it the horizon grows with \u03b1: 512 for \u03b1 = 0.999 (every seed), and 1,024 for \u03b1 = 1, where the cells at 2,048 and beyond average very different seeds (hover a cell for the three values). Rows \u03b1 \u2264 0.95 never learn it, not even at N = 32 (132 tokens); \u03b1 = 0.98 did so in one of three seeds. The no-data cells for N = 32 in the bottom grid are there because no key can be stale in 32 writes.</p>", "cap2": "<p>Expired-query accuracy is 100% for every \u03b1, so all points sit on the right edge and the spread is entirely vertical; faint dots are the individual seeds. At N = 256 the intended target corner (top right) is occupied by every \u03b1 \u2265 0.99. At N = 1,024 only \u03b1 = 1 keeps the passkey (mean 0.97), at N = 4,096 its mean has fallen to 0.09, and at N = 16,384 the corner is empty for all \u03b1. So the plot shows a horizon that shrinks as \u03b1 moves away from 1, not a diagonal trade-off between the two metrics. Hollow markers would flag models that answer NULL too often (valid accuracy below 90%); none does here.</p>", "extra_figs": [{"title": "3. Probe of the \u03b1 = 1 model: what the passkey leak depends on", "sub": "Same trained checkpoint (\u03b1 = 1, seed 0), fresh streams with a different query density. Passkey exact match at N writes; 200 streams per point (N = 256 and 512 come from the standard test split).", "caption": "<p>The dashed line marks the longest training stream. At the training density (0.25 queries per write, the thick line) the passkey is intact to N = 1,024 and falls to 0.95 at 2,048 and 0.21 at 4,096. Adding queries between the same number of writes makes it worse: at N = 2,048 it falls from 0.95 to 0.74 to 0.32 as the density goes 0.25 \u2192 1 \u2192 2. So the leak depends on how many tokens pass, and writes erode it more than queries do. Streams with no queries at all still lose it (0.30 at 4,096). A protection that was learned on streams of about 1k tokens and is not perfect would behave like this; this is a reading of the curve, not something the probe proves. Expiry of AR bindings, by contrast, stayed at 1.00 in all these streams.</p>", "spec": {"series": [{"label": "no queries (0 per write)", "short": "0 per write", "width": 2, "points": [{"x": 2048, "y": 0.945, "tip": "no queries (0 per write)<br>N = 2,048 writes, 6.2k tokens<br>passkey 0.945<br>200 streams, seed-0 checkpoint"}, {"x": 3072, "y": 0.67, "tip": "no queries (0 per write)<br>N = 3,072 writes, 9.2k tokens<br>passkey 0.670<br>200 streams, seed-0 checkpoint"}, {"x": 4096, "y": 0.305, "tip": "no queries (0 per write)<br>N = 4,096 writes, 12.3k tokens<br>passkey 0.305<br>200 streams, seed-0 checkpoint"}]}, {"label": "0.25 per write (training density)", "short": "0.25 (training)", "width": 3, "points": [{"x": 256, "y": 1.0, "tip": "0.25 per write (training density)<br>N = 256 writes, 1.0k tokens<br>passkey 1.000<br>standard test split, 1000 examples per seed"}, {"x": 512, "y": 1.0, "tip": "0.25 per write (training density)<br>N = 512 writes, 1.9k tokens<br>passkey 1.000<br>standard test split, 1000 examples per seed"}, {"x": 1024, "y": 1.0, "tip": "0.25 per write (training density)<br>N = 1,024 writes, 3.9k tokens<br>passkey 1.000<br>200 streams, seed-0 checkpoint"}, {"x": 1536, "y": 0.99, "tip": "0.25 per write (training density)<br>N = 1,536 writes, 5.8k tokens<br>passkey 0.990<br>200 streams, seed-0 checkpoint"}, {"x": 2048, "y": 0.95, "tip": "0.25 per write (training density)<br>N = 2,048 writes, 7.7k tokens<br>passkey 0.950<br>200 streams, seed-0 checkpoint"}, {"x": 3072, "y": 0.675, "tip": "0.25 per write (training density)<br>N = 3,072 writes, 11.5k tokens<br>passkey 0.675<br>200 streams, seed-0 checkpoint"}, {"x": 4096, "y": 0.21, "tip": "0.25 per write (training density)<br>N = 4,096 writes, 15.4k tokens<br>passkey 0.210<br>200 streams, seed-0 checkpoint"}, {"x": 6144, "y": 0.035, "tip": "0.25 per write (training density)<br>N = 6,144 writes, 23.0k tokens<br>passkey 0.035<br>200 streams, seed-0 checkpoint"}]}, {"label": "1 per write", "short": "1 per write", "width": 2, "points": [{"x": 2048, "y": 0.745, "tip": "1 per write<br>N = 2,048 writes, 12.3k tokens<br>passkey 0.745<br>200 streams, seed-0 checkpoint"}, {"x": 3072, "y": 0.255, "tip": "1 per write<br>N = 3,072 writes, 18.4k tokens<br>passkey 0.255<br>200 streams, seed-0 checkpoint"}, {"x": 4096, "y": 0.03, "tip": "1 per write<br>N = 4,096 writes, 24.6k tokens<br>passkey 0.030<br>200 streams, seed-0 checkpoint"}]}, {"label": "2 per write", "short": "2 per write", "width": 2, "points": [{"x": 2048, "y": 0.315, "tip": "2 per write<br>N = 2,048 writes, 18.4k tokens<br>passkey 0.315<br>200 streams, seed-0 checkpoint"}, {"x": 3072, "y": 0.025, "tip": "2 per write<br>N = 3,072 writes, 27.7k tokens<br>passkey 0.025<br>200 streams, seed-0 checkpoint"}, {"x": 4096, "y": 0.0, "tip": "2 per write<br>N = 4,096 writes, 36.9k tokens<br>passkey 0.000<br>200 streams, seed-0 checkpoint"}]}], "xTicks": [256, 512, 1024, 2048, 4096, 6144], "x0": 256, "x1": 6144, "xLabel": "AR writes N (log scale)", "yLabel": "passkey exact match", "vlines": [{"x": 256, "label": ""}], "ordReverse": true, "note": "trained on N \u2264 256 (~1k tokens)", "aria": "Passkey exact match versus N for four query densities"}}], "next": "<p><b>1. Exp 1 is complete</b> (24 of 24 runs). Raw results, summary tables and the trade-off plots are in the repository.</p><p><b>2. The benchmark question stays open.</b> Whether the \u03b1 = 1 passkey limit is only a training-length limit (train on N up to 1,024) and whether expiry should be defined in tokens instead of writes are both unanswered; the sliding-window baseline sidesteps the first by having a provable limit.</p><p><b>3. Exp 2 and 3 are on hold</b> until the memory design is settled. Mamba-2 in fla also needs <code>mamba_ssm</code>, which is not installed here.</p>"};
const NS = DATA.ns, ROWS = DATA.rows;
const fmt2 = v => (v == null ? '–' : v.toFixed(2));
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cell = (rk, n) => (DATA.results[rk] || {})[String(n)];
const perTxt = (r, key) => (r && r.per && r.per[key] ? 'seeds: ' + r.per[key].map(v => v == null ? '–' : v.toFixed(2)).join(' / ') : '');

// ---- colour helpers (tokens are read from CSS so both themes work)
function hex2rgb(h) { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); }
function mix(c1, c2, t) { return c1.map((v, i) => Math.round(v + (c2[i] - v) * t)); }
function seqColor(v) {
  const stops = [0, 1, 2, 3, 4].map(i => hex2rgb(cssv('--seq' + i)));
  const x = Math.max(0, Math.min(1, v)) * 4, i = Math.min(3, Math.floor(x));
  return mix(stops[i], stops[i + 1], x - i);
}
const lum = c => { const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }; return .2126 * f(c[0]) + .7152 * f(c[1]) + .0722 * f(c[2]); };
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
// ordinal colour for item i of n: i = 0 is the darkest (light mode) / lightest (dark mode)
const ordColor = (i, n) => { const s = [0, 1, 2, 3].map(k => hex2rgb(cssv('--ord' + k))); const j = n - 1 - i; const x = n === 1 ? 3 : j / (n - 1) * 3, k = Math.min(2, Math.floor(x)); return rgb(mix(s[k], s[k + 1], x - k)); };
const rowColor = i => (ROWS[i].color ? cssv(ROWS[i].color) : ordColor(i, ROWS.length));  // a row may name its own colour token
// series colour: explicit css colour, or an ordinal slot [i, n], or its position in the list
const serCol = (sr, i, spec) => sr.c || (sr.ord ? ordColor(sr.ord[0], sr.ord[1]) : ordColor(spec.ordReverse ? spec.series.length - 1 - i : i, spec.series.length));

// ---- tooltip
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { tip.style.display = 'none'; return; }
  tip.innerHTML = t.getAttribute('data-tip');
  tip.style.display = 'block';
  const w = tip.offsetWidth, x = Math.min(e.clientX + 14, window.innerWidth - w - 8);
  tip.style.left = Math.max(8, x) + 'px';
  tip.style.top = Math.min(e.clientY + 16, window.innerHeight - tip.offsetHeight - 8) + 'px';
});

// ---- figure 1: heatmaps (rows = configurations, columns = N)
function heatmap(host, key, title, extra) {
  const lw = DATA.label_w || 58, W = 760, left = lw, top = 54, right = 8, ch = 28, cw = (W - left - right) / NS.length;
  const H = top + ROWS.length * ch + 24, trainCols = NS.filter(n => n <= 256).length;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} by configuration and N">`;
  s += `<text x="0" y="13" style="fill:var(--ink);font-family:var(--sans);font-size:13px;font-weight:600">${esc(title)}</text>`;
  s += `<line x1="${left}" x2="${left + trainCols * cw - 4}" y1="34" y2="34" stroke="var(--axis)" stroke-width="1"/>`;
  s += `<text x="${left}" y="28" font-size="10">trained on N ≤ 256</text>`;
  s += `<text x="${left + trainCols * cw + 2}" y="28" font-size="10">${NS.length - trainCols >= 3 ? 'evaluation only, longer than training' : 'beyond training'}</text>`;
  NS.forEach((n, j) => { s += `<text x="${left + j * cw + cw / 2}" y="${top - 6}" font-size="10.5" text-anchor="middle">${n}</text>`; });
  ROWS.forEach((row, i) => {
    s += `<text x="${left - 8}" y="${top + i * ch + ch / 2 + 4}" font-size="11" text-anchor="end" style="fill:var(--ink)">${esc(row.label)}</text>`;
    NS.forEach((n, j) => {
      const r = cell(row.key, n), v = r ? r[key] : null, x = left + j * cw, y = top + i * ch;
      let fill, txt, tcol;
      if (v == null) { fill = cssv('--nodata'); txt = '–'; tcol = cssv('--muted'); }
      else { const c = seqColor(v); fill = rgb(c); txt = v >= .995 ? '1.00' : v.toFixed(2); tcol = lum(c) > .32 ? '#0b0b0b' : '#ffffff'; }
      const tipTxt = `${esc(row.long || row.label)}, N = ${n.toLocaleString()} (~${Math.round(n * 3.75 / 1000)}k tokens)<br>${esc(title)}: ${v == null ? 'no such queries' : v.toFixed(3)}${v != null && r ? '<br>' + perTxt(r, key) : ''}${extra && r && v != null ? '<br>' + extra(r) : ''}`;
      s += `<rect x="${x + 1}" y="${y + 1}" width="${cw - 2}" height="${ch - 2}" rx="2" fill="${fill}" data-tip="${esc(tipTxt)}"/>`;
      s += `<text x="${x + cw / 2}" y="${y + ch / 2 + 4}" font-size="10.5" text-anchor="middle" style="fill:${tcol};pointer-events:none">${txt}</text>`;
    });
  });
  s += `<line x1="${left + trainCols * cw - 1}" x2="${left + trainCols * cw - 1}" y1="${top - 2}" y2="${top + ROWS.length * ch}" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="3 3"/>`;
  host.innerHTML = s + '</svg>';
}

// ---- figure 2: scatter panels (one point per configuration, faint dots = seeds)
function scatter(host, n) {
  const S = 250, m = { l: 40, r: 12, t: 24, b: 38 }, iw = S - m.l - m.r, ih = S - m.t - m.b;
  const X = v => m.l + v * iw, Y = v => m.t + (1 - v) * ih;
  let s = `<svg viewBox="0 0 ${S} ${S}" role="img" aria-label="Passkey vs expired accuracy at N=${n}">`;
  s += `<text x="${m.l}" y="14" style="fill:var(--ink);font-family:var(--sans);font-size:13.5px;font-weight:600">N = ${n.toLocaleString()} writes</text>`;
  [0, .25, .5, .75, 1].forEach(t => {
    s += `<line x1="${m.l}" x2="${m.l + iw}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)" stroke-width=".8"/>`;
    s += `<line y1="${m.t}" y2="${m.t + ih}" x1="${X(t)}" x2="${X(t)}" stroke="var(--grid)" stroke-width=".8"/>`;
    s += `<text x="${m.l - 5}" y="${Y(t) + 3.5}" font-size="10.5" text-anchor="end">${Math.round(t * 100)}</text>`;
    s += `<text x="${X(t)}" y="${m.t + ih + 14}" font-size="10.5" text-anchor="middle">${Math.round(t * 100)}</text>`;
  });
  s += `<text x="${m.l + iw / 2}" y="${S - 6}" font-size="11" text-anchor="middle">expired-query accuracy, %</text>`;
  s += `<text transform="translate(10 ${m.t + ih / 2}) rotate(-90)" font-size="11" text-anchor="middle">passkey exact match, %</text>`;
  const groups = {};
  ROWS.forEach((row, i) => { const r = cell(row.key, n); if (!r) return; const k = r.expired.toFixed(2) + '|' + r.passkey.toFixed(2); (groups[k] = groups[k] || []).push({ row, i, r }); });
  Object.values(groups).forEach(g => {
    const r = g[0].r, cx = X(r.expired), cy = Y(r.passkey);
    const tipTxt = g.map(o => `${esc(o.row.long || o.row.label)}: passkey ${o.r.passkey.toFixed(3)}, expired ${o.r.expired.toFixed(3)}, valid ${o.r.valid.toFixed(3)}`).join('<br>');
    g.forEach(o => { if (o.r.per && o.r.per.passkey) o.r.per.passkey.forEach((pk, k) => { const ex = o.r.per.expired[k]; if (pk != null && ex != null) s += `<circle cx="${X(ex)}" cy="${Y(pk)}" r="2.6" fill="${rowColor(o.i)}" opacity=".4"/>`; }); });
    [...g].reverse().forEach(o => {  // drawn from the last row to the first so row 0 ends up on top
      const hollow = o.r.valid < .9;
      s += `<circle cx="${cx}" cy="${cy}" r="6" fill="${hollow ? 'var(--surface)' : rowColor(o.i)}" stroke="${hollow ? rowColor(o.i) : 'var(--surface)'}" stroke-width="${hollow ? 2 : 1.6}" data-tip="${esc(tipTxt)}"/>`;
    });
    const names = g.filter(o => !o.row.nolabel).map(o => o.row.slabel || o.row.label);  // rows may opt out of a label (identified by colour and tooltip)
    if (!names.length) return;
    const label = (DATA.row_prefix || '') + (names.length > 3 ? names[0] + ' … ' + names[names.length - 1] + ' (' + names.length + ')' : names.join(', '));
    const onRight = cx > m.l + iw * .55, lx = onRight ? cx - 10 : cx + 10;
    const ly = cy + (r.passkey > .5 ? 14 : -9);
    s += `<text x="${lx}" y="${ly}" font-size="10.5" class="endlabel" text-anchor="${onRight ? 'end' : 'start'}" style="fill:var(--ink)">${esc(label)}</text>`;
  });
  host.insertAdjacentHTML('beforeend', `<div>${s}</svg></div>`);
}

// ---- generic line chart: spec = { xTicks, x0, x1, xLog, xLabel, yLabel, yMax, series[], vlines[], note }
// series: { label, short, c (css colour, optional), width, dashed, points: [{x, y, lo, hi, tip}] }
function lineChart(host, legendHost, spec) {
  const W = 760, H = spec.height || 340, m = { l: 52, r: spec.rightPad || 132, t: 14, b: 44 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const tr = v => spec.xLog === false ? v : Math.log2(v);
  const y0 = spec.yMin || 0, y1 = spec.yMax || 1;
  const X = v => m.l + (tr(v) - tr(spec.x0)) / (tr(spec.x1) - tr(spec.x0)) * iw, Y = v => m.t + (1 - (v - y0) / (y1 - y0)) * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.aria || 'line chart')}">`;
  [0, .25, .5, .75, 1].forEach(t => {
    const v = y0 + t * (y1 - y0);
    s += `<line x1="${m.l}" x2="${m.l + iw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width=".8"/>`;
    s += `<text x="${m.l - 8}" y="${Y(v) + 3.5}" font-size="10.5" text-anchor="end">${(v * 100).toFixed(y1 - y0 < .5 ? 1 : 0)}%</text>`;
  });
  spec.xTicks.forEach(x => {
    s += `<line x1="${X(x)}" x2="${X(x)}" y1="${m.t + ih}" y2="${m.t + ih + 4}" stroke="var(--axis)"/>`;
    s += `<text x="${X(x)}" y="${m.t + ih + 17}" font-size="10.5" text-anchor="middle">${x}</text>`;
  });
  s += `<line x1="${m.l}" x2="${m.l + iw}" y1="${m.t + ih}" y2="${m.t + ih}" stroke="var(--axis)"/>`;
  s += `<text x="${m.l + iw / 2}" y="${H - 8}" font-size="11" text-anchor="middle">${esc(spec.xLabel)}</text>`;
  s += `<text transform="translate(13 ${m.t + ih / 2}) rotate(-90)" font-size="11" text-anchor="middle">${esc(spec.yLabel)}</text>`;
  (spec.vlines || []).forEach(v => {
    s += `<line x1="${X(v.x)}" x2="${X(v.x)}" y1="${m.t}" y2="${m.t + ih}" stroke="var(--ink-2)" stroke-dasharray="3 3" stroke-width=".8"/>`;
    if (v.label) s += `<text x="${X(v.x) + 4}" y="${m.t + 10 + (v.dy || 0)}" font-size="9.5">${esc(v.label)}</text>`;
  });
  if (spec.note) s += `<text x="${m.l + 8}" y="${m.t + ih - 10}" font-size="10">${esc(spec.note)}</text>`;
  const ends = [];
  spec.series.forEach((sr, i) => {
    const col = serCol(sr, i, spec), pts = sr.points.filter(p => p.y != null);
    s += `<polyline fill="none" style="stroke:${col}" stroke-width="${sr.width || 2}" ${sr.dashed ? 'stroke-dasharray="6 4"' : ''} points="${pts.map(p => X(p.x) + ',' + Y(p.y)).join(' ')}"/>`;
    pts.forEach(p => {
      if (p.lo != null && p.hi != null && p.hi - p.lo > 1e-6) s += `<line x1="${X(p.x)}" x2="${X(p.x)}" y1="${Y(p.lo)}" y2="${Y(p.hi)}" style="stroke:${col}" stroke-width="1.4" opacity=".6"/>`;
      if (sr.noDots) return;
      const t = p.tip || `${sr.label}<br>${esc(spec.xLabel)}: ${p.x}<br>${esc(spec.yLabel)}: ${p.y.toFixed(3)}`;
      s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${sr.dashed ? 3.5 : 5}" style="fill:${sr.dashed ? 'var(--surface)' : col};stroke:${sr.dashed ? col : 'var(--surface)'}" stroke-width="1.6" data-tip="${esc(t)}"/>`;
    });
    if (sr.short && pts.length) { const last = pts[pts.length - 1]; ends.push({ x: X(last.x), py: Y(last.y), y: Y(last.y), text: sr.short }); }
  });
  // spread the end labels so they never touch each other or the axis
  const gap = 15, ymax = m.t + ih - 12;
  ends.sort((a, b) => a.y - b.y);
  for (let k = 1; k < ends.length; k++) ends[k].y = Math.max(ends[k].y, ends[k - 1].y + gap);
  if (ends.length && ends[ends.length - 1].y > ymax) { ends[ends.length - 1].y = ymax; for (let k = ends.length - 2; k >= 0; k--) ends[k].y = Math.min(ends[k].y, ends[k + 1].y - gap); }
  ends.forEach(e => {
    if (Math.abs(e.y - e.py) > 3) s += `<line x1="${e.x + 6}" y1="${e.py}" x2="${e.x + 12}" y2="${e.y}" stroke="var(--muted)" stroke-width=".8"/>`;
    s += `<text x="${e.x + 14}" y="${e.y + 4}" font-size="10.5" class="endlabel" style="fill:var(--ink)">${esc(e.text)}</text>`;
  });
  host.innerHTML = s + '</svg>';
  legendHost.innerHTML = spec.series.map((sr, i) => `<span><i class="${sr.dashed ? 'dash' : (spec.legendLine ? 'line' : '')}" style="${sr.dashed || spec.legendLine ? 'border-color' : 'background'}:${serCol(sr, i, spec)}"></i>${esc(sr.label)}</span>`).join('');
}

function table(cols, rows) {
  return `<table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function renderCharts() {
  heatmap($('#hm-passkey'), 'passkey', 'Passkey exact match', r => `${r.n_examples} examples per seed`);
  heatmap($('#hm-valid'), 'valid', DATA.valid_title, r => `${r.n_valid.toLocaleString()} queries per seed`);
  heatmap($('#hm-stale'), 'stale', DATA.stale_title, r => `${r.n_stale.toLocaleString()} queries per seed`);
  $('#scatter').innerHTML = '';
  DATA.scatter_ns.forEach(n => scatter($('#scatter'), n));
  DATA.extra_figs.forEach((f, i) => { if (f.spec) lineChart($('#ch-' + i), $('#lg-' + i), f.spec); });  // a figure may carry html instead of a line chart
}

function fillText() {
  $('#meta').innerHTML = DATA.meta;
  $('#tldr').innerHTML = DATA.tldr.map(t => `<li>${t}</li>`).join('');
  $('#tested').innerHTML = DATA.tested.map(c => `<div class="card"><h3>${c.title} <span class="tag ${c.ok ? 'ok' : ''}">${esc(c.tag)}</span></h3><p>${c.body}</p></div>`).join('');
  $('#results-intro').innerHTML = DATA.results_intro;
  $('#fig1-sub').innerHTML = DATA.fig1_sub; $('#fig2-sub').innerHTML = DATA.fig2_sub;
  $('#cap1').innerHTML = DATA.cap1; $('#cap2').innerHTML = DATA.cap2;
  $('#next').innerHTML = DATA.next;
  const rows = [];
  ROWS.forEach(row => NS.forEach(n => { const r = cell(row.key, n); if (r) rows.push([row.label, n, fmt2(r.passkey), fmt2(r.valid), fmt2(r.stale), fmt2(r.expired), r.n_stale]); }));
  $('#tbl1').innerHTML = table([DATA.row_name, 'N', 'passkey', 'ar_valid', 'expired (stale)', 'expired (all)', '# stale queries per seed'], rows);
  const rows2 = [];
  DATA.scatter_ns.forEach(n => ROWS.forEach(row => { const r = cell(row.key, n); if (r) rows2.push([n, row.label, fmt2(r.expired), fmt2(r.passkey), fmt2(r.valid)]); }));
  $('#tbl2').innerHTML = table(['N', DATA.row_name, 'expired acc', 'passkey', 'ar_valid'], rows2);
  $('#extra-figs').innerHTML = DATA.extra_figs.map((f, i) => `
    <figure>
      <div class="fig-title">${f.title}</div>
      <p class="fig-sub">${f.sub}</p>
      ${f.spec ? `<div class="legend" id="lg-${i}"></div><div class="chart" id="ch-${i}"></div>` : ''}${f.html || ''}
      <figcaption>${f.caption}</figcaption>
      ${f.spec ? `<details><summary>Table view</summary><div class="tbl" id="tb-${i}"></div></details>` : ''}
    </figure>`).join('');
  DATA.extra_figs.forEach((f, i) => {
    if (!f.spec) return;
    const rws = []; f.spec.series.forEach(sr => sr.points.forEach(p => rws.push([sr.label, p.x, p.y == null ? '–' : p.y.toFixed(3), p.lo != null ? `${p.lo.toFixed(3)} to ${p.hi.toFixed(3)}` : ''])));
    $('#tb-' + i).innerHTML = table(['series', f.spec.xLabel, f.spec.yLabel, 'range over seeds'], rws);
  });
}
fillText();
renderCharts();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderCharts);
new MutationObserver(renderCharts).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
</script>
