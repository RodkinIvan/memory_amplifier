<style>
/* Layout: one reading column; the summary comes first, each chart sits in its own bordered figure with the description under it. */
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10); --nodata: #ecebe6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --seq0: #eaf2fd; --seq1: #9ec5f4; --seq2: #3987e5; --seq3: #1c5cab; --seq4: #0d366b;
  --ord0: #86b6ef; --ord1: #3987e5; --ord2: #1c5cab; --ord3: #0d366b;
  --good: #0f6b2f;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --nodata: #262624;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --seq0: #14294a; --seq1: #1c5cab; --seq2: #3987e5; --seq3: #86b6ef; --seq4: #cde2fb;
    --ord0: #cde2fb; --ord1: #6da7ec; --ord2: #2a78d6; --ord3: #1c5cab;
    --good: #5fd98a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --nodata: #262624;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --seq0: #14294a; --seq1: #1c5cab; --seq2: #3987e5; --seq3: #86b6ef; --seq4: #cde2fb;

  --good: #5fd98a;
}
body { background: var(--page); color: var(--ink); font: 15px/1.6 var(--sans); margin: 0; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }
h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 6px; font-weight: 600; text-wrap: balance; }
h2 { font-size: 1.2rem; margin: 40px 0 10px; font-weight: 600; text-wrap: balance; }
h3 { font-size: 1rem; margin: 0 0 4px; font-weight: 600; }
p { margin: 0 0 10px; max-width: 70ch; }
.meta { color: var(--ink-2); font-size: .9rem; margin: 0 0 22px; }
code, .mono { font-family: var(--mono); font-size: .88em; }
.summary { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; }
.summary ol { margin: 8px 0 0; padding-left: 1.2em; display: grid; gap: 8px; }
.summary li { max-width: 78ch; }
.status { display: inline-flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: .85rem; color: var(--ink-2); font-family: var(--mono); }
.status b { color: var(--ink); font-weight: 500; }
figure { margin: 18px 0 0; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 14px 10px; }
figcaption { color: var(--ink-2); font-size: .92rem; margin-top: 8px; }
figcaption p { max-width: 82ch; }
.fig-title { font-weight: 600; font-size: .98rem; }
.fig-sub { color: var(--ink-2); font-size: .86rem; margin: 0 0 8px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { font-family: var(--mono); fill: var(--ink-2); }
.chart text.endlabel { paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.hm-scroll { overflow-x: auto; }
.hm-scroll svg { min-width: 640px; }
.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .84rem; color: var(--ink-2); margin: 4px 0 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.legend i.line { width: 18px; height: 0; border-radius: 0; border-top: 2px solid; vertical-align: 3px; }
.legend i.dash { width: 18px; height: 0; border-radius: 0; border-top: 2px dashed; vertical-align: 3px; }
.pbar { display: grid; grid-template-columns: minmax(150px, 290px) minmax(0, 1fr); gap: 2px 12px; align-items: center; margin: 5px 0; font-size: .8rem; color: var(--ink-2); }
.pbar .stack { display: flex; height: 22px; border-radius: 3px; overflow: hidden; border: 1px solid var(--border); }
.pbar .stack i { display: block; min-width: 0; font: 10.5px/22px var(--mono); text-align: center; font-style: normal; overflow: hidden; }
details { margin-top: 8px; font-size: .86rem; }
summary { cursor: pointer; color: var(--ink-2); }
summary:focus-visible, a:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.tbl { overflow-x: auto; margin-top: 6px; }
table { border-collapse: collapse; font-family: var(--mono); font-size: .8rem; font-variant-numeric: tabular-nums; }
th, td { padding: 3px 9px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
.tbl.kv th, .tbl.kv td { text-align: left; white-space: normal; vertical-align: top; }
.tbl.wide td:first-child { white-space: normal; min-width: 240px; max-width: 420px; }
.hint { color: var(--muted); font-size: .72rem; }
th { color: var(--ink-2); font-weight: 500; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-top: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.card p { font-size: .9rem; }
ul.tight { margin: 4px 0 10px; padding-left: 1.2em; display: grid; gap: 4px; max-width: 82ch; }
.tag { font-family: var(--mono); font-size: .75rem; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--border); color: var(--ink-2); white-space: nowrap; }
.tag.ok { color: var(--good); border-color: var(--good); }
#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--page); font: 12px/1.45 var(--mono); padding: 6px 9px; border-radius: 5px; max-width: 300px; display: none; }
@media (max-width: 520px) { h1 { font-size: 1.5rem; } .wrap { padding-block: 20px 48px; } .pbar { grid-template-columns: 1fr; } }
</style>

004827602, 1.0], "stale": [1.0, 0.9999958528766522, 1.0], "expired": [1.0, 0.9999961126401393, 1.0]}}, "4096": {"passkey": 0.3333333333333333, "valid": 0.9999915397465959, "stale": 1.0, "expired": 1.0, "n_examples": 1000, "n_valid": 512199, "n_stale": 495568, "per": {"passkey": [0.0, 0.0, 1.0], "valid": [1.0, 1.0, 0.9999746192397877], "stale": [1.0, 1.0, 1.0], "expired": [1.0, 1.0, 1.0]}}, "8192": {"passkey": 0.32266666666666666, "valid": 0.9998904954980938, "stale": 1.0, "expired": 1.0, "n_examples": 1000, "n_valid": 1022789, "n_stale": 1006975, "per": {"passkey": [0.0, 0.0, 0.968], "valid": [1.0, 0.9999990222812329, 0.9996724642130488], "stale": [1.0, 1.0, 1.0], "expired": [1.0, 1.0, 1.0]}}, "16384": {"passkey": 0.050666666666666665, "valid": 0.9992628183667541, "stale": 0.999999014776869, "expired": 0.9999990227236303, "n_examples": 1000, "n_valid": 2046081, "n_stale": 2029997, "per": {"passkey": [0.0, 0.0, 0.152], "valid": [1.0, 0.9999990225215912, 0.9977894325786711], "stale": [0.9999995073884346, 0.9999985221653037, 0.9999990147768691], "expired": [0.9999995113618151, 0.9999985340854453, 0.9999990227236302]}}}}, "scatter_ns": [], "hide_scatter": true, "label_w": 352, "row_name": "configuration", "row_prefix": "", "meta": "Sub-report for the group meeting, results of 07 Oct 2026, 22:36. Best checkpoint: <code>runs/swa_fb_gi0_nlnone_seg8_steps50000_s2/model.pt</code>. Test split, N counts AR writes, one write is about 3.75 tokens.", "tldr": ["<b>Method.</b> A sliding-window transformer (2 layers, window 64, 563k parameters) sees only 126 tokens back. We add <b>segment-level recurrence</b>: once per segment of 8 tokens every layer compresses its outputs into one vector m (RMSNorm, linear map, mean over the segment) and adds it, through a learned per-channel gain, to the input of every token of the next segment. Nothing else changes: the window and the attention are those of plain SWA.", "<b>Result.</b> The best checkpoint (segment 8, seed 2, 50k steps, chosen on the validation split) answers the 4-token passkey with exact match 1.00 / 1.00 / 0.99 / 0.99 on the test split at N = 256 / 1,024 / 4,096 / 16,384 writes. The longest stream it trained on is 972 tokens; N = 16,384 is about 61,440 tokens (63\u00d7 longer, 488\u00d7 its attention reach, 7,680 segment hops), with AR valid accuracy 0.99 and AR expired accuracy 1.00 (the associative-recall half of the task is not hurt).", "<b>Against the baselines.</b> The same model without the recurrence (plain SWA, window 64, trained the same way) never reaches 0.9 at any N (passkey 0.32 at N = 32, 0.00 at N = 256); plain SWA with window 1024 (reach 2,046 tokens) holds it only up to N = 256 (the longest training stream) and scores 0.00 at N = 512, though 512 writes (about 1,920 tokens) are inside its reach; GDN \u03b1 = 1 (441k parameters, 30k steps without the curriculum; best of 3 seeds, picked on validation like our checkpoint) scores 1.00 / 0.96 / 0.26 / 0.00 at N = 1,024 / 2,048 / 4,096 / 8,192 and 0.00 at N = 16,384 (mean of its seeds 0.53 at N = 2,048); GDN-2 with the stock learned decay, trained like our model (50k steps, same curriculum; best of 3 seeds, picked on validation) scores 1.00 / 1.00 / 1.00 / 0.97 at N = 1,024 / 2,048 / 4,096 / 8,192 and 0.15 at N = 16,384; per seed at N = 4,096 it scores 0.00 / 0.00 / 1.00; the best seed stays above 0.9 up to N = 8,192, our checkpoint up to N = 16,384.", "<b>Training is unstable.</b> The setup of the best checkpoint has 3 seeds. Passkey at N = 256 per seed 0.07 / 1.00 / 1.00 and at N = 16,384 per seed 0.07 / 0.00 / 0.99 (seeds 0, 1, 2); 2 of 3 score below 0.1 at N = 16,384. With 20k steps instead of 50k the same setup scored 0.93 / 0.01 / 0.72 over its 3 seeds (mean 0.55). GDN-2 is unstable in the same way: 1 of 3 seeds hold the passkey at N = 4,096. The runs differ in whether and when the loop switches on and in how far it then carries the passkey, which is the gap between the best checkpoint and the mean lines (figures 4, 5)."], "tested": [], "intro": "<h2>Method</h2><p>The task: remember a 4-token passkey shown once at the start of a stream, and repeat it at the end, while also answering associative-recall queries about recent key\u2013value writes. A plain sliding-window model cannot do the first part beyond its window; a recurrent model has to do both with one decay. Segment-level recurrence gives the window model a small, learned, once-per-segment memory.</p><figure><div class='fig-title'>The model, one layer, three consecutive segments</div><div class='chart'><svg viewBox='0 0 780 340' role='img' aria-label='One layer of the segment-recurrent model: the outputs of segment s-1 give the vector m, which is added to every token input of segment s' style='width:100%;height:auto'><style>.tk{fill:var(--s1);opacity:.85}.to{fill:var(--s3);opacity:.85}.bl{fill:var(--surface);stroke:var(--axis);stroke-width:1.2}.mn{fill:var(--s2)}.ar{stroke:var(--ink-2);stroke-width:1.4;fill:none}.fb{stroke:var(--s2);stroke-width:2.4;fill:none}.fd{stroke:var(--s2);stroke-width:1.6;fill:none;stroke-dasharray:5 4}.t{font:11.5px var(--mono);fill:var(--ink-2)}.tb{font:12px var(--mono);fill:var(--ink)}.to2{font:11.5px var(--mono);fill:var(--s2)}</style><defs><marker id='ah' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--ink-2)'/></marker><marker id='ao' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--s2)'/></marker></defs><text x='20' y='16' class='t'>m = mean over the segment of Linear(RMSNorm(y)), one vector per layer and segment, computed in fp32</text><text x='132' y='330' text-anchor='middle' class='tb'>segment s\u22121 (8 tokens)</text><rect x='40' y='282' width='20' height='20' rx='3' class='tk'/><rect x='63' y='282' width='20' height='20' rx='3' class='tk'/><rect x='86' y='282' width='20' height='20' rx='3' class='tk'/><rect x='109' y='282' width='20' height='20' rx='3' class='tk'/><rect x='132' y='282' width='20' height='20' rx='3' class='tk'/><rect x='155' y='282' width='20' height='20' rx='3' class='tk'/><rect x='178' y='282' width='20' height='20' rx='3' class='tk'/><rect x='201' y='282' width='20' height='20' rx='3' class='tk'/><path d='M132 280 L132 212' class='ar' marker-end='url(#ah)'/><rect x='32' y='132' width='200' height='78' rx='4' class='bl'/><text x='132' y='162' text-anchor='middle' class='tb'>layer \u2113</text><text x='132' y='182' text-anchor='middle' class='t'>sliding window 64</text><text x='132' y='198' text-anchor='middle' class='t'>+ MLP</text><path d='M132 130 L132 90' class='ar' marker-end='url(#ah)'/><rect x='40' y='64' width='20' height='20' rx='3' class='to'/><rect x='63' y='64' width='20' height='20' rx='3' class='to'/><rect x='86' y='64' width='20' height='20' rx='3' class='to'/><rect x='109' y='64' width='20' height='20' rx='3' class='to'/><rect x='132' y='64' width='20' height='20' rx='3' class='to'/><rect x='155' y='64' width='20' height='20' rx='3' class='to'/><rect x='178' y='64' width='20' height='20' rx='3' class='to'/><rect x='201' y='64' width='20' height='20' rx='3' class='to'/><text x='132' y='52' text-anchor='middle' class='t'>outputs y</text><text x='382' y='330' text-anchor='middle' class='tb'>segment s (8 tokens)</text><rect x='290' y='282' width='20' height='20' rx='3' class='tk'/><rect x='313' y='282' width='20' height='20' rx='3' class='tk'/><rect x='336' y='282' width='20' height='20' rx='3' class='tk'/><rect x='359' y='282' width='20' height='20' rx='3' class='tk'/><rect x='382' y='282' width='20' height='20' rx='3' class='tk'/><rect x='405' y='282' width='20' height='20' rx='3' class='tk'/><rect x='428' y='282' width='20' height='20' rx='3' class='tk'/><rect x='451' y='282' width='20' height='20' rx='3' class='tk'/><path d='M382 280 L382 212' class='ar' marker-end='url(#ah)'/><rect x='282' y='132' width='200' height='78' rx='4' class='bl'/><text x='382' y='162' text-anchor='middle' class='tb'>layer \u2113</text><text x='382' y='182' text-anchor='middle' class='t'>sliding window 64</text><text x='382' y='198' text-anchor='middle' class='t'>+ MLP</text><path d='M382 130 L382 90' class='ar' marker-end='url(#ah)'/><rect x='290' y='64' width='20' height='20' rx='3' class='to'/><rect x='313' y='64' width='20' height='20' rx='3' class='to'/><rect x='336' y='64' width='20' height='20' rx='3' class='to'/><rect x='359' y='64' width='20' height='20' rx='3' class='to'/><rect x='382' y='64' width='20' height='20' rx='3' class='to'/><rect x='405' y='64' width='20' height='20' rx='3' class='to'/><rect x='428' y='64' width='20' height='20' rx='3' class='to'/><rect x='451' y='64' width='20' height='20' rx='3' class='to'/><text x='382' y='52' text-anchor='middle' class='t'>outputs y</text><circle cx='382' cy='246' r='10' fill='var(--surface)' stroke='var(--s2)' stroke-width='2'/><text x='382' y='251' text-anchor='middle' style='font:700 15px var(--mono);fill:var(--s2)'>+</text><text x='632' y='330' text-anchor='middle' class='tb'>segment s+1 (8 tokens)</text><rect x='540' y='282' width='20' height='20' rx='3' class='tk'/><rect x='563' y='282' width='20' height='20' rx='3' class='tk'/><rect x='586' y='282' width='20' height='20' rx='3' class='tk'/><rect x='609' y='282' width='20' height='20' rx='3' class='tk'/><rect x='632' y='282' width='20' height='20' rx='3' class='tk'/><rect x='655' y='282' width='20' height='20' rx='3' class='tk'/><rect x='678' y='282' width='20' height='20' rx='3' class='tk'/><rect x='701' y='282' width='20' height='20' rx='3' class='tk'/><path d='M632 280 L632 212' class='ar' marker-end='url(#ah)'/><rect x='532' y='132' width='200' height='78' rx='4' class='bl'/><text x='632' y='162' text-anchor='middle' class='tb'>layer \u2113</text><text x='632' y='182' text-anchor='middle' class='t'>sliding window 64</text><text x='632' y='198' text-anchor='middle' class='t'>+ MLP</text><path d='M632 130 L632 90' class='ar' marker-end='url(#ah)'/><rect x='540' y='64' width='20' height='20' rx='3' class='to'/><rect x='563' y='64' width='20' height='20' rx='3' class='to'/><rect x='586' y='64' width='20' height='20' rx='3' class='to'/><rect x='609' y='64' width='20' height='20' rx='3' class='to'/><rect x='632' y='64' width='20' height='20' rx='3' class='to'/><rect x='655' y='64' width='20' height='20' rx='3' class='to'/><rect x='678' y='64' width='20' height='20' rx='3' class='to'/><rect x='701' y='64' width='20' height='20' rx='3' class='to'/><text x='632' y='52' text-anchor='middle' class='t'>outputs y</text><circle cx='632' cy='246' r='10' fill='var(--surface)' stroke='var(--s2)' stroke-width='2'/><text x='632' y='251' text-anchor='middle' style='font:700 15px var(--mono);fill:var(--s2)'>+</text><path d='M226 74 L242 82' class='ar'/><circle cx='257' cy='86' r='15' class='mn'/><text x='257' y='91' text-anchor='middle' style='font:700 14px var(--mono);fill:#fff'>m</text><path d='M257 101 L257 246 L370 246' class='fb' marker-end='url(#ao)'/><path d='M476 74 L492 82' class='ar'/><circle cx='507' cy='86' r='15' class='mn'/><text x='507' y='91' text-anchor='middle' style='font:700 14px var(--mono);fill:#fff'>m</text><path d='M507 101 L507 246 L620 246' class='fd' marker-end='url(#ao)'/><text x='396' y='262' class='to2'>+ g \u2299 m on every token</text><text x='396' y='276' class='to2' style='font-size:10.5px'>(learned gain g per channel)</text></svg></div><figcaption>Inside a segment the layer is plain sliding-window attention over the last 64 tokens (which reach back into the previous segments). Between segments the only new path is m, one vector per layer that is rebuilt from scratch every segment, so information can travel past the window only by being re-written into it every few tokens.</figcaption></figure><h2>Training procedure and techniques</h2><ul class='tight'><li><b>Backbone:</b> stock flash-linear-attention transformer, 2 layers, d_model 128, 4 heads \u00d7 32, RoPE (\u03b8 = 10,000), SwiGLU MLP (hidden 512), tied embeddings, vocabulary of 40 tokens, 563,584 parameters.</li><li><b>Attention:</b> causal sliding window of 64 tokens, bf16 autocast with flash attention. Plain SWA reaches 2 \u00d7 (64 \u2212 1) = 126 tokens; the model is run one segment at a time and the last 63 layer inputs are carried over, so every query sees exactly what plain SWA would see.</li><li><b>Segment recurrence:</b> segment of 8 tokens (no tanh); per layer, m = mean over the segment of Linear(RMSNorm(y)) in fp32, added as x + g \u2299 m to every token input of the next segment, one learned gain g per channel; m = 0 before the first segment, so the first segment is plain SWA.</li><li><b>No tanh on the loop vector</b> (the RMSNorm stays): at segment 8 and 20k steps the passkey at N = 1,024 is 0.73 without tanh against 0.00 with it (0 of 3 tanh runs started the loop).</li><li><b>Loop gain initialised to 0</b> (and loop projection init std 0.1): the model starts as exactly plain SWA, so the associative-recall half is learned first and the optimiser switches the loop on later; at segment 8, 20k steps, passkey at N = 1,024 is 0.73 with gain 0 against 0.09 with gain 0.1.</li><li><b>Learning rate \u00d7 10 and no weight decay for the loop parameters</b> (gain, projection and the norm weight of the loop), so the loop learns faster than the backbone.</li><li><b>Stream-length curriculum:</b> training starts on N = 32 only and adds the next length every 2,000 steps (32 \u2192 64 \u2192 128 \u2192 256); examples are drawn uniformly over the active lengths and padded to a multiple of 256 <span class='hint'>(12k-step exploration, segment 64 no-tanh loop: the only recipe that learned both halves, AR valid 0.99 and passkey 0.96 at N = 256)</span>.</li><li><b>Plain objective:</b> cross-entropy on the supervised tokens only (AR answers and the 4 passkey tokens), plain mean, passkey weight 1; no auxiliary loss, no noise on the loop vector.</li><li><b>Optimiser:</b> AdamW (\u03b2 = 0.9 / 0.95, weight decay 0.01 on matrices), learning rate 0.001, 500 warm-up steps then cosine decay to 0.1 \u00d7 at the last step, gradient clipping 1, batch 32 streams, 50,000 steps, bf16.</li><li><b>Model selection:</b> the checkpoint is the run with the best validation passkey at N = 16,384 among the runs of the segment-8 setups (50k-step seeds 0, 1, 2; 20k-step seeds 0, 1, 2); the checkpoint itself was never picked on the test split. The setup (segment 8, no tanh, gain 0) was chosen earlier from a 24-run grid compared on the test split, so the test numbers of the setup are slightly optimistic; the validation split shows the same picture.</li><li><b>Evaluation:</b> teacher-forced exact match (all 4 passkey tokens right), fixed batch shape per N, up to N = 16,384; the data (<code>irodkin/passkey_swar</code>) and its oracle are described in the benchmark report.</li></ul>", "results_title": "Results", "results_intro": "The mean lines are the average over the seeds of a setup, bars from the worst to the best seed. The best checkpoint is one run, selected on validation.", "fig1_title": "1. Accuracy by configuration and stream length", "fig1_sub": "Rows: the best checkpoint, the averages of the best setups, the baselines. Columns: stream length N. Darker is higher.", "valid_title": "AR valid accuracy (key written within the last 16 writes)", "stale_title": "AR expired accuracy, stale keys only (last write more than 32 writes ago)", "cap1": "<p>Top grid: passkey. Middle and bottom grids: for the best checkpoint the associative-recall half stays at 0.99 (valid) and 1.00 (expired) or above at every length, so the memory is not bought with recall quality. The setup means include the seeds that never started the loop (and, for the 20k-step setup, one seed that never learned the recall half), which is why they are lower.</p>", "cap2": "", "extra_figs": [{"key": "n", "title": "2. Passkey accuracy against stream length", "sub": "Test split (1,000 streams per N). // ---- colour helpers (tokens are read from CSS so both themes work)
function hex2rgb(h) { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); }
function mix(c1, c2, t) { return c1.map((v, i) => Math.round(v + (c2[i] - v) * t)); }
function seqColor(v) {

  return mix(stops[i], stops[i + 1], x - i);
}

const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
// ordinal colour for item i of n: i = 0 is the darkest (light mode) / lightest (dark mode)
const ordColor = (i, n) => { const s = [0, 1, 2, 3].map(k => hex2rgb(cssv('--ord' + k))); const j = n - 1 - i; const x = n === 1 ? 3 : j / (n - 1) * 3, k = Math.min(2, Math.floor(x)); return rgb(mix(s[k], s[k + 1], x - k)); };

      if (v == null) { fill = cssv('--nodata'); txt = '–'; tcol = cssv('--muted'); }
      else { const c = seqColor(v); fill = rgb(c); txt = v >= .995 ? '1.00' : v.toFixed(2); tcol = lum(c) > .32 ? '#0b0b0b' : '#ffffff'; }
      const tipTxt = `${esc(row.long || row.label)}, N = ${n.toLocaleString()} (~${Math.round(n * 3.75 / 1000)}k tokens)<br>${esc(title)}: ${v == null ? 'no such queries' : v.toFixed(3)}${v != null && r ? '<br>' + perTxt(r, key) : ''}${extra && r && v != null ? '<br>' + extra(r) : ''}`;
      s += `<rect x="${x + 1}" y="${y + 1}" width="${cw - 2}" height="${ch - 2}" rx="2" fill="${fill}" data-tip="${esc(tipTxt)}"/>`;
      s += `<text x="${x + cw / 2}" y="${y + ch / 2 + 4}" font-size="10.5" text-anchor="middle" style="fill:${tcol};pointer-events:none">${txt}</text>`;
    });
  });
  s += `<line x1="${left + trainCols * cw - 1}" x2="${left + trainCols * cw - 1}" y1="${top - 2}" y2="${top + ROWS.length * ch}" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="3 3"/>`;
  host.innerHTML = s + '</svg>';
}

// ---- figure 2: scatter panels (one point per configuration, faint dots = seeds)
function scatter(host, n) {
  const S = 250, m = { l: 40, r: 12, t: 24, b: 38 }, iw = S - m.l - m.r, ih = S - m.t - m.b;
  const X = v => m.l + v * iw, Y = v => m.t + (1 - v) * ih;
  let s = `<svg viewBox="0 0 ${S} ${S}" role="img" aria-label="Passkey vs expired accuracy at N=${n}">`;
  s += `<text x="${m.l}" y="14" style="fill:var(--ink);font-family:var(--sans);font-size:13.5px;font-weight:600">N = ${n.toLocaleString()} writes</text>`;
  [0, .25, .5, .75, 1].forEach(t => {
    s += `<line x1="${m.l}" x2="${m.l + iw}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)" stroke-width=".8"/>`;
    s += `<line y1="${m.t}" y2="${m.t + ih}" x1="${X(t)}" x2="${X(t)}" stroke="var(--grid)" stroke-width=".8"/>`;
    s += `<text x="${m.l - 5}" y="${Y(t) + 3.5}" font-size="10.5" text-anchor="end">${Math.round(t * 100)}</text>`;
    s += `<text x="${X(t)}" y="${m.t + ih + 14}" font-size="10.5" text-anchor="middle">${Math.round(t * 100)}</text>`;
  });
  s += `<text x="${m.l + iw / 2}" y="${S - 6}" font-size="11" text-anchor="middle">expired-query accuracy, %</text>`;
  s += `<text transform="translate(10 ${m.t + ih / 2}) rotate(-90)" font-size="11" text-anchor="middle">passkey exact match, %</text>`;
  const groups = {};
  ROWS.forEach((row, i) => { const r = cell(row.key, n); if (!r) return; const k = r.expired.toFixed(2) + '|' + r.passkey.toFixed(2); (groups[k] = groups[k] || []).push({ row, i, r }); });
  Object.values(groups).forEach(g => {
    const r = g[0].r, cx = X(r.expired), cy = Y(r.passkey);
    const tipTxt = g.map(o => `${esc(o.row.long || o.row.label)}: passkey ${o.r.passkey.toFixed(3)}, expired ${o.r.expired.toFixed(3)}, valid ${o.r.valid.toFixed(3)}`).join('<br>');
    g.forEach(o => { if (o.r.per && o.r.per.passkey) o.r.per.passkey.forEach((pk, k) => { const ex = o.r.per.expired[k]; if (pk != null && ex != null) s += `<circle cx="${X(ex)}" cy="${Y(pk)}" r="2.6" fill="${rowColor(o.i)}" opacity=".4"/>`; }); });
    [...g].reverse().forEach(o => {  // drawn from the last row to the first so row 0 ends up on top
      const hollow = o.r.valid < .9;
      s += `<circle cx="${cx}" cy="${cy}" r="6" fill="${hollow ? 'var(--surface)' : rowColor(o.i)}" stroke="${hollow ? rowColor(o.i) : 'var(--surface)'}" stroke-width="${hollow ? 2 : 1.6}" data-tip="${esc(tipTxt)}"/>`;
    });
    const names = g.filter(o => !o.row.nolabel).map(o => o.row.slabel || o.row.label);  // rows may opt out of a label (identified by colour and tooltip)
    if (!names.length) return;
    const label = (DATA.row_prefix || '') + (names.length > 3 ? names[0] + ' … ' + names[names.length - 1] + ' (' + names.length + ')' : names.join(', '));
    const onRight = cx > m.l + iw * .55, lx = onRight ? cx - 10 : cx + 10;
    const ly = cy + (r.passkey > .5 ? 14 : -9);
    s += `<text x="${lx}" y="${ly}" font-size="10.5" class="endlabel" text-anchor="${onRight ? 'end' : 'start'}" style="fill:var(--ink)">${esc(label)}</text>`;
  });
  host.insertAdjacentHTML('beforeend', `<div>${s}</svg></div>`);
}

// ---- generic line chart: spec = { xTicks, x0, x1, xLog, xLabel, yLabel, yMax, series[], vlines[], note }
// series: { label, short, c (css colour, optional), width, dashed, points: [{x, y, lo, hi, tip}] }
function lineChart(host, legendHost, spec) {
  const W = 760, H = spec.height || 340, m = { l: 52, r: spec.rightPad || 132, t: 14, b: 44 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const tr = v => spec.xLog === false ? v : Math.log2(v);
  const y0 = spec.yMin || 0, y1 = spec.yMax || 1;
  const X = v => m.l + (tr(v) - tr(spec.x0)) / (tr(spec.x1) - tr(spec.x0)) * iw, Y = v => m.t + (1 - (v - y0) / (y1 - y0)) * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.aria || 'line chart')}">`;
  [0, .25, .5, .75, 1].forEach(t => {
    const v = y0 + t * (y1 - y0);
    s += `<line x1="${m.l}" x2="${m.l + iw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width=".8"/>`;
    s += `<text x="${m.l - 8}" y="${Y(v) + 3.5}" font-size="10.5" text-anchor="end">${(v * 100).toFixed(y1 - y0 < .5 ? 1 : 0)}%</text>`;
  });
  spec.xTicks.forEach(x => {
    s += `<line x1="${X(x)}" x2="${X(x)}" y1="${m.t + ih}" y2="${m.t + ih + 4}" stroke="var(--axis)"/>`;
    s += `<text x="${X(x)}" y="${m.t + ih + 17}" font-size="10.5" text-anchor="middle">${x}</text>`;
  });
  s += `<line x1="${m.l}" x2="${m.l + iw}" y1="${m.t + ih}" y2="${m.t + ih}" stroke="var(--axis)"/>`;
  s += `<text x="${m.l + iw / 2}" y="${H - 8}" font-size="11" text-anchor="middle">${esc(spec.xLabel)}</text>`;
  s += `<text transform="translate(13 ${m.t + ih / 2}) rotate(-90)" font-size="11" text-anchor="middle">${esc(spec.yLabel)}</text>`;
  (spec.vlines || []).forEach(v => {
    s += `<line x1="${X(v.x)}" x2="${X(v.x)}" y1="${m.t}" y2="${m.t + ih}" stroke="var(--ink-2)" stroke-dasharray="3 3" stroke-width=".8"/>`;
    if (v.label) s += `<text x="${X(v.x) + 4}" y="${m.t + 10 + (v.dy || 0)}" font-size="9.5">${esc(v.label)}</text>`;
  });
  if (spec.note) s += `<text x="${m.l + 8}" y="${m.t + ih - 10}" font-size="10">${esc(spec.note)}</text>`;
  const ends = [];
  spec.series.forEach((sr, i) => {
    const col = serCol(sr, i, spec), pts = sr.points.filter(p => p.y != null);
    s += `<polyline fill="none" style="stroke:${col}" stroke-width="${sr.width || 2}" ${sr.dashed ? 'stroke-dasharray="6 4"' : ''} points="${pts.map(p => X(p.x) + ',' + Y(p.y)).join(' ')}"/>`;
    pts.forEach(p => {
      if (p.lo != null && p.hi != null && p.hi - p.lo > 1e-6) s += `<line x1="${X(p.x)}" x2="${X(p.x)}" y1="${Y(p.lo)}" y2="${Y(p.hi)}" style="stroke:${col}" stroke-width="1.4" opacity=".6"/>`;
      if (sr.noDots) return;
      const t = p.tip || `${sr.label}<br>${esc(spec.xLabel)}: ${p.x}<br>${esc(spec.yLabel)}: ${p.y.toFixed(3)}`;
      s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${sr.dashed ? 3.5 : 5}" style="fill:${sr.dashed ? 'var(--surface)' : col};stroke:${sr.dashed ? col : 'var(--surface)'}" stroke-width="1.6" data-tip="${esc(t)}"/>`;
    });
    if (sr.short && pts.length) { const last = pts[pts.length - 1]; ends.push({ x: X(last.x), py: Y(last.y), y: Y(last.y), text: sr.short }); }
  });
  // spread the end labels so they never touch each other or the axis
  const gap = 15, ymax = m.t + ih - 12;
  ends.sort((a, b) => a.y - b.y);
  for (let k = 1; k < ends.length; k++) ends[k].y = Math.max(ends[k].y, ends[k - 1].y + gap);
  if (ends.length && ends[ends.length - 1].y > ymax) { ends[ends.length - 1].y = ymax; for (let k = ends.length - 2; k >= 0; k--) ends[k].y = Math.min(ends[k].y, ends[k + 1].y - gap); }
  ends.forEach(e => {
    if (Math.abs(e.y - e.py) > 3) s += `<line x1="${e.x + 6}" y1="${e.py}" x2="${e.x + 12}" y2="${e.y}" stroke="var(--muted)" stroke-width=".8"/>`;
    s += `<text x="${e.x + 14}" y="${e.y + 4}" font-size="10.5" class="endlabel" style="fill:var(--ink)">${esc(e.text)}</text>`;
  });
  host.innerHTML = s + '</svg>';
  legendHost.innerHTML = spec.series.map((sr, i) => `<span><i class="${sr.dashed ? 'dash' : (spec.legendLine ? 'line' : '')}" style="${sr.dashed || spec.legendLine ? 'border-color' : 'background'}:${serCol(sr, i, spec)}"></i>${esc(sr.label)}</span>`).join('');
}

function table(cols, rows) {
  return `<table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function renderCharts() {
  heatmap($('#hm-passkey'), 'passkey', 'Passkey exact match', r => `${r.n_examples} examples per seed`);
  heatmap($('#hm-valid'), 'valid', DATA.valid_title, r => `${r.n_valid.toLocaleString()} queries per seed`);
  heatmap($('#hm-stale'), 'stale', DATA.stale_title, r => `${r.n_stale.toLocaleString()} queries per seed`);
  if (!DATA.hide_scatter) { $('#scatter').innerHTML = ''; DATA.scatter_ns.forEach(n => scatter($('#scatter'), n)); }
  DATA.extra_figs.forEach((f, i) => { if (f.spec) lineChart($('#ch-' + i), $('#lg-' + i), f.spec); });  // a figure may carry html instead of a line chart
}

function fillText() {
  $('#meta').innerHTML = DATA.meta;
  $('#tldr').innerHTML = DATA.tldr.map(t => `<li>${t}</li>`).join('');
  $('#intro').innerHTML = DATA.intro || '';  // optional block between the summary and the cards (a method description with its own figures)
  $('#tested-h').textContent = DATA.tested_title || 'What was tested'; $('#results-h').textContent = DATA.results_title || 'Results'; $('#next-h').textContent = DATA.next_title || 'What is next';
  if (DATA.fig1_title) $('#fig1-title').textContent = DATA.fig1_title;
  if (DATA.hide_scatter) $('#fig2-fig').remove();
  $('#tested').innerHTML = DATA.tested.map(c => `<div class="card"><h3>${c.title} <span class="tag ${c.ok ? 'ok' : ''}">${esc(c.tag)}</span></h3><p>${c.body}</p></div>`).join('');
  if (!DATA.tested.length) { $('#tested-h').remove(); $('#tested').remove(); }
  $('#results-intro').innerHTML = DATA.results_intro;
  $('#fig1-sub').innerHTML = DATA.fig1_sub;
  $('#cap1').innerHTML = DATA.cap1;
  if (!DATA.hide_scatter) { $('#fig2-sub').innerHTML = DATA.fig2_sub; $('#cap2').innerHTML = DATA.cap2; }
  $('#next').innerHTML = DATA.next;
  const rows = [];
  ROWS.forEach(row => NS.forEach(n => { const r = cell(row.key, n); if (r) rows.push([row.label, n, fmt2(r.passkey), fmt2(r.valid), fmt2(r.stale), fmt2(r.expired), r.n_stale]); }));
  $('#tbl1').innerHTML = table([DATA.row_name, 'N', 'passkey', 'ar_valid', 'expired (stale)', 'expired (all)', '# stale queries per seed'], rows);
  if (!DATA.hide_scatter) {
    const rows2 = [];
    DATA.scatter_ns.forEach(n => ROWS.forEach(row => { const r = cell(row.key, n); if (r) rows2.push([n, row.label, fmt2(r.expired), fmt2(r.passkey), fmt2(r.valid)]); }));
    $('#tbl2').innerHTML = table(['N', DATA.row_name, 'expired acc', 'passkey', 'ar_valid'], rows2);
  }
  $('#extra-figs').innerHTML = DATA.extra_figs.map((f, i) => `
    <figure>
      <div class="fig-title">${f.title}</div>
      <p class="fig-sub">${f.sub}</p>
      ${f.spec ? `<div class="legend" id="lg-${i}"></div><div class="chart" id="ch-${i}"></div>` : ''}${f.html || ''}
      <figcaption>${f.caption}</figcaption>
      ${f.spec ? `<details><summary>Table view</summary><div class="tbl" id="tb-${i}"></div></details>` : ''}
    </figure>`).join('');
  DATA.extra_figs.forEach((f, i) => {
    if (!f.spec) return;
    const rws = []; f.spec.series.forEach(sr => sr.points.forEach(p => rws.push([sr.label, p.x, p.y == null ? '–' : p.y.toFixed(3), p.lo != null ? `${p.lo.toFixed(3)} to ${p.hi.toFixed(3)}` : ''])));
    $('#tb-' + i).innerHTML = table(['series', f.spec.xLabel, f.spec.yLabel, 'range over seeds'], rws);
  });
}
fillText();
renderCharts();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderCharts);
new MutationObserver(renderCharts).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
</script>
